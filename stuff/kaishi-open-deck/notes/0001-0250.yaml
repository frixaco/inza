  - id: kaishi-0001-welcome-to-kaishi-1-5k-version-2-4
    type: prompt_response
    prompt: 
      - role: main
        text: Welcome to Kaishi 1.5k! (version 2.4)
        language: en
      - role: context
        label: Sentence
        text: "Kaishi (開始) is a modular Japanese vocabulary deck intended to give beginners a comfortable but modern Anki experience. The deck can easily be modified to suit you and your Japanese learning goals.\n\nYou can check all the deck options on [the deck page](https://github.com/donkuri/Kaishi). On it, you will see how to enable pitch accent if you want it, change the color of the bold words, take out the sentence in front, take out the pictures and so on. Recommended settings can be found [in my guide](https://donkuri.github.io/learn-japanese/setup/#anki-setup).\n\nThe illustrations come from [Irasutoya](https://www.irasutoya.com/). Although we tried our best to get matching pictures with either the word or the sentence, we didn't always succeed.\n\nNow that you have read this, feel free to suspend (or even delete) this card."
        language: ja
    answer: 
      - role: main
        label: Sentence Meaning
        text: Good luck on your Japanese learning journey!
        language: en
      - role: support
        label: Frequency
        text: "0"
    provenance: 
      importer: stuff/convert-kaishi-to-open-deck.ts
      anki_note_id: 1708637439853
      anki_guid: "Ke[$Fd_Z1R"
      anki_note_type: Kaishi 1.5k
      anki_mod: 1776001595
