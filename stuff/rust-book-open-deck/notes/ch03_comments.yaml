notes:
  - id: rust-book-ch03-comments-001
    type: prompt_response
    prompt: |
      What syntax starts a normal Rust line comment?
    answer: |
      `//` starts a comment that continues to the end of the line.
    tags:
      - rust-book
      - ch03
      - comments
      - syntax
    provenance:
      source_file: ch03_comments.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: Comments
      source: rust-book/src/ch03-04-comments.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch03-comments-002
    type: prompt_response
    prompt: |
      Where should a comment go when it explains why a line exists?
    answer: |
      Usually immediately before the line it explains, so the reason is visible before the code being justified.
    tags:
      - rust-book
      - ch03
      - comments
      - concept_boundary
    provenance:
      source_file: ch03_comments.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: Comments
      source: rust-book/src/ch03-04-comments.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch03-comments-003
    type: prompt_response
    prompt: |
      How does the book write a multi-line normal comment?
    answer: |
      Put `//` at the start of each commented line. The `//` comment form runs only to the end of its line.
    tags:
      - rust-book
      - ch03
      - comments
      - syntax
    provenance:
      source_file: ch03_comments.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: Comments
      source: rust-book/src/ch03-04-comments.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch03-comments-004
    type: prompt_response
    prompt: |
      Does the comments section cover documentation comments in detail?
    answer: |
      No. It only mentions that Rust has documentation comments and defers them to Chapter 14.
