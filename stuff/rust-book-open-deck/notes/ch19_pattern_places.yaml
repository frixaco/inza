      compile_status: concept_only
  - id: rust-book-ch19-pattern-places-002
    type: prompt_response
    prompt: |
      What does `while let Some(x) = stack.pop()` express?
    answer: |
      Keep looping while `pop()` returns `Some(x)`, and stop when it returns `None`.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - syntax
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch19-pattern-places-003
    type: prompt_response
    prompt: |
      Why is `enumerate` useful with patterns in a `for` loop?
    answer: |
      It produces `(index, value)` pairs that can be destructured directly in the loop pattern.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - concept_boundary
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
