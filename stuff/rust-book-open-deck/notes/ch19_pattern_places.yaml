  - id: rust-book-ch19-pattern-places-001
    type: prompt_response
    prompt: |
      What kind of pattern is required in a plain `let` binding?
    answer: |
      An irrefutable pattern: one that must match every possible value of the expression.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - syntax
    provenance:
      source_file: ch19_pattern_places.yaml
