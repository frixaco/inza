      compile_status: concept_only
  - id: rust-book-ch19-pattern-places-004
    type: prompt_response
    prompt: |
      How can function parameters destructure a tuple?
    answer: |
      Use a parameter pattern such as `fn print_coordinates(&(x, y): &(i32, i32))` to destructure the referenced tuple.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - syntax
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch19-pattern-places-005
    type: prompt_response
    prompt: |
      What does tuple destructuring in a `let` statement look like?
    answer: |
      ```rust
      fn main() {
          let (x, y, z) = (1, 2, 3);
          println!("{x}, {y}, {z}");
      }
      ```
      The tuple pattern must match the tuple value's shape.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - syntax
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-places-006
    type: prompt_response
    prompt: |
      Why does this tuple destructuring fail?
      
      ```rust
      fn main() {
          let (x, y) = (1, 2, 3);
      }
      ```
    answer: |
      The pattern has two elements but the value has three. Tuple destructuring patterns must match the number of elements unless ignored with `_` or `..`.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - diagnostic
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch19-pattern-places-007
    type: prompt_response
    prompt: |
      What does a `while let` loop over a stack look like?
    answer: |
      ```rust
      fn main() {
          let mut stack = Vec::new();
          stack.push(1);
          stack.push(2);
          stack.push(3);
      
          while let Some(top) = stack.pop() {
              println!("{top}");
          }
      }
      ```
      The loop continues while the pattern matches.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - syntax
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-places-008
    type: prompt_response
    prompt: |
      How does a `for` loop destructure `(index, value)` pairs from `enumerate()`?
    answer: |
      ```rust
      fn main() {
          let v = vec!['a', 'b', 'c'];
          for (index, value) in v.iter().enumerate() {
              println!("{value} is at index {index}");
          }
      }
      ```
      The loop variable position is a pattern.
    tags:
      - rust-book
      - ch19
      - pattern-places
      - syntax
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-places-009
    type: prompt_response
    prompt: |
      What does a function parameter pattern destructuring a referenced tuple look like?
    answer: |
      ```rust
      fn print_coordinates(&(x, y): &(i32, i32)) {
          println!("Current location: ({x}, {y})");
      }
      
      fn main() {
          let point = (3, 5);
          print_coordinates(&point);
      }
      ```
    tags:
      - rust-book
      - ch19
      - pattern-places
      - syntax
    provenance:
      source_file: ch19_pattern_places.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "All the Places Patterns Can Be Used"
      source: rust-book/src/ch19-01-all-the-places-for-patterns.md
      card_type: syntax
      compile_status: compiles
