  - id: rust-book-ch16-threads-001
    type: prompt_response
    prompt: |
      Which function creates a new OS thread in the book examples?
    answer: |
      ```rust
      let handle = std::thread::spawn(|| {
          println!("hi from a spawned thread");
      });
      handle.join().unwrap();
      ```
      `thread::spawn(|| { ... })`.
    tags:
