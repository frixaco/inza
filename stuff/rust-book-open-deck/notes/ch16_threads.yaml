      compile_status: compiles
  - id: rust-book-ch16-threads-003
    type: prompt_response
    prompt: |
      What makes output from spawned and main threads appear interleaved?
    answer: |
      The threads run concurrently, and scheduling order is not deterministic.
    tags:
      - rust-book
      - ch16
      - threads
      - prediction
    provenance:
      source_file: ch16_threads.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Using Threads to Run Code Simultaneously"
      source: rust-book/src/ch16-01-threads.md
      card_type: prediction
      compile_status: concept_only
  - id: rust-book-ch16-threads-004
    type: prompt_response
    prompt: |
      Why does this spawned closure need `move`?
      
      ```rust
      use std::thread;
      
      fn main() {
          let v = vec![1, 2, 3];
      
          let handle = thread::spawn(|| {
              println!("Here's a vector: {v:?}");
          });
      
          handle.join().unwrap();
      }
      ```
    answer: |
      The spawned thread may outlive the current function, so the closure must take ownership of captured values instead of borrowing them.
    tags:
      - rust-book
      - ch16
      - threads
      - diagnostic
    provenance:
      source_file: ch16_threads.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Using Threads to Run Code Simultaneously"
      source: rust-book/src/ch16-01-threads.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch16-threads-005
    type: prompt_response
    prompt: |
      Why can placing `join` immediately after `spawn` remove concurrency?
    answer: |
      The main thread waits right away, so it cannot do its own work concurrently with the spawned thread.
    tags:
      - rust-book
      - ch16
      - threads
      - concept_boundary
    provenance:
      source_file: ch16_threads.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Using Threads to Run Code Simultaneously"
      source: rust-book/src/ch16-01-threads.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch16-threads-006
    type: prompt_response
    prompt: |
      What does the book show can happen to a spawned thread when `main` exits without joining it?
    answer: |
      The spawned thread is stopped when the main thread ends, even if the spawned thread has not finished its work.
    tags:
      - rust-book
      - ch16
      - threads
      - prediction
    provenance:
      source_file: ch16_threads.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Using Threads to Run Code Simultaneously"
      source: rust-book/src/ch16-01-threads.md
