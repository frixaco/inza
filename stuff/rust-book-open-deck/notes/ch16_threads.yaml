  - id: rust-book-ch16-threads-009
    type: prompt_response
    prompt: |
      What does `thread::sleep(Duration::from_millis(1))` do in the thread examples?
    answer: |
      It stops the current thread briefly, giving another thread a chance to run and making interleaving visible.
