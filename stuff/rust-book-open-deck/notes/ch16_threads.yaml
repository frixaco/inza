      compile_status: concept_only
  - id: rust-book-ch16-threads-007
    type: prompt_response
    prompt: |
      Which value returned by `thread::spawn` lets code wait for a thread to finish?
    answer: |
      `JoinHandle` is the owned value returned by `thread::spawn`; calling `join` on it waits for the associated thread to finish and yields the thread's result.
    tags:
      - rust-book
      - ch16
      - threads
      - definition
    provenance:
      source_file: ch16_threads.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Using Threads to Run Code Simultaneously"
      source: rust-book/src/ch16-01-threads.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch16-threads-008
    type: prompt_response
    prompt: |
      After adding `move` to a spawned closure that captures `v`, why can't the main thread still use `v`?
    answer: |
      `move` transfers ownership of `v` into the closure. Ownership rules still apply, so the original thread cannot use `v` after it has been moved.
    tags:
      - rust-book
      - ch16
      - threads
      - diagnostic
    provenance:
