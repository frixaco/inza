  - id: rust-book-ch03-common-programming-concepts-002
    type: prompt_response
    prompt: |
      Does Rust infer every type so annotations are never needed?
    answer: |
      No. Rust often infers types, but annotations are needed when multiple types are possible or when a signature requires them.
