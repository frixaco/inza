      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-006
    type: prompt_response
    prompt: |
      What responsibilities should remain in `main` after the minigrep refactor?
    answer: |
      Parse arguments, set up configuration, call `run`, and handle any error returned by `run`.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - project_architecture
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
