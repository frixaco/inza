  - id: rust-book-ch12-modularity-error-handling-011
    type: prompt_response
    prompt: |
      Why does `run` return `Ok(())` on success?
    answer: |
      The function's useful work is side effects such as printing matches, so the success case has no value to return; `()` communicates that.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - concept_boundary
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Refactoring to Improve Modularity and Error Handling"
      source: rust-book/src/ch12-03-improving-error-handling-and-modularity.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-012
    type: prompt_response
    prompt: |
      What changes when the minigrep logic moves from `main.rs` into `lib.rs`?
    answer: |
      The binary crate keeps CLI setup and error reporting, while the library crate owns the searchable logic and can be tested with ordinary unit tests.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - evolution
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Refactoring to Improve Modularity and Error Handling"
      source: rust-book/src/ch12-03-improving-error-handling-and-modularity.md
      card_type: evolution
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-013
    type: prompt_response
    prompt: |
      Why does `main` use `if let Err(e) = run(config)` instead of `unwrap_or_else`?
    answer: |
      `run` returns `()` on success, so there is no useful value to unwrap. `if let` handles only the error case directly.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - comparison
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Refactoring to Improve Modularity and Error Handling"
      source: rust-book/src/ch12-03-improving-error-handling-and-modularity.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-014
    type: prompt_response
    prompt: |
      Why does `Config` own `String` values after the early refactor instead of borrowing `&str` from `args`?
    answer: |
      Returning references into the local `args` vector would violate borrowing rules once `args` is dropped. Cloning gives `Config` owned values with a straightforward lifetime.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - concept_boundary
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Refactoring to Improve Modularity and Error Handling"
      source: rust-book/src/ch12-03-improving-error-handling-and-modularity.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-015
    type: prompt_response
    prompt: |
      What limitation does the book note about collecting all search results into a `Vec`?
    answer: |
      It means results are accumulated before printing. For very large files, printing or streaming matches as they are found could use less memory.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - project_architecture
