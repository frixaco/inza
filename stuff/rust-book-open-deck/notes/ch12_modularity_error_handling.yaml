notes:
  - id: rust-book-ch12-modularity-error-handling-001
    type: prompt_response
    prompt: |
      Why move argument parsing into a `Config` struct?
    answer: |
      It names the parsed settings, keeps related values together, and separates configuration from program execution.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - project_architecture
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Refactoring to Improve Modularity and Error Handling"
      source: rust-book/src/ch12-03-improving-error-handling-and-modularity.md
      card_type: project_architecture
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-002
    type: prompt_response
    prompt: |
      Why change `Config::new` from panicking to returning `Result<Config, &str>`?
    answer: |
      Returning `Result` lets `main` report a user-facing error and exit cleanly instead of crashing with an internal panic.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - comparison
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Refactoring to Improve Modularity and Error Handling"
      source: rust-book/src/ch12-03-improving-error-handling-and-modularity.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-003
    type: prompt_response
    prompt: |
      Why move most logic from `main.rs` into `lib.rs`?
    answer: |
      It leaves `main` responsible for CLI concerns and makes the core behavior testable as a library.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - project_architecture
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
