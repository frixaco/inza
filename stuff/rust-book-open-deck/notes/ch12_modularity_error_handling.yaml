      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-005
    type: prompt_response
    prompt: |
      Why should `run` return `Result<(), Box<dyn Error>>`?
    answer: |
      The success case has no meaningful value, while the error case can carry any error type implementing `Error` behind a trait object.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - concept_boundary
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
