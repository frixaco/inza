      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-007
    type: prompt_response
    prompt: |
      Why is `main.rs` plus `lib.rs` a useful split for a binary project?
    answer: |
      `main.rs` handles running the program, while `lib.rs` holds task logic that can be tested directly.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - project_architecture
    provenance:
      source_file: ch12_modularity_error_handling.yaml
