      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-009
    type: prompt_response
    prompt: |
      Why rename `Config::new` to `Config::build` when argument parsing can fail?
    answer: |
      Many Rust programmers expect `new` not to fail. `build` returning `Result<Config, _>` better communicates that construction can produce an error.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - comparison
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Refactoring to Improve Modularity and Error Handling"
      source: rust-book/src/ch12-03-improving-error-handling-and-modularity.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch12-modularity-error-handling-010
    type: prompt_response
    prompt: |
      Which standard-library function exits the process with a status code in the minigrep error path?
    answer: |
      `process::exit(1)`, where a nonzero code conventionally signals an error to the calling process.
    tags:
      - rust-book
      - ch12
      - modularity-error-handling
      - api_recall
    provenance:
      source_file: ch12_modularity_error_handling.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
