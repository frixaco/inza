      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch05-example-structs-005
    type: prompt_response
    prompt: |
      Why is a tuple less clear than a struct for rectangle dimensions?
    answer: |
      A tuple groups the values but does not name the fields, so callers and readers must remember which position is width and which is height.
    tags:
      - rust-book
      - ch05
      - example-structs
      - comparison
    provenance:
      source_file: ch05_example_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "An Example Program Using Structs"
      source: rust-book/src/ch05-02-example-structs.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch05-example-structs-006
    type: prompt_response
    prompt: |
      Why does `println!("{}", rect1)` fail for a custom `Rectangle` by default?
    answer: |
      ```rust
      struct Rectangle {
          width: u32,
          height: u32,
      }
      
      fn main() {
          let rect1 = Rectangle { width: 30, height: 50 };
          println!("{}", rect1);
      }
      ```
      `{}` uses the `Display` trait, and Rust has no single canonical user-facing format for arbitrary structs. Use `Debug` with `#[derive(Debug)]` for developer output or implement `Display` yourself.
    tags:
      - rust-book
      - ch05
      - example-structs
      - diagnostic
    provenance:
      source_file: ch05_example_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "An Example Program Using Structs"
      source: rust-book/src/ch05-02-example-structs.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch05-example-structs-007
    type: prompt_response
    prompt: |
      What is the difference between `{:?}` and `{:#?}` for `Debug` output?
    answer: |
      `{:?}` prints compact debug output. `{:#?}` prints pretty debug output with expanded formatting.
    tags:
      - rust-book
      - ch05
      - example-structs
      - comparison
    provenance:
      source_file: ch05_example_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "An Example Program Using Structs"
      source: rust-book/src/ch05-02-example-structs.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch05-example-structs-008
    type: prompt_response
    prompt: |
      Why does the book call `dbg!(&rect1)` instead of `dbg!(rect1)`?
    answer: |
      `dbg!` takes ownership of the expression and returns it. Passing `&rect1` avoids moving the `Rectangle`, so `rect1` remains usable afterward.
    tags:
