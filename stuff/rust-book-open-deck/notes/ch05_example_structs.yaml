notes:
  - id: rust-book-ch05-example-structs-001
    type: prompt_response
    prompt: |
      What design improvement comes from replacing separate `width` and `height` parameters with a `Rectangle` struct?
    answer: |
      The function signature now says the two values belong together, and callers pass one coherent value instead of unrelated integers.
    tags:
      - rust-book
      - ch05
      - example-structs
      - evolution
    provenance:
      source_file: ch05_example_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
