      compile_status: concept_only
  - id: rust-book-ch05-example-structs-002
    type: prompt_response
    prompt: |
      Which derive attribute lets a struct be printed with the debug formatter?
    answer: |
      `#[derive(Debug)]` enables `{:?}` and `{:#?}` debug formatting for the struct.
    tags:
      - rust-book
      - ch05
      - example-structs
      - api_recall
    provenance:
      source_file: ch05_example_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "An Example Program Using Structs"
