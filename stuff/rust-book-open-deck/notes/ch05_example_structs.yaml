      compile_status: concept_only
  - id: rust-book-ch05-example-structs-003
    type: prompt_response
    prompt: |
      What is the practical difference between `println!("{:?}", rect)` and `dbg!(&rect)`?
    answer: |
      `println!` prints formatted output to stdout. `dbg!` prints file and line info to stderr and returns ownership of the expression value.
    tags:
      - rust-book
      - ch05
      - example-structs
      - comparison
    provenance:
      source_file: ch05_example_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "An Example Program Using Structs"
      source: rust-book/src/ch05-02-example-structs.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch05-example-structs-004
    type: prompt_response
    prompt: |
      Why pass `&Rectangle` to an area function instead of `Rectangle`?
    answer: |
      The function only needs to read the rectangle, so borrowing avoids taking ownership and lets the caller keep using it.
    tags:
      - rust-book
      - ch05
      - example-structs
      - concept_boundary
    provenance:
