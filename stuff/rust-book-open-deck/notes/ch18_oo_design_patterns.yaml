    type: prompt_response
    prompt: |
      Why can't the `State` trait methods return bare `Self` when used as trait objects?
    answer: |
      A trait object erases the concrete state type, and `Self` would not have a known size or concrete return type at compile time. The book uses boxed trait objects instead.
