  - id: rust-book-ch18-oo-design-patterns-014
    type: prompt_response
    prompt: |
      What does a state transition method that consumes the boxed state look like?
    answer: |
      ```rust
      trait State {
          fn request_review(self: Box<Self>) -> Box<dyn State>;
      }
      
      struct Draft;
      struct PendingReview;
      
      impl State for Draft {
          fn request_review(self: Box<Self>) -> Box<dyn State> {
              Box::new(PendingReview)
          }
      }
      
      impl State for PendingReview {
          fn request_review(self: Box<Self>) -> Box<dyn State> {
              self
          }
      }
      ```
      `self: Box<Self>` allows the old state object to be consumed and replaced.
    tags:
      - rust-book
      - ch18
      - oo-design-patterns
      - syntax
    provenance:
      source_file: ch18_oo_design_patterns.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Implementing an Object-Oriented Design Pattern"
      source: rust-book/src/ch18-03-oo-design-patterns.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch18-oo-design-patterns-015
    type: prompt_response
    prompt: |
      What is the type-state workflow shape for publishing a post?
    answer: |
      ```rust
      pub struct Post { content: String }
      pub struct DraftPost { content: String }
      pub struct PendingReviewPost { content: String }
      
      impl Post {
          pub fn new() -> DraftPost {
              DraftPost { content: String::new() }
          }
          pub fn content(&self) -> &str {
              &self.content
          }
      }
      
      impl DraftPost {
          pub fn request_review(self) -> PendingReviewPost {
              PendingReviewPost { content: self.content }
          }
      }
      
      impl PendingReviewPost {
          pub fn approve(self) -> Post {
              Post { content: self.content }
          }
      }
      ```
      The transition methods consume one state type and return the next state type.
    tags:
      - rust-book
      - ch18
      - oo-design-patterns
      - syntax
    provenance:
      source_file: ch18_oo_design_patterns.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Implementing an Object-Oriented Design Pattern"
      source: rust-book/src/ch18-03-oo-design-patterns.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch18-oo-design-patterns-016
    type: prompt_response
    prompt: |
      Why does trying to call `content` on `DraftPost` fail in the type-state rewrite?
      
      ```rust
      pub struct Post { content: String }
      pub struct DraftPost { content: String }
      
      impl Post {
          pub fn new() -> DraftPost {
              DraftPost { content: String::new() }
          }
          pub fn content(&self) -> &str {
              &self.content
          }
      }
      
      fn main() {
          let post = Post::new();
          post.content();
      }
      ```
    answer: |
      `Post::new` returns `DraftPost`, and `DraftPost` has no `content` method. The type system prevents reading draft content.
    tags:
      - rust-book
      - ch18
      - oo-design-patterns
      - diagnostic
