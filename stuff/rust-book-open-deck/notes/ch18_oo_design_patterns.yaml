  - id: rust-book-ch18-oo-design-patterns-013
    type: prompt_response
    prompt: |
      What is the key `Post` field type in the trait-object state-pattern version?
    answer: |
      ```rust
      trait State {}
      
      pub struct Post {
          state: Option<Box<dyn State>>,
          content: String,
      }
      ```
      `Option` lets methods temporarily take ownership of the boxed state during transitions.
