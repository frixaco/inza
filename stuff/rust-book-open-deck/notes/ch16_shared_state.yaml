  - id: rust-book-ch16-shared-state-002
    type: prompt_response
    prompt: |
      What does `lock` return on a `Mutex<T>`?
    answer: |
      ```rust
      use std::sync::Mutex;
      
      let mutex = Mutex::new(0);
      let mut guard = mutex.lock().unwrap();
      *guard += 1;
      ```
      A `LockResult<MutexGuard<T>>`; the guard provides access and unlocks when dropped.
    tags:
      - rust-book
      - ch16
      - shared-state
      - api_recall
    provenance:
