  - id: rust-book-ch16-shared-state-006
    type: prompt_response
    prompt: |
      What two rules does the book emphasize for using a mutex?
    answer: |
      Acquire the lock before using the guarded data, and release the lock when done so other threads can acquire it.
    tags:
