  - id: rust-book-ch16-shared-state-007
    type: prompt_response
    prompt: |
      How does `MutexGuard` help prevent forgetting to unlock a mutex?
    answer: |
      `MutexGuard` releases the lock automatically when it is dropped at the end of its scope.
    tags:
