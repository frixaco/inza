  - id: rust-book-ch16-shared-state-005
    type: prompt_response
    prompt: |
      What risk remains when using `Mutex<T>` correctly?
    answer: |
      Deadlock is still possible if code waits on locks in conflicting orders or never releases a lock.
    tags:
      - rust-book
      - ch16
      - shared-state
