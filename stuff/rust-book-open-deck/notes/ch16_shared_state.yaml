  - id: rust-book-ch16-shared-state-013
    type: prompt_response
    prompt: |
      What wrapper combination does the book use for shared mutable counter access across threads?
    answer: |
      ```rust
      use std::sync::{Arc, Mutex};
      use std::thread;
      
      let counter = Arc::new(Mutex::new(0));
      let mut handles = vec![];
      
      for _ in 0..10 {
          let counter = Arc::clone(&counter);
          handles.push(thread::spawn(move || {
              let mut num = counter.lock().unwrap();
              *num += 1;
          }));
      }
      
      for handle in handles {
          handle.join().unwrap();
      }
      ```
      `Arc<Mutex<i32>>`: `Arc` gives shared ownership across threads, and `Mutex` serializes mutable access to the counter.
    tags:
      - rust-book
      - ch16
      - shared-state
      - syntax
    provenance:
      source_file: ch16_shared_state.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Shared-State Concurrency"
      source: rust-book/src/ch16-03-shared-state.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch16-shared-state-014
    type: prompt_response
    prompt: |
      Why might an atomic integer be more appropriate than `Mutex<i32>` for a simple counter?
    answer: |
      Atomic types can update primitive values without locking a mutex. The book uses `Mutex<i32>` here to teach mutex mechanics, not because it is always the best counter implementation.
