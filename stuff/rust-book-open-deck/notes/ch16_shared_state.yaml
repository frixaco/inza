  - id: rust-book-ch16-shared-state-001
    type: prompt_response
    prompt: |
      What access rule does `Mutex<T>` enforce around shared data?
    answer: |
      Mutual exclusion: only one thread at a time can access the protected data through the lock guard.
    tags:
      - rust-book
      - ch16
      - shared-state
      - invariant
    provenance:
      source_file: ch16_shared_state.yaml
