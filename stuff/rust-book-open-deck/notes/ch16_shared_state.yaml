  - id: rust-book-ch16-shared-state-012
    type: prompt_response
    prompt: |
      Why can `lock().unwrap()` fail on a `Mutex<T>`?
    answer: |
      If another thread panics while holding the lock, the mutex becomes poisoned and `lock` returns an error.
