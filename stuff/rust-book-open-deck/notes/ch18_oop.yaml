  - id: rust-book-ch18-oop-001
    type: prompt_response
    prompt: |
      What is the chapter's stance on object-oriented features in Rust?
    answer: |
      Rust does not mirror class-based OOP, but it supports some object-oriented patterns through structs, enums, traits, and trait objects.
