  - id: rust-book-ch17-async-concurrency-005
    type: prompt_response
    prompt: |
      What does awaiting a spawned task's handle do in the book examples?
    answer: |
      It waits for the spawned task to finish and returns that task's result, preventing the main future from ending too early.
    tags:
      - rust-book
