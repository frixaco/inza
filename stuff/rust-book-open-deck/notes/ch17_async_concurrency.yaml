      card_type: prediction
      compile_status: concept_only
  - id: rust-book-ch17-async-concurrency-007
    type: prompt_response
    prompt: |
      Why does receiving from the async channel use `recv().await`?
    answer: |
      `recv` returns a future because a message may not be available yet. Awaiting it yields until a message arrives or the channel closes.
    tags:
      - rust-book
      - ch17
      - async-concurrency
      - concept_boundary
    provenance:
