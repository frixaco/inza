  - id: rust-book-ch17-async-concurrency-006
    type: prompt_response
    prompt: |
      What happens if send and receive operations are written one after another in the same async block?
    answer: |
      They are not automatically concurrent. Code inside one async block still runs in source order between await points. The book splits sender and receiver work into separate async blocks or tasks to let them make progress concurrently.
    tags:
      - rust-book
      - ch17
      - async-concurrency
      - prediction
    provenance:
      source_file: ch17_async_concurrency.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
