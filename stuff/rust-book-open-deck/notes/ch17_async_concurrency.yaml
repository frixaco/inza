  - id: rust-book-ch17-async-concurrency-003
    type: prompt_response
    prompt: |
      Why can async concurrency run many tasks on fewer threads?
    answer: |
      Tasks yield at await points instead of blocking an OS thread, so an executor can poll other ready tasks.
    tags:
      - rust-book
      - ch17
      - async-concurrency
      - concept_boundary
    provenance:
