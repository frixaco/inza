  - id: rust-book-ch17-async-concurrency-001
    type: prompt_response
    prompt: |
      What is the difference between awaiting futures sequentially and joining them?
    answer: |
      Sequential awaiting waits for one future before starting or polling the next. Joining polls multiple futures so they can progress concurrently.
    tags:
      - rust-book
      - ch17
      - async-concurrency
      - comparison
    provenance:
      source_file: ch17_async_concurrency.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
