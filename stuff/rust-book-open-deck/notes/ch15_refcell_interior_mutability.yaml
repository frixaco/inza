  - id: rust-book-ch15-refcell-interior-mutability-007
    type: prompt_response
    prompt: |
      When is `RefCell<T>` useful despite runtime borrow-checking costs?
    answer: |
      When you know the borrowing rules are followed but the compiler cannot prove it, such as mutating internal test state through an immutable trait method.
    tags:
