  - id: rust-book-ch15-refcell-interior-mutability-006
    type: prompt_response
    prompt: |
      What must be true for a safe API using interior mutability to remain sound?
    answer: |
      The runtime borrow rules must still be followed even though the compiler cannot prove them. The unsafe internals are wrapped so safe callers cannot violate memory safety.
    tags:
      - rust-book
      - ch15
      - refcell-interior-mutability
      - invariant
    provenance:
      source_file: ch15_refcell_interior_mutability.yaml
