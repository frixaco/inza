  - id: rust-book-ch15-refcell-interior-mutability-012
    type: prompt_response
    prompt: |
      What happens if you call `borrow_mut` twice on the same `RefCell<T>` while the first mutable borrow is still active?
    answer: |
      It panics at runtime with a borrow error.
      ```rust
      use std::cell::RefCell;
      
      fn main() {
          let value = RefCell::new(5);
          let one_borrow = value.borrow_mut();
          let two_borrow = value.borrow_mut();
      }
      ```
    tags:
      - rust-book
      - ch15
      - refcell-interior-mutability
      - prediction
    provenance:
      source_file: ch15_refcell_interior_mutability.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "RefCell<T> and the Interior Mutability Pattern"
      source: rust-book/src/ch15-05-interior-mutability.md
      card_type: prediction
      compile_status: compiles
  - id: rust-book-ch15-refcell-interior-mutability-013
    type: prompt_response
    prompt: |
      What does `Rc<RefCell<i32>>` shared mutation look like?
    answer: |
      ```rust
      use std::cell::RefCell;
      use std::rc::Rc;
      
      fn main() {
          let value = Rc::new(RefCell::new(5));
          let a = Rc::clone(&value);
          let b = Rc::clone(&value);
      
          *value.borrow_mut() += 10;
      
          assert_eq!(*a.borrow(), 15);
          assert_eq!(*b.borrow(), 15);
      }
      ```
      `Rc` shares ownership; `RefCell` permits checked mutation of the shared value.
    tags:
      - rust-book
      - ch15
      - refcell-interior-mutability
      - syntax
