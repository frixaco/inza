  - id: rust-book-ch15-refcell-interior-mutability-008
    type: prompt_response
    prompt: |
      Is `RefCell<T>` appropriate for sharing mutable state across threads?
    answer: |
      No. `RefCell<T>` is for single-threaded scenarios. For multithreaded shared mutation, use synchronization types such as `Mutex<T>` with `Arc<T>`.
    tags:
