      source: rust-book/src/ch15-05-interior-mutability.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch15-refcell-interior-mutability-003
    type: prompt_response
    prompt: |
      Why does `RefCell<T>` panic if it receives two active mutable borrows at runtime?
    answer: |
      It panics at runtime because the dynamic borrow rules are violated.
    tags:
