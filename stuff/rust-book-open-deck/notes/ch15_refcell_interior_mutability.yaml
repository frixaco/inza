  - id: rust-book-ch15-refcell-interior-mutability-001
    type: prompt_response
    prompt: |
      Which pattern lets Rust mutate data through an immutable outer value?
    answer: |
      Interior mutability lets data be mutated through an immutable outer value while enforcing borrowing rules at runtime.
    tags:
      - rust-book
