      source: rust-book/src/ch15-05-interior-mutability.md
      card_type: api_recall
      compile_status: compiles
  - id: rust-book-ch15-refcell-interior-mutability-005
    type: prompt_response
    prompt: |
      Why use `RefCell<T>` in mock objects in the book?
    answer: |
      The trait method takes `&self`, but the mock needs to record calls; `RefCell` permits that internal mutation while preserving the trait signature.
    tags:
      - rust-book
