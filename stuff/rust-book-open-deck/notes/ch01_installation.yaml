  - id: rust-book-ch01-installation-004
    type: prompt_response
    prompt: |
      In Rust Book command examples, should you type the leading `$` or `>` prompt character?
    answer: |
      No. `$` and `>` mark shell prompts; they show where a command begins. Lines without a prompt usually show command output.
    tags:
      - rust-book
      - ch01
      - installation
