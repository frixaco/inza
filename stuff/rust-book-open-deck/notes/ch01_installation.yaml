  - id: rust-book-ch01-installation-007
    type: prompt_response
    prompt: |
      Why do the Rust Book examples still work with newer stable Rust versions even if some output changes?
    answer: |
      Rust's stability guarantees preserve compiling code on stable Rust. Error messages and warnings may change, so output text is less stable than the language behavior.
    tags:
