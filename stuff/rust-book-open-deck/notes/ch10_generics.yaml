  - id: rust-book-ch10-generics-002
    type: prompt_response
    prompt: |
      How do traits and lifetimes complement generic types?
    answer: |
      Generic types abstract over concrete types; traits bound required behavior; lifetimes describe relationships between references.
    tags:
