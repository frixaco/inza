notes:
  - id: rust-book-ch07-packages-and-crates-001
    type: prompt_response
    prompt: |
      What unit of code does the Rust compiler consider at a time?
    answer: |
      A crate is the smallest amount of code the Rust compiler considers at a time; it can be a binary crate or a library crate.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - definition
    provenance:
      source_file: ch07_packages_and_crates.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Packages and Crates"
      source: rust-book/src/ch07-01-packages-and-crates.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch07-packages-and-crates-002
    type: prompt_response
    prompt: |
      What does a Cargo package bundle together?
    answer: |
      A package is a bundle of one or more crates plus a `Cargo.toml` describing how to build them.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - definition
    provenance:
      source_file: ch07_packages_and_crates.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Packages and Crates"
      source: rust-book/src/ch07-01-packages-and-crates.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch07-packages-and-crates-003
    type: prompt_response
    prompt: |
      What crate composition rules does a Cargo package have?
    answer: |
      A package can contain at most one library crate, can contain any number of binary crates, and must contain at least one crate.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - invariant
    provenance:
      source_file: ch07_packages_and_crates.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Packages and Crates"
      source: rust-book/src/ch07-01-packages-and-crates.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch07-packages-and-crates-004
    type: prompt_response
    prompt: |
      Which files are conventional crate roots for a Cargo package?
    answer: |
      `src/main.rs` is the crate root for a binary crate. `src/lib.rs` is the crate root for a library crate.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - api_recall
    provenance:
      source_file: ch07_packages_and_crates.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Packages and Crates"
      source: rust-book/src/ch07-01-packages-and-crates.md
      card_type: api_recall
      compile_status: non_rust
  - id: rust-book-ch07-packages-and-crates-005
    type: prompt_response
    prompt: |
      What is the difference between a binary crate and a library crate?
    answer: |
      A binary crate compiles to an executable and must have a `main` function. A library crate exposes functionality for other code and does not have a `main` function.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - comparison
    provenance:
      source_file: ch07_packages_and_crates.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Packages and Crates"
      source: rust-book/src/ch07-01-packages-and-crates.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch07-packages-and-crates-006
    type: prompt_response
    prompt: |
      What role does a crate root source file play?
    answer: |
      The crate root is the source file where the compiler starts and which forms the root module of the crate.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - definition
    provenance:
      source_file: ch07_packages_and_crates.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Packages and Crates"
      source: rust-book/src/ch07-01-packages-and-crates.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch07-packages-and-crates-007
    type: prompt_response
    prompt: |
      Where does Cargo look for extra binary crates in a package?
    answer: |
      Files in `src/bin/`; each file there is compiled as a separate binary crate.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - api_recall
    provenance:
      source_file: ch07_packages_and_crates.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Packages and Crates"
      source: rust-book/src/ch07-01-packages-and-crates.md
      card_type: api_recall
      compile_status: non_rust
  - id: rust-book-ch07-packages-and-crates-008
    type: prompt_response
    prompt: |
      What does a package contain by convention if it has both `src/main.rs` and `src/lib.rs`?
    answer: |
      Two crates: a binary crate and a library crate, both with the same name as the package by default.
    tags:
      - rust-book
      - ch07
      - packages-and-crates
      - prediction
