notes:
  - id: rust-book-ch11-test-organization-001
    type: prompt_response
    prompt: |
      What is the difference between unit tests and integration tests in Rust?
    answer: |
      Unit tests live near the code and can test private items. Integration tests live in `tests/` and use the library as an external crate.
    tags:
      - rust-book
      - ch11
      - test-organization
      - comparison
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch11-test-organization-002
    type: prompt_response
    prompt: |
      Where do unit tests conventionally live in a source file?
    answer: |
      ```rust
      #[cfg(test)]
      mod tests {
          #[test]
          fn it_works() {
              assert_eq!(2 + 2, 4);
          }
      }
      ```
      Inside a `#[cfg(test)] mod tests { ... }` module.
    tags:
      - rust-book
      - ch11
      - test-organization
      - syntax
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch11-test-organization-003
    type: prompt_response
    prompt: |
      What does `#[cfg(test)]` restrict to test builds?
    answer: |
      It compiles the annotated test module only when running tests, not during normal builds.
    tags:
      - rust-book
      - ch11
      - test-organization
      - definition
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch11-test-organization-004
    type: prompt_response
    prompt: |
      Why put shared integration-test helper code in `tests/common/mod.rs` instead of `tests/common.rs`?
    answer: |
      A file directly under `tests/` is treated as an integration test crate. A module file under a directory can be imported by tests without being run as its own test crate.
    tags:
      - rust-book
      - ch11
      - test-organization
      - project_architecture
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: project_architecture
      compile_status: concept_only
  - id: rust-book-ch11-test-organization-005
    type: prompt_response
    prompt: |
      Why can unit tests test private functions?
    answer: |
      ```rust
      fn internal_adder(left: u64, right: u64) -> u64 {
          left + right
      }
      
      #[cfg(test)]
      mod tests {
          use super::*;
      
          #[test]
          fn internal() {
              assert_eq!(4, internal_adder(2, 2));
          }
      }
      ```
      The `tests` module is a child module of the code being tested, and child modules can access items in their ancestor modules.
    tags:
      - rust-book
      - ch11
      - test-organization
      - concept_boundary
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: concept_boundary
      compile_status: compiles
  - id: rust-book-ch11-test-organization-006
    type: prompt_response
    prompt: |
      How does Cargo treat each file directly inside `tests/`?
    answer: |
      Each file directly in `tests/` is compiled as a separate integration test crate.
    tags:
      - rust-book
      - ch11
      - test-organization
      - invariant
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: invariant
      compile_status: non_rust
  - id: rust-book-ch11-test-organization-007
    type: prompt_response
    prompt: |
      How do you run all tests in a specific integration test file?
    answer: |
      Use Cargo's `--test` option with the file stem, such as `cargo test --test integration_test`.
    tags:
      - rust-book
      - ch11
      - test-organization
      - api_recall
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: api_recall
      compile_status: non_rust
  - id: rust-book-ch11-test-organization-008
    type: prompt_response
    prompt: |
      Do integration tests need `#[cfg(test)]`?
    answer: |
      No. Cargo treats the `tests/` directory specially and compiles integration tests only when running `cargo test`.
    tags:
      - rust-book
      - ch11
      - test-organization
      - concept_boundary
    provenance:
      source_file: ch11_test_organization.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "Test Organization"
      source: rust-book/src/ch11-03-test-organization.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch11-test-organization-009
    type: prompt_response
    prompt: |
      Why are integration tests mainly for library crates?
    answer: |
      Integration tests import the crate under test as an external crate. Binary-only crates do not expose functions for integration tests to import, which is why projects often keep reusable logic in `src/lib.rs`.
    tags:
      - rust-book
      - ch11
      - test-organization
      - project_architecture
