  - id: rust-book-ch17-many-futures-003
    type: prompt_response
    prompt: |
      Why does polling many futures often require pinning?
    answer: |
      Self-referential or address-sensitive futures must not be moved after polling; `Pin` encodes that stability requirement.
    tags:
      - rust-book
      - ch17
      - many-futures
      - invariant
    provenance:
