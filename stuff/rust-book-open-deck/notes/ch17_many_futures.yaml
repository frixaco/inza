  - id: rust-book-ch17-many-futures-013
    type: prompt_response
    prompt: |
      Why does this vector of async blocks fail even though both futures output `()`?
      
      ```rust
      fn main() {
          let futures = vec![
              async {},
              async {},
          ];
      }
      ```
    answer: |
      Each async block has a unique anonymous type. `Vec<T>` needs all elements to have one concrete type, so the futures need a common wrapper such as a pinned boxed trait object.
    tags:
      - rust-book
      - ch17
      - many-futures
      - diagnostic
    provenance:
      source_file: ch17_many_futures.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "Working With Any Number of Futures"
      source: rust-book/src/ch17-03-more-futures.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch17-many-futures-014
    type: prompt_response
    prompt: |
      What standard-library type shape can store heterogeneous async-block futures in one vector?
    answer: |
      ```rust
      use std::future::Future;
      use std::pin::Pin;
      
      fn main() {
          let futures: Vec<Pin<Box<dyn Future<Output = ()>>>> = vec![
              Box::pin(async {}),
              Box::pin(async {}),
          ];
      }
      ```
      `Pin<Box<dyn Future<Output = ()>>>` gives the vector a single concrete element type.
    tags:
      - rust-book
      - ch17
      - many-futures
      - syntax
    provenance:
