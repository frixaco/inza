  - id: rust-book-ch17-many-futures-009
    type: prompt_response
    prompt: |
      What tradeoff can explicit yielding introduce in compute-heavy async code?
    answer: |
      Yielding improves responsiveness and fairness, but too many yield points can add overhead and make compute-bound work slower.
    tags:
