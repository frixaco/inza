  - id: rust-book-ch17-many-futures-007
    type: prompt_response
    prompt: |
      Why can a long compute loop inside an async task starve other async work?
    answer: |
      If the loop has no await points, the task does not yield control back to the runtime. Other tasks may not be polled until the loop finishes.
    tags:
      - rust-book
      - ch17
      - many-futures
      - diagnostic
    provenance:
