      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch17-many-futures-002
    type: prompt_response
    prompt: |
      How can different future types be stored in one collection?
    answer: |
      Use trait objects such as `Pin<Box<dyn Future<Output = ()>>>`, or a helper that boxes futures into a common type.
    tags:
      - rust-book
      - ch17
