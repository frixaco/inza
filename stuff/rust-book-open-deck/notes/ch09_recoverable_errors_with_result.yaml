  - id: rust-book-ch09-recoverable-errors-with-result-005
    type: prompt_response
    prompt: |
      What is the boundary between `File::open(...).unwrap()` and matching on `File::open(...)`?
    answer: |
      `unwrap` is concise but panics on failure. Matching lets code handle different errors, such as creating the file when it was not found.
    tags:
