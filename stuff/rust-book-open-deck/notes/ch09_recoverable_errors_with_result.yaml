  - id: rust-book-ch09-recoverable-errors-with-result-004
    type: prompt_response
    prompt: |
      What must be true for a function body to use `?` on a `Result`?
    answer: |
      The enclosing function must return `Result` or another type compatible with `?`, so the error can be returned to the caller.
    tags:
      - rust-book
