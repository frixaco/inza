  - id: rust-book-ch09-recoverable-errors-with-result-017
    type: prompt_response
    prompt: |
      What `main` signature lets the book use `?` on `Result` values?
    answer: |
      ```rust
      use std::error::Error;
      
      fn main() -> Result<(), Box<dyn Error>> {
          Ok(())
      }
      ```
      In the book, `Box<dyn Error>` means “any kind of error” at this stage.
    tags:
      - rust-book
