  - id: rust-book-ch09-recoverable-errors-with-result-001
    type: prompt_response
    prompt: |
      What success-or-failure shape does `Result<T, E>` represent?
    answer: |
      ```rust
      enum ResultShape<T, E> {
          Ok(T),
          Err(E),
      }
      ```
      Either `Ok(T)` for success with a value or `Err(E)` for failure with error information.
    tags:
