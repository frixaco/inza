  - id: rust-book-ch09-recoverable-errors-with-result-015
    type: prompt_response
    prompt: |
      How can opening a file and then reading it be shortened with method chaining and `?`?
    answer: |
      ```rust
      use std::fs::File;
      use std::io::{self, Read};
      
      fn read_username_from_file() -> Result<String, io::Error> {
          let mut username = String::new();
          File::open("hello.txt")?.read_to_string(&mut username)?;
          Ok(username)
      }
      ```
    tags:
