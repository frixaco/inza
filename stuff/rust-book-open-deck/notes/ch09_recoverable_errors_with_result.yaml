  - id: rust-book-ch09-recoverable-errors-with-result-003
    type: prompt_response
    prompt: |
      How does the `?` operator simplify propagating an error?
    answer: |
      It returns the inner success value on `Ok`, or returns the error from the current function on `Err` after applying the needed conversion.
    tags:
      - rust-book
      - ch09
      - recoverable-errors-with-result
      - transformation
