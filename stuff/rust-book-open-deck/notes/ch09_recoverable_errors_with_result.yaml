  - id: rust-book-ch09-recoverable-errors-with-result-018
    type: prompt_response
    prompt: |
      What exit status does Rust produce when `main() -> Result<(), E>` returns `Ok(())` or `Err`?
    answer: |
      Returning `Ok(())` exits with status 0. Returning `Err` exits with a nonzero status.
    tags:
      - rust-book
      - ch09
      - recoverable-errors-with-result
      - prediction
    provenance:
