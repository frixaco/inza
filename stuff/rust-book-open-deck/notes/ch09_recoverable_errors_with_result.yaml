  - id: rust-book-ch09-recoverable-errors-with-result-012
    type: prompt_response
    prompt: |
      Why can't `?` on a `Result` be used in a function returning `()`?
      
      ```rust
      use std::fs::File;
      
      fn main() {
          let greeting_file = File::open("hello.txt")?;
      }
      ```
    answer: |
      `?` may return an `Err` early, so the enclosing function must return `Result` or another compatible type such as one implementing `FromResidual`.
    tags:
      - rust-book
      - ch09
      - recoverable-errors-with-result
      - diagnostic
    provenance:
      source_file: ch09_recoverable_errors_with_result.yaml
      chapter: "Chapter 9: Error Handling"
      section: "Recoverable Errors with Result"
      source: rust-book/src/ch09-02-recoverable-errors-with-result.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch09-recoverable-errors-with-result-013
    type: prompt_response
    prompt: |
      How does `?` behave differently on `Option<T>` than on `Result<T, E>`?
    answer: |
      ```rust
      fn last_char_of_first_line(text: &str) -> Option<char> {
          text.lines().next()?.chars().last()
      }
      ```
      It returns the inner value for `Some`, or returns `None` early from the enclosing function if the value is `None`.
    tags:
      - rust-book
      - ch09
      - recoverable-errors-with-result
      - comparison
    provenance:
      source_file: ch09_recoverable_errors_with_result.yaml
      chapter: "Chapter 9: Error Handling"
      section: "Recoverable Errors with Result"
      source: rust-book/src/ch09-02-recoverable-errors-with-result.md
      card_type: comparison
      compile_status: compiles
