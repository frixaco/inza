      source: rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md
      card_type: api_recall
      compile_status: non_rust
  - id: rust-book-ch07-modules-privacy-007
    type: prompt_response
    prompt: |
      What is the root of every crate's module tree called?
    answer: |
      The implicit root module is named `crate`.
    tags:
      - rust-book
      - ch07
      - modules-privacy
      - definition
    provenance:
      source_file: ch07_modules_privacy.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
