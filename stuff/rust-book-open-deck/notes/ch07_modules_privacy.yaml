  - id: rust-book-ch07-modules-privacy-008
    type: prompt_response
    prompt: |
      What is the difference between sibling, parent, and child modules?
    answer: |
      A child module is nested inside a parent module. Sibling modules are defined in the same parent module.
    tags:
      - rust-book
      - ch07
      - modules-privacy
      - comparison
    provenance:
      source_file: ch07_modules_privacy.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Control Scope and Privacy with Modules"
      source: rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch07-modules-privacy-009
    type: prompt_response
    prompt: |
      Why use modules instead of leaving all code in one file?
    answer: |
      Modules group related definitions, name relationships between code, control scope, and choose which implementation details are public or private.
    tags:
      - rust-book
      - ch07
      - modules-privacy
      - project_architecture
