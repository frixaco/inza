      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch15-reference-cycles-002
    type: prompt_response
    prompt: |
      What does an `Rc<RefCell<T>>` reference cycle do to memory?
    answer: |
      The values are never dropped, causing a memory leak even though Rust prevents memory unsafety.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - prediction
    provenance:
      source_file: ch15_reference_cycles.yaml
