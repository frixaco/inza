  - id: rust-book-ch15-reference-cycles-005
    type: prompt_response
    prompt: |
      Why should parent links in a tree often use `Weak<T>`?
    answer: |
      Children should not keep parents alive just by pointing back to them; weak parent links avoid ownership cycles.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - project_architecture
    provenance:
      source_file: ch15_reference_cycles.yaml
      chapter: "Chapter 15: Smart Pointers"
