      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch15-reference-cycles-004
    type: prompt_response
    prompt: |
      Why does `Weak<T>::upgrade` return `Option<Rc<T>>`?
    answer: |
      The allocation may already have been dropped if no strong owners remain, so upgrade can fail with `None`.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - concept_boundary
    provenance:
      source_file: ch15_reference_cycles.yaml
      chapter: "Chapter 15: Smart Pointers"
