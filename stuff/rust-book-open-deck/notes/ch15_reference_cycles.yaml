  - id: rust-book-ch15-reference-cycles-006
    type: prompt_response
    prompt: |
      What pointer-count change does `Rc::downgrade(&value)` make?
    answer: |
      ```rust
      use std::rc::Rc;
      
      let value = Rc::new(5);
      let weak = Rc::downgrade(&value);
      assert_eq!(Rc::strong_count(&value), 1);
      assert_eq!(Rc::weak_count(&value), 1);
      ```
      It creates a `Weak<T>` pointer and increments the weak count, not the strong count.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - invariant
    provenance:
      source_file: ch15_reference_cycles.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Reference Cycles Can Leak Memory"
      source: rust-book/src/ch15-06-reference-cycles.md
      card_type: invariant
      compile_status: compiles
  - id: rust-book-ch15-reference-cycles-007
    type: prompt_response
    prompt: |
      What does a nonzero weak count do to an `Rc<T>` allocation's inner value?
    answer: |
      It does not keep the inner value alive. The inner value is dropped when the strong count reaches zero; weak references only let code try to observe whether a strong value still exists.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - prediction
    provenance:
      source_file: ch15_reference_cycles.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Reference Cycles Can Leak Memory"
      source: rust-book/src/ch15-06-reference-cycles.md
      card_type: prediction
      compile_status: concept_only
  - id: rust-book-ch15-reference-cycles-008
    type: prompt_response
    prompt: |
      Why does a tree node often use `Rc<Node>` for children but `Weak<Node>` for the parent?
    answer: |
      A parent owns its children, so children can be strong references. A child should only observe its parent; making the parent link weak prevents a parent-child ownership cycle.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - diagnostic
    provenance:
      source_file: ch15_reference_cycles.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Reference Cycles Can Leak Memory"
      source: rust-book/src/ch15-06-reference-cycles.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch15-reference-cycles-009
    type: prompt_response
    prompt: |
      What syntax creates a weak reference from an `Rc<T>` and tries to upgrade it?
    answer: |
      ```rust
      use std::rc::{Rc, Weak};
      
      fn main() {
          let strong = Rc::new(5);
          let weak: Weak<i32> = Rc::downgrade(&strong);
      
          let upgraded = weak.upgrade();
          assert_eq!(*upgraded.unwrap(), 5);
      }
      ```
      `Rc::downgrade` increments the weak count; `upgrade` returns `Option<Rc<T>>`.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - syntax
    provenance:
      source_file: ch15_reference_cycles.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Reference Cycles Can Leak Memory"
      source: rust-book/src/ch15-06-reference-cycles.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch15-reference-cycles-010
    type: prompt_response
    prompt: |
      What field types model a tree where parents own children but children weakly refer to parents?
    answer: |
      ```rust
      use std::cell::RefCell;
      use std::rc::{Rc, Weak};
      
      struct Node {
          value: i32,
          parent: RefCell<Weak<Node>>,
          children: RefCell<Vec<Rc<Node>>>,
      }
      ```
      Children are strong `Rc<Node>` links; the parent pointer is `Weak<Node>` inside a `RefCell` so it can be set after construction.
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - syntax
    provenance:
      source_file: ch15_reference_cycles.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Reference Cycles Can Leak Memory"
      source: rust-book/src/ch15-06-reference-cycles.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch15-reference-cycles-011
    type: prompt_response
    prompt: |
      What does `weak.upgrade()` return after all strong owners have been dropped?
    answer: |
      It returns `None`.
      ```rust
      use std::rc::{Rc, Weak};
      
      fn main() {
          let weak: Weak<i32>;
          {
              let strong = Rc::new(5);
              weak = Rc::downgrade(&strong);
              assert!(weak.upgrade().is_some());
          }
          assert!(weak.upgrade().is_none());
      }
      ```
    tags:
      - rust-book
      - ch15
      - reference-cycles
      - prediction
    provenance:
