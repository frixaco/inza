      compile_status: compiles
  - id: rust-book-ch03-control-flow-005
    type: prompt_response
    prompt: |
      How do you return a value from a `loop` expression?
    answer: |
      ```rust
      let mut counter = 0;
      
      let result = loop {
          counter += 1;
          if counter == 10 {
              break counter * 2;
          }
      };
      ```
      `break value;` returns `value` from the loop expression.
    tags:
      - rust-book
      - ch03
      - control-flow
      - syntax
    provenance:
      source_file: ch03_control_flow.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: "Control Flow"
      source: rust-book/src/ch03-05-control-flow.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch03-control-flow-006
    type: prompt_response
    prompt: |
      What does a loop label let you do?
    answer: |
      A loop label such as `'counting_up: loop { ... }` lets `break 'counting_up;` or `continue 'counting_up;` target that loop instead of the innermost loop.
    tags:
      - rust-book
      - ch03
      - control-flow
      - syntax
    provenance:
      source_file: ch03_control_flow.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: "Control Flow"
      source: rust-book/src/ch03-05-control-flow.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch03-control-flow-007
    type: prompt_response
    prompt: |
      In an `else if` chain, what happens after Rust finds the first condition that evaluates to `true`?
    answer: |
      Rust runs that block and does not check the remaining conditions in the chain.
    tags:
      - rust-book
      - ch03
      - control-flow
      - prediction
    provenance:
