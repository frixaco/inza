      compile_status: concept_only
  - id: rust-book-ch03-control-flow-004
    type: prompt_response
    prompt: |
      What is the basic `for` loop syntax for iterating over every element of an array?
    answer: |
      ```rust
      let a = [10, 20, 30, 40, 50];
      
      for element in a {
          println!("the value is: {element}");
      }
      ```
    tags:
      - rust-book
      - ch03
      - control-flow
      - syntax
    provenance:
