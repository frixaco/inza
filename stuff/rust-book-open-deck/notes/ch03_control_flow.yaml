      compile_status: concept_only
  - id: rust-book-ch03-control-flow-014
    type: prompt_response
    prompt: |
      What happens when `break 'counting_up;` runs inside an inner loop?
    answer: |
      It exits the loop labeled `'counting_up`, not just the innermost loop.
