  - id: rust-book-ch06-defining-an-enum-014
    type: prompt_response
    prompt: |
      What does a complete enum method definition look like?
    answer: |
      ```rust
      enum Message {
          Quit,
          Write(String),
      }
      
      impl Message {
          fn call(&self) {
              match self {
                  Message::Quit => println!("quit"),
                  Message::Write(text) => println!("{text}"),
              }
          }
      }
      ```
      Methods on enums are defined in `impl EnumName` blocks, like methods on structs.
    tags:
      - rust-book
      - ch06
      - defining-an-enum
      - syntax
    provenance:
      source_file: ch06_defining_an_enum.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Defining an Enum"
      source: rust-book/src/ch06-01-defining-an-enum.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch06-defining-an-enum-015
    type: prompt_response
    prompt: |
      What syntax stores the IP address data directly in enum variants?
    answer: |
      ```rust
      enum IpAddr {
          V4(u8, u8, u8, u8),
          V6(String),
      }
      
      fn main() {
          let home = IpAddr::V4(127, 0, 0, 1);
          let loopback = IpAddr::V6(String::from("::1"));
      }
      ```
