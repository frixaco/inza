  - id: rust-book-ch06-defining-an-enum-002
    type: prompt_response
    prompt: |
      What advantage does an enum with data have over separate structs for related alternatives?
    answer: |
      The variants share one type, so a function can accept `Message` while still handling different payload shapes.
