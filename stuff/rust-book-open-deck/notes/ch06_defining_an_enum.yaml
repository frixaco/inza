  - id: rust-book-ch06-defining-an-enum-009
    type: prompt_response
    prompt: |
      What constructor behavior does Rust automatically provide for enum variants with data?
    answer: |
      Each variant name acts like a constructor function. For example, `IpAddr::V4(String::from("127.0.0.1"))` creates an `IpAddr` value.
    tags:
