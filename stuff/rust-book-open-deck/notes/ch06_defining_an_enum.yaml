  - id: rust-book-ch06-defining-an-enum-008
    type: prompt_response
    prompt: |
      Why can an enum variant with data be more concise than a struct containing an enum field plus data field?
    answer: |
      The variant can carry its own associated data directly, so the kind and its data stay together without an extra wrapper struct.
