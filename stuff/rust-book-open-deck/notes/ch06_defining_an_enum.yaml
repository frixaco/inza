  - id: rust-book-ch06-defining-an-enum-004
    type: prompt_response
    prompt: |
      Does Rust have `null` as a normal value?
    answer: |
      No. Rust uses types like `Option<T>` to represent absence, so code must handle the `None` case explicitly.
    tags:
      - rust-book
      - ch06
