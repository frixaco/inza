  - id: rust-book-ch06-defining-an-enum-001
    type: prompt_response
    prompt: |
      What syntax defines enum variants with different associated data?
    answer: |
      ```rust
      enum Message {
          Quit,
          Move { x: i32, y: i32 },
          Write(String),
          ChangeColor(i32, i32, i32),
      }
      ```
    tags:
