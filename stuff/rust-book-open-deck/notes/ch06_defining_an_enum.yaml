  - id: rust-book-ch06-defining-an-enum-007
    type: prompt_response
    prompt: |
      Why can a function parameter of type `IpAddrKind` accept both `IpAddrKind::V4` and `IpAddrKind::V6`?
    answer: |
      Both variants are values of the same enum type, `IpAddrKind`.
