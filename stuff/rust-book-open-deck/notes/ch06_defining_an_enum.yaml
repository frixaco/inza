  - id: rust-book-ch06-defining-an-enum-005
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn main() {
          let x: i8 = 5;
          let y: Option<i8> = Some(5);
          let sum = x + y;
      }
      ```
    answer: |
      `Option<i8>` is not an `i8`. The code must unwrap or match the `Option` before using the contained value.
    tags:
      - rust-book
      - ch06
      - defining-an-enum
      - diagnostic
    provenance:
      source_file: ch06_defining_an_enum.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Defining an Enum"
      source: rust-book/src/ch06-01-defining-an-enum.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch06-defining-an-enum-006
    type: prompt_response
    prompt: |
      How do you construct enum variants `V4` and `V6` of an enum named `IpAddrKind`?
    answer: |
      ```rust
      enum IpAddrKind {
          V4,
          V6,
      }
      
      let four = IpAddrKind::V4;
      let six = IpAddrKind::V6;
      ```
      Variants are namespaced under the enum name.
    tags:
      - rust-book
      - ch06
      - defining-an-enum
      - syntax
    provenance:
