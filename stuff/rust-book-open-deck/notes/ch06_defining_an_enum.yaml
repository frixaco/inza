  - id: rust-book-ch06-defining-an-enum-013
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn main() {
          let absent_number = None;
      }
      ```
    answer: |
      `None` does not contain a value from which Rust can infer `T`, so the code must say which `Option<T>` type is intended.
    tags:
      - rust-book
      - ch06
