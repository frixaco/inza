notes:
  - id: rust-book-ch01-hello-world-001
    type: prompt_response
    prompt: |
      What is the minimal Rust `main` function that prints `Hello, world!`?
    answer: |
      ```rust
      fn main() {
          println!("Hello, world!");
      }
      ```
      `main` is the program entry point, and `println!` is a macro call.
    tags:
      - rust-book
