      compile_status: compiles
  - id: rust-book-ch01-hello-world-002
    type: prompt_response
    prompt: |
      In `println!("Hello, world!");`, what does the `!` mean?
    answer: |
      It means `println!` is a macro invocation, not an ordinary function call.
