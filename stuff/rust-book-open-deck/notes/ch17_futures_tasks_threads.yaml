      compile_status: concept_only
  - id: rust-book-ch17-futures-tasks-threads-007
    type: prompt_response
    prompt: |
      In the book's mixed example, why send values from a blocking thread into an async channel?
    answer: |
      It lets blocking work run on a normal thread while async code awaits incoming messages without blocking the async runtime thread.
