notes:
  - id: rust-book-ch17-futures-tasks-threads-001
    type: prompt_response
    prompt: |
      What is the relationship between futures, tasks, and threads?
    answer: |
      A future is a computation, a task is a future scheduled by an executor, and a thread is an OS execution resource that may run many tasks.
    tags:
      - rust-book
      - ch17
      - futures-tasks-threads
      - comparison
    provenance:
      source_file: ch17_futures_tasks_threads.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "Futures, Tasks, and Threads"
      source: rust-book/src/ch17-06-futures-tasks-threads.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch17-futures-tasks-threads-002
    type: prompt_response
    prompt: |
      When are threads more appropriate than async tasks?
    answer: |
      Use threads for CPU-bound parallelism or blocking work unless the runtime provides dedicated blocking APIs.
    tags:
      - rust-book
      - ch17
      - futures-tasks-threads
      - concept_boundary
    provenance:
