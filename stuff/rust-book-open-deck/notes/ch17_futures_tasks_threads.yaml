      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch17-futures-tasks-threads-006
    type: prompt_response
    prompt: |
      Why are async tasks called lightweight compared with OS threads?
    answer: |
      Tasks are managed by the runtime rather than the operating system and can be multiplexed onto fewer threads with less per-task overhead.
    tags:
      - rust-book
      - ch17
