      compile_status: concept_only
  - id: rust-book-ch17-futures-tasks-threads-005
    type: prompt_response
    prompt: |
      Why does the book say the choice is often threads and async, not threads or async?
    answer: |
      Runtimes can run many async tasks across multiple threads, and blocking or CPU-heavy work can be moved to dedicated threads while async code waits for results.
    tags:
      - rust-book
      - ch17
      - futures-tasks-threads
      - comparison
    provenance:
