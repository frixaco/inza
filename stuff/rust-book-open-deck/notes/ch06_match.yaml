notes:
  - id: rust-book-ch06-match-001
    type: prompt_response
    prompt: |
      What relationship does a `match` expression test against its arms?
    answer: |
      It compares a value against patterns and runs the code for the first matching arm.
    tags:
      - rust-book
      - ch06
      - match
      - definition
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch06-match-002
    type: prompt_response
    prompt: |
      What is the shape of a `match` arm?
    answer: |
      ```rust
      match 3 {
          1 => println!("one"),
          2 => println!("two"),
          _ => println!("something else"),
      }
      ```
      Each arm is `pattern => expression`.
    tags:
      - rust-book
      - ch06
      - match
      - syntax
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch06-match-003
    type: prompt_response
    prompt: |
      What does this return?
      
      ```rust
      fn plus_one(x: Option<i32>) -> Option<i32> {
          match x {
              None => None,
              Some(i) => Some(i + 1),
          }
      }
      ```
      For `plus_one(Some(5))`?
    answer: |
      It returns `Some(6)`. The `Some(i)` pattern binds the inner value to `i`.
    tags:
      - rust-book
      - ch06
      - match
      - prediction
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: prediction
      compile_status: compiles
  - id: rust-book-ch06-match-004
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn plus_one(x: Option<i32>) -> Option<i32> {
          match x {
              Some(i) => Some(i + 1),
          }
      }
      ```
    answer: |
      `match` must be exhaustive. The `None` case is a possible value and must be handled or covered by a catch-all arm.
    tags:
      - rust-book
      - ch06
      - match
      - diagnostic
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch06-match-005
    type: prompt_response
    prompt: |
      What is the difference between `_` and a named catch-all pattern like `other`?
    answer: |
      A named catch-all binds the unmatched value so it can be used. `_` matches without binding the value.
    tags:
      - rust-book
      - ch06
      - match
      - comparison
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch06-match-006
    type: prompt_response
    prompt: |
      What is one key difference between `if` and `match` conditions?
    answer: |
      `if` requires a Boolean condition. `match` can compare a value of any type against patterns.
    tags:
      - rust-book
      - ch06
      - match
      - comparison
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch06-match-007
    type: prompt_response
    prompt: |
      What is the value of a `match` expression?
    answer: |
      It is the value of the expression in the arm whose pattern matched.
    tags:
      - rust-book
      - ch06
      - match
      - definition
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch06-match-008
    type: prompt_response
    prompt: |
      When does a `match` arm body need curly braces?
    answer: |
      ```rust
      let cents = match "penny" {
          "penny" => {
              println!("Lucky penny!");
              1
          }
          _ => 0,
      };
      ```
      Use braces when the arm body has multiple statements; the block's last expression is the arm value.
    tags:
      - rust-book
      - ch06
      - match
      - syntax
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch06-match-009
    type: prompt_response
    prompt: |
      What happens if a catch-all pattern appears before more specific `match` arms?
    answer: |
      The catch-all matches first, so later arms are unreachable. Rust warns about arms that can never run.
    tags:
      - rust-book
      - ch06
      - match
      - prediction
    provenance:
      source_file: ch06_match.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "The match Control Flow Construct"
      source: rust-book/src/ch06-02-match.md
      card_type: prediction
      compile_status: concept_only
  - id: rust-book-ch06-match-010
    type: prompt_response
    prompt: |
      What does `_ => ()` mean in a `match` arm?
    answer: |
      Match any remaining value, bind nothing, and run no meaningful code because the arm evaluates to the unit value `()`.
    tags:
      - rust-book
      - ch06
      - match
      - syntax
    provenance:
