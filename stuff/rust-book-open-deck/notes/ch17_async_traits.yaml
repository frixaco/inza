  - id: rust-book-ch17-async-traits-003
    type: prompt_response
    prompt: |
      What does `Pin` promise about a value?
    answer: |
      That the pinned value will not be moved in memory unless it implements `Unpin` or unsafe code upholds the required invariants.
    tags:
