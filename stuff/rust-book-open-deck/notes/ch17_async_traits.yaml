  - id: rust-book-ch17-async-traits-001
    type: prompt_response
    prompt: |
      What is the core method of the `Future` trait?
    answer: |
      `poll`, which tries to make progress and returns `Poll::Ready(output)` or `Poll::Pending`.
    tags:
      - rust-book
      - ch17
      - async-traits
      - definition
