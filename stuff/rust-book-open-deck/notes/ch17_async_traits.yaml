  - id: rust-book-ch17-async-traits-002
    type: prompt_response
    prompt: |
      What does a `Waker` do in the future model?
    answer: |
      It lets a future tell the executor it may be ready to be polled again.
    tags:
      - rust-book
      - ch17
      - async-traits
