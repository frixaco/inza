  - id: rust-book-ch17-async-traits-004
    type: prompt_response
    prompt: |
      What is the difference between `Poll::Pending` and blocking a thread?
    answer: |
      `Pending` returns control to the executor so other tasks can run. Blocking keeps the thread occupied.
    tags:
      - rust-book
      - ch17
      - async-traits
      - comparison
    provenance:
      source_file: ch17_async_traits.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "A Closer Look at the Traits for Async"
      source: rust-book/src/ch17-05-traits-for-async.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch17-async-traits-005
    type: prompt_response
    prompt: |
      What is the essential shape of the `Future` trait?
    answer: |
      ```rust
      use std::pin::Pin;
      use std::task::{Context, Poll};
      
      pub trait Future {
          type Output;
      
          fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;
      }
      ```
    tags:
      - rust-book
      - ch17
      - async-traits
      - syntax
    provenance:
      source_file: ch17_async_traits.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "A Closer Look at the Traits for Async"
      source: rust-book/src/ch17-05-traits-for-async.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch17-async-traits-006
    type: prompt_response
    prompt: |
      What result type does `Future::Output` name?
    answer: |
      It is the type produced when the future completes and returns `Poll::Ready(value)`.
    tags:
      - rust-book
      - ch17
      - async-traits
      - definition
    provenance:
      source_file: ch17_async_traits.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "A Closer Look at the Traits for Async"
