      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch18-trait-objects-005
    type: prompt_response
    prompt: |
      What object-safety rule controls whether a trait can become a trait object?
    answer: |
      Only traits whose methods can be called through a trait object can be made into trait objects; methods involving generic parameters or returning `Self` often violate this.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - concept_boundary
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch18-trait-objects-006
    type: prompt_response
    prompt: |
      What are the two visible parts of trait object syntax such as `Box<dyn Draw>`?
    answer: |
      ```rust
      trait Draw {}
      
      fn takes_ref(_: &dyn Draw) {}
      fn takes_box(_: Box<dyn Draw>) {}
      ```
      It uses a pointer type such as `Box`, `&`, or `Rc`, and the `dyn Trait` marker for dynamic dispatch through that trait.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - syntax
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch18-trait-objects-007
    type: prompt_response
    prompt: |
      Why can a GUI `Screen` with `Vec<Box<dyn Draw>>` contain both `Button` and `SelectBox` values?
    answer: |
      The vector stores boxed trait objects, so each element may have a different concrete type as long as that type implements `Draw`.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - project_architecture
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: project_architecture
      compile_status: concept_only
  - id: rust-book-ch18-trait-objects-008
    type: prompt_response
    prompt: |
      How is a generic `Screen<T: Draw>` more restrictive than `Screen { components: Vec<Box<dyn Draw>> }`?
    answer: |
      The generic version has one concrete `T` per `Screen`, so all components in that instance must be the same type. The trait-object version permits mixed concrete component types.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - comparison
    provenance:
      source_file: ch18_trait_objects.yaml
