  - id: rust-book-ch18-trait-objects-012
    type: prompt_response
    prompt: |
      What does a `Screen` storing heterogeneous drawable components look like?
    answer: |
      ```rust
      trait Draw {
          fn draw(&self);
      }
      
      struct Screen {
          components: Vec<Box<dyn Draw>>,
      }
      
      impl Screen {
          fn run(&self) {
              for component in self.components.iter() {
                  component.draw();
              }
          }
      }
      ```
      `Box<dyn Draw>` lets each component have a different concrete type that implements `Draw`.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - syntax
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch18-trait-objects-013
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      trait Draw {
          fn draw(&self);
      }
      
      struct Screen {
          components: Vec<Box<dyn Draw>>,
      }
      
      fn main() {
          let screen = Screen {
              components: vec![Box::new(String::from("button"))],
          };
      }
      ```
    answer: |
      `String` does not implement `Draw`, so `Box<String>` cannot be coerced to `Box<dyn Draw>`.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - diagnostic
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch18-trait-objects-014
    type: prompt_response
    prompt: |
      What does the generic `Screen<T: Draw>` version force that `Vec<Box<dyn Draw>>` does not?
    answer: |
      ```rust
      trait Draw {
          fn draw(&self);
      }
      
      struct Screen<T: Draw> {
          components: Vec<T>,
      }
      ```
      Each `Screen<T>` has one concrete component type `T`; it cannot mix `Button` and `SelectBox` in the same vector.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - comparison
    provenance:
