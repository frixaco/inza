notes:
  - id: rust-book-ch18-trait-objects-001
    type: prompt_response
    prompt: |
      What runtime representation does a Rust trait object provide?
    answer: |
      A value such as `Box<dyn Draw>` that stores a concrete value plus dynamic dispatch metadata for a trait.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - definition
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch18-trait-objects-002
    type: prompt_response
    prompt: |
      What is the boundary between generics and trait objects?
    answer: |
      Generics use static dispatch and one concrete type per instantiation. Trait objects use dynamic dispatch and can hold different concrete types behind the same trait.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - comparison
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch18-trait-objects-003
    type: prompt_response
    prompt: |
      What syntax means a boxed trait object implementing `Draw`?
    answer: |
      ```rust
      trait Draw {
          fn draw(&self);
      }
      
      struct Button;
      impl Draw for Button {
          fn draw(&self) {}
      }
      
      let component: Box<dyn Draw> = Box::new(Button);
      ```
      `Box<dyn Draw>`.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - syntax
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
      section: "Using Trait Objects to Abstract over Shared Behavior"
      source: rust-book/src/ch18-02-trait-objects.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch18-trait-objects-004
    type: prompt_response
    prompt: |
      Why can adding a `String` to `Vec<Box<dyn Draw>>` fail?
    answer: |
      `String` does not implement the required `Draw` trait, so it cannot be used as that trait object.
    tags:
      - rust-book
      - ch18
      - trait-objects
      - diagnostic
    provenance:
      source_file: ch18_trait_objects.yaml
      chapter: "Chapter 18: Object Oriented Programming Features"
