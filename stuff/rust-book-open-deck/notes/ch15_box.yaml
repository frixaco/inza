notes:
  - id: rust-book-ch15-box-001
    type: prompt_response
    prompt: |
      What ownership and storage role does `Box<T>` provide?
    answer: |
      Single ownership of a value stored on the heap, with a fixed-size pointer stored on the stack.
    tags:
      - rust-book
      - ch15
      - box
      - definition
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch15-box-002
    type: prompt_response
    prompt: |
      When is `Box<T>` useful according to the Rust Book?
    answer: |
      When a type size is unknown at compile time but a pointer size is known, when transferring ownership of large data, or when using trait objects.
    tags:
      - rust-book
      - ch15
      - box
      - concept_boundary
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch15-box-003
    type: prompt_response
    prompt: |
      Why does this recursive enum fail?
      
      ```rust
      enum List {
          Cons(i32, List),
          Nil,
      }
      ```
    answer: |
      It would have infinite size because each `Cons` contains another `List` directly. Use `Box<List>` to add indirection.
    tags:
      - rust-book
      - ch15
      - box
      - diagnostic
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch15-box-004
    type: prompt_response
    prompt: |
      How does `Box<List>` make a recursive list size known?
    answer: |
      `Cons(i32, Box<List>)` stores a fixed-size pointer to the next list node instead of embedding the next node directly.
    tags:
      - rust-book
      - ch15
      - box
      - transformation
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: transformation
      compile_status: concept_only
  - id: rust-book-ch15-box-005
    type: prompt_response
    prompt: |
      What syntax stores an `i32` on the heap with `Box<T>`?
    answer: |
      ```rust
      fn main() {
          let b = Box::new(5);
          println!("b = {b}");
      }
      ```
    tags:
      - rust-book
      - ch15
      - box
      - syntax
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch15-box-006
    type: prompt_response
    prompt: |
      What is the `Nil` variant in the book's cons list example?
    answer: |
      `Nil` is the non-recursive base case that marks the end of the list.
    tags:
      - rust-book
      - ch15
      - box
      - definition
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch15-box-007
    type: prompt_response
    prompt: |
      Does `Box<T>` add runtime capabilities such as reference counting?
    answer: |
      No. `Box<T>` gives heap allocation and indirection with single ownership. More advanced ownership patterns need other smart pointers such as `Rc<T>`.
    tags:
      - rust-book
      - ch15
      - box
      - concept_boundary
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch15-box-008
    type: prompt_response
    prompt: |
      What is the concrete recursive list definition using `Box<T>`?
    answer: |
      ```rust
      enum List {
          Cons(i32, Box<List>),
          Nil,
      }
      
      use List::{Cons, Nil};
      
      fn main() {
          let list = Cons(1, Box::new(Cons(2, Box::new(Cons(3, Box::new(Nil))))));
      }
      ```
      `Box<List>` gives the recursive field a known pointer size.
    tags:
      - rust-book
      - ch15
      - box
      - syntax
    provenance:
      source_file: ch15_box.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Using Box<T> to Point to Data on the Heap"
      source: rust-book/src/ch15-01-box.md
      card_type: syntax
      compile_status: compiles
