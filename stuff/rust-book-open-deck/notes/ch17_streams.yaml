  - id: rust-book-ch17-streams-005
    type: prompt_response
    prompt: |
      What is the boundary between `Stream` and `StreamExt`?
    answer: |
      `Stream` defines the low-level asynchronous sequence interface. `StreamExt` provides higher-level helper methods such as `next` and other iterator-like utilities.
    tags:
      - rust-book
      - ch17
      - streams
      - comparison
    provenance:
      source_file: ch17_streams.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "Streams: Futures in Sequence"
      source: rust-book/src/ch17-04-streams.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch17-streams-006
    type: prompt_response
    prompt: |
      Are `Stream` and `StreamExt` part of Rust's standard library in the book?
    answer: |
      No. The book uses ecosystem-provided stream traits through `trpl`; they are common async abstractions but not standard-library traits.
    tags:
