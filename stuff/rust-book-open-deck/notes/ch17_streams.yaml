  - id: rust-book-ch17-streams-009
    type: prompt_response
    prompt: |
      What is the essential low-level shape of a `Stream` trait?
    answer: |
      ```rust
      use std::pin::Pin;
      use std::task::{Context, Poll};
      
      trait Stream {
          type Item;
      
          fn poll_next(
              self: Pin<&mut Self>,
              cx: &mut Context<'_>,
          ) -> Poll<Option<Self::Item>>;
      }
      ```
      It is like combining `Iterator`'s item sequence with `Future`'s readiness over time.
    tags:
      - rust-book
      - ch17
      - streams
      - syntax
    provenance:
      source_file: ch17_streams.yaml
