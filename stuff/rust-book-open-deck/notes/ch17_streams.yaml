  - id: rust-book-ch17-streams-008
    type: prompt_response
    prompt: |
      What practical problems does the book connect to streams?
    answer: |
      Streams are useful for asynchronous sequences such as messages over time, throttled events, timeouts over multiple operations, or limiting repeated network calls.
    tags:
      - rust-book
      - ch17
      - streams
      - definition
    provenance:
