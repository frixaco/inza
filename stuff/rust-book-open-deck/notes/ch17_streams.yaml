  - id: rust-book-ch17-streams-007
    type: prompt_response
    prompt: |
      What does `while let Some(value) = stream.next().await` handle during stream iteration?
    answer: |
      `next().await` yields `Some(item)` while the stream has values and `None` when the stream is finished, matching the shape of iterator-style loops.
    tags:
      - rust-book
      - ch17
      - streams
      - prediction
    provenance:
