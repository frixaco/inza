  - id: rust-book-ch17-streams-004
    type: prompt_response
    prompt: |
      Why can `stream.next().await` fail to compile even when the stream value exists?
    answer: |
      The `next` helper is supplied by the `StreamExt` extension trait, so that trait must be in scope.
    tags:
      - rust-book
      - ch17
      - streams
      - diagnostic
    provenance:
      source_file: ch17_streams.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
