notes:
  - id: rust-book-ch17-streams-001
    type: prompt_response
    prompt: |
      What async sequence does a Rust stream represent?
    answer: |
      An asynchronous sequence of values, like an iterator whose next item may require waiting.
    tags:
      - rust-book
      - ch17
      - streams
      - definition
    provenance:
      source_file: ch17_streams.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "Streams: Futures in Sequence"
      source: rust-book/src/ch17-04-streams.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch17-streams-002
    type: prompt_response
    prompt: |
      How is a stream different from an iterator?
    answer: |
      An iterator's `next` is synchronous. A stream's next item is produced asynchronously and may be pending.
    tags:
      - rust-book
      - ch17
      - streams
      - comparison
    provenance:
      source_file: ch17_streams.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "Streams: Futures in Sequence"
      source: rust-book/src/ch17-04-streams.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch17-streams-003
    type: prompt_response
    prompt: |
      What method is commonly used to get the next item from a stream in the book examples?
    answer: |
      `next().await`, with the relevant stream extension trait in scope.
    tags:
      - rust-book
      - ch17
      - streams
      - api_recall
    provenance:
