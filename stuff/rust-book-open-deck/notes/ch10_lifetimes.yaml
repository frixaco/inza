notes:
  - id: rust-book-ch10-lifetimes-001
    type: prompt_response
    prompt: |
      What relationship does a lifetime annotation describe?
    answer: |
      It describes relationships between reference lifetimes; it does not change how long any value lives.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - definition
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-002
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn longest(x: &str, y: &str) -> &str {
          if x.len() > y.len() { x } else { y }
      }
      ```
    answer: |
      The compiler must know the returned reference is tied to the lifetime of the input references, so it cannot outlive both candidates.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - diagnostic
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch10-lifetimes-003
    type: prompt_response
    prompt: |
      What is the canonical signature for a `longest` function returning one of two string slices?
    answer: |
      ```rust
      fn longest<'a>(x: &'a str, y: &'a str) -> &'a str {
          if x.len() > y.len() { x } else { y }
      }
      ```
      The return value lives at most as long as both input references.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-lifetimes-004
    type: prompt_response
    prompt: |
      Does `'a` mean both input references live for exactly the same duration?
    answer: |
      No. It means the returned reference is valid for the intersection of the input lifetimes required by the call.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - misconception
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-005
    type: prompt_response
    prompt: |
      Why does this fail even with a lifetime annotation?
      
      ```rust
      fn longest<'a>(x: &str, y: &str) -> &'a str {
          let result = String::from("really long string");
          result.as_str()
      }
      ```
    answer: |
      The local `String` is dropped when the function ends. An annotation cannot make a returned reference point to data that no longer exists.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - diagnostic
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch10-lifetimes-006
    type: prompt_response
    prompt: |
      Which compiler rule lets common lifetime relationships be omitted?
    answer: |
      Lifetime elision lets common lifetime relationships be inferred instead of written explicitly.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - definition
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-007
    type: prompt_response
    prompt: |
      What does `'static` mean for a reference?
    answer: |
      The referenced data can live for the entire program duration, as string literals do. It should not be used to hide shorter lifetime problems.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-008
    type: prompt_response
    prompt: |
      What dangling-reference problem are lifetimes designed to prevent?
    answer: |
      Lifetimes prevent references from outliving the data they point to.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - definition
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-009
    type: prompt_response
    prompt: |
      What does the borrow checker compare when checking lifetimes?
    answer: |
      It compares scopes to ensure borrowed data lives at least as long as the reference that points to it.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - definition
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-010
    type: prompt_response
    prompt: |
      What is the syntax for a struct that stores a string slice reference?
    answer: |
      ```rust
      struct ImportantExcerpt<'a> {
          part: &'a str,
      }
      ```
      The instance cannot outlive the reference stored in `part`.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-lifetimes-011
    type: prompt_response
    prompt: |
      Which lifetimes are called input lifetimes and output lifetimes?
    answer: |
      Input lifetimes are lifetimes on function or method parameters. Output lifetimes are lifetimes on return values.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - definition
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-012
    type: prompt_response
    prompt: |
      Do lifetime elision rules infer every omitted lifetime relationship?
    answer: |
      No. They cover deterministic common cases. If ambiguity remains after applying the rules, the compiler requires explicit annotations.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - misconception
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-013
    type: prompt_response
    prompt: |
      What lifetime elision rule applies to methods with `&self` or `&mut self`?
    answer: |
      ```rust
      struct ImportantExcerpt<'a> {
          part: &'a str,
      }
      
      impl<'a> ImportantExcerpt<'a> {
          fn announce_and_return_part(&self, announcement: &str) -> &str {
              println!("Attention please: {announcement}");
              self.part
          }
      }
      ```
      If one input lifetime is `&self` or `&mut self`, the lifetime of `self` is assigned to all elided output lifetimes.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-lifetimes-014
    type: prompt_response
    prompt: |
      Why can `longest<'a>(x: &'a str, y: &str) -> &'a str` compile if it always returns `x`?
    answer: |
      The returned reference is related only to `x`, so `y` does not need to share the return lifetime.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - concept_boundary
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-015
    type: prompt_response
    prompt: |
      What are the basic lifetime annotation forms for shared and mutable references?
    answer: |
      ```rust
      // &i32        // reference with an elided lifetime
      // &'a i32    // shared reference with explicit lifetime 'a
      // &'a mut i32 // mutable reference with explicit lifetime 'a
      ```
      The lifetime name goes after `&` and before `mut` or the referenced type.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-lifetimes-016
    type: prompt_response
    prompt: |
      Where do lifetime annotations go when documenting a function's reference relationships?
    answer: |
      They go in the function signature, not in the function body. The signature is the contract the borrow checker uses at call sites.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - concept_boundary
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-017
    type: prompt_response
    prompt: |
      When a function returns a reference, what must its output lifetime be related to?
    answer: |
      The output lifetime must be tied to the lifetime of at least one input reference. If the returned reference points to data created inside the function, it would dangle after the function returns.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - invariant
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-018
    type: prompt_response
    prompt: |
      What does `'a` become at a call site for `fn longest<'a>(x: &'a str, y: &'a str) -> &'a str`?
    answer: |
      It becomes the smaller overlapping lifetime of `x` and `y`, because the returned reference must be valid no longer than both inputs are valid.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - prediction
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: prediction
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-019
    type: prompt_response
    prompt: |
      Which lifetime elision rule assigns each reference parameter its own lifetime?
    answer: |
      The compiler assigns a separate lifetime parameter to each input lifetime.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - api_recall
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: api_recall
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-020
    type: prompt_response
    prompt: |
      Which lifetime elision rule assigns one input lifetime to all output lifetimes?
    answer: |
      If there is exactly one input lifetime parameter, that lifetime is assigned to all output lifetime parameters.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - api_recall
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: api_recall
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-021
    type: prompt_response
    prompt: |
      Which lifetime elision rule assigns `self`'s lifetime to method output lifetimes?
    answer: |
      If there are multiple input lifetimes and one is `&self` or `&mut self`, the lifetime of `self` is assigned to all output lifetime parameters.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - api_recall
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: api_recall
      compile_status: concept_only
  - id: rust-book-ch10-lifetimes-022
    type: prompt_response
    prompt: |
      What syntax implements methods on a struct with a lifetime parameter?
    answer: |
      ```rust
      struct ImportantExcerpt<'a> {
          part: &'a str,
      }
      
      impl<'a> ImportantExcerpt<'a> {
          fn level(&self) -> i32 {
              3
          }
      }
      ```
      The lifetime is declared after `impl` and used after the type name.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
