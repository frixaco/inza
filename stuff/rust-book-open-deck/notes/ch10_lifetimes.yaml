      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-lifetimes-023
    type: prompt_response
    prompt: |
      What does a function signature combining lifetimes, generics, and trait bounds look like?
    answer: |
      ```rust
      use std::fmt::Display;
      
      fn longest_with_an_announcement<'a, T>(
          x: &'a str,
          y: &'a str,
          ann: T,
      ) -> &'a str
      where
          T: Display,
      {
          println!("Announcement! {ann}");
          if x.len() > y.len() { x } else { y }
      }
      ```
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
      source_file: ch10_lifetimes.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Validating References with Lifetimes"
      source: rust-book/src/ch10-03-lifetime-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-lifetimes-024
    type: prompt_response
    prompt: |
      What is the concrete syntax for a string slice with the `'static` lifetime?
    answer: |
      ```rust
      fn main() {
          let s: &'static str = "I have a static lifetime.";
          println!("{s}");
      }
      ```
      String literals can have `'static` because their data is stored in the program binary.
    tags:
      - rust-book
      - ch10
      - lifetimes
      - syntax
    provenance:
