  - id: rust-book-ch08-hash-maps-014
    type: prompt_response
    prompt: |
      What exact pattern updates a word count through `entry` and `or_insert`?
    answer: |
      ```rust
      use std::collections::HashMap;
      
      fn main() {
          let text = "hello world wonderful world";
          let mut map = HashMap::new();
      
          for word in text.split_whitespace() {
              let count = map.entry(word).or_insert(0);
              *count += 1;
          }
      }
      ```
      `or_insert` returns `&mut V`, so `*count += 1` changes the stored value.
