  - id: rust-book-ch15-smart-pointers-001
    type: prompt_response
    prompt: |
      What behavior makes a data structure a smart pointer in Rust?
    answer: |
      A data structure that acts like a pointer while also providing extra metadata or behavior.
    tags:
