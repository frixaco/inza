  - id: rust-book-ch15-smart-pointers-002
    type: prompt_response
    prompt: |
      What makes a smart pointer different from an ordinary reference?
    answer: |
      References only borrow data. Smart pointers often own data and can implement behavior such as dereferencing and cleanup.
    tags:
      - rust-book
      - ch15
      - smart-pointers
      - comparison
    provenance:
      source_file: ch15_smart_pointers.yaml
      chapter: "Chapter 15: Smart Pointers"
