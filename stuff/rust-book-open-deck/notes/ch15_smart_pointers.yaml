      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch15-smart-pointers-003
    type: prompt_response
    prompt: |
      Which two traits are central to many smart pointers?
    answer: |
      `Deref`, which controls reference-like access, and `Drop`, which controls cleanup.
    tags:
