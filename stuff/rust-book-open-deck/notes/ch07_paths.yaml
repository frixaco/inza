notes:
  - id: rust-book-ch07-paths-001
    type: prompt_response
    prompt: |
      What is the difference between an absolute path and a relative path in Rust modules?
    answer: |
      An absolute path starts from the crate root with `crate`. A relative path starts from the current module and may use `self` or `super`.
    tags:
      - rust-book
      - ch07
      - paths
      - comparison
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Paths for Referring to an Item in the Module Tree"
      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch07-paths-002
    type: prompt_response
    prompt: |
      Why does this fail even though the module path exists?
      
      ```rust
      mod front_of_house {
          pub mod hosting {
              fn add_to_waitlist() {}
          }
      }
      
      pub fn eat_at_restaurant() {
          crate::front_of_house::hosting::add_to_waitlist();
      }
      ```
    answer: |
      The path may name private modules or functions. Each module and item along the public API path must be visible to the caller.
    tags:
      - rust-book
      - ch07
      - paths
      - diagnostic
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Paths for Referring to an Item in the Module Tree"
      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch07-paths-003
    type: prompt_response
    prompt: |
      What does `super::` mean in a module path?
    answer: |
      ```rust
      fn deliver_order() {}
      
      mod back_of_house {
          pub fn fix_incorrect_order() {
              super::deliver_order();
          }
      }
      ```
      `super` refers to the parent module of the current module, similar to `..` in a filesystem path.
    tags:
      - rust-book
      - ch07
      - paths
      - syntax
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Paths for Referring to an Item in the Module Tree"
      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-paths-004
    type: prompt_response
    prompt: |
      Why can public structs have private fields?
    answer: |
      A public struct type can be named by outside code, while private fields prevent outside code from constructing or mutating it directly.
    tags:
      - rust-book
      - ch07
      - paths
      - concept_boundary
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Paths for Referring to an Item in the Module Tree"
      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch07-paths-005
    type: prompt_response
    prompt: |
      What is the privacy rule for enum variants when the enum is `pub`?
    answer: |
      If an enum is public, all of its variants are public.
    tags:
      - rust-book
      - ch07
      - paths
      - invariant
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
