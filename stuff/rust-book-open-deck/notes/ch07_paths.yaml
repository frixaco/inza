  - id: rust-book-ch07-paths-009
    type: prompt_response
    prompt: |
      Why does a package with both `src/main.rs` and `src/lib.rs` often keep most logic in the library crate?
    answer: |
      The binary crate can call the library crate's public API, and other projects can reuse that same library functionality.
    tags:
      - rust-book
      - ch07
      - paths
      - project_architecture
    provenance:
