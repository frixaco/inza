      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-paths-011
    type: prompt_response
    prompt: |
      What syntax makes both a child module and a function inside it callable by an ancestor module?
    answer: |
      ```rust
      mod front_of_house {
          pub mod hosting {
              pub fn add_to_waitlist() {}
          }
      }
      ```
      `pub mod hosting` exposes the module path; `pub fn add_to_waitlist` exposes the function.
    tags:
      - rust-book
      - ch07
      - paths
      - syntax
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Paths for Referring to an Item in the Module Tree"
      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-paths-012
    type: prompt_response
    prompt: |
      How can a public struct expose one field while keeping another private?
    answer: |
      ```rust
      mod back_of_house {
          pub struct Breakfast {
              pub toast: String,
              seasonal_fruit: String,
          }
      
          impl Breakfast {
              pub fn summer(toast: &str) -> Self {
                  Self {
                      toast: String::from(toast),
                      seasonal_fruit: String::from("peaches"),
                  }
              }
          }
      }
      ```
      The struct is public, `toast` is public, and `seasonal_fruit` remains private.
    tags:
      - rust-book
      - ch07
      - paths
      - syntax
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
