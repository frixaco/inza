  - id: rust-book-ch07-paths-006
    type: prompt_response
    prompt: |
      Can child modules use private items from ancestor modules?
    answer: |
      Yes. Child modules can see items in the modules where they are defined, but parent modules cannot use private items inside child modules.
    tags:
      - rust-book
      - ch07
      - paths
      - concept_boundary
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Paths for Referring to an Item in the Module Tree"
      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch07-paths-007
    type: prompt_response
    prompt: |
      Why does a public struct with a private field usually need a public constructor?
    answer: |
      Outside code can name the struct type but cannot construct it with private fields. A public associated function can create valid instances while preserving the private field invariant.
    tags:
      - rust-book
      - ch07
      - paths
      - diagnostic
    provenance:
      source_file: ch07_paths.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Paths for Referring to an Item in the Module Tree"
      source: rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch07-paths-008
    type: prompt_response
    prompt: |
      Why does the book use `super::deliver_order()` inside `back_of_house`?
    answer: |
      `super` refers to the parent module, making the path relative to nearby code that may move together during refactoring.
    tags:
      - rust-book
      - ch07
      - paths
      - comparison
    provenance:
