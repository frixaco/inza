      compile_status: concept_only
  - id: rust-book-ch12-command-line-arguments-006
    type: prompt_response
    prompt: |
      What does `cargo run -- searchstring example-filename.txt` mean?
    answer: |
      Arguments after `--` are passed to the program being run, not consumed as Cargo options.
