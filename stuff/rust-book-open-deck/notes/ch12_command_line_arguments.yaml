  - id: rust-book-ch12-command-line-arguments-001
    type: prompt_response
    prompt: |
      Which standard-library function returns an iterator over command-line arguments?
    answer: |
      ```rust
      let args: Vec<String> = std::env::args().collect();
      ```
      `std::env::args()`.
