  - id: rust-book-ch12-command-line-arguments-005
    type: prompt_response
    prompt: |
      What caveat does the book give about `std::env::args()` and invalid Unicode?
    answer: |
      `env::args()` will panic if any argument contains invalid Unicode. Use `std::env::args_os()` when the program needs to accept non-Unicode arguments.
    tags:
      - rust-book
      - ch12
