  - id: rust-book-ch12-command-line-arguments-002
    type: prompt_response
    prompt: |
      Why does `env::args().collect()` need a type annotation in the book example?
    answer: |
      ```rust
      let args: Vec<String> = std::env::args().collect();
      ```
      `collect` can build many collection types, so `let args: Vec<String>` tells Rust which collection to produce.
