  - id: rust-book-ch16-message-passing-004
    type: prompt_response
    prompt: |
      How can multiple threads send on the same channel?
    answer: |
      ```rust
      use std::sync::mpsc;
      use std::thread;
      
      let (tx, rx) = mpsc::channel();
      let tx1 = tx.clone();
      
      let one = thread::spawn(move || tx.send(String::from("one")).unwrap());
      let two = thread::spawn(move || tx1.send(String::from("two")).unwrap());
      
      one.join().unwrap();
      two.join().unwrap();
      
      let messages: Vec<_> = rx.iter().take(2).collect();
      assert_eq!(messages.len(), 2);
      ```
      Clone the sender with `tx.clone()` and move each sender into a different thread.
    tags:
      - rust-book
      - ch16
      - message-passing
      - api_recall
    provenance:
      source_file: ch16_message_passing.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Transfer Data Between Threads with Message Passing"
      source: rust-book/src/ch16-02-message-passing.md
      card_type: api_recall
      compile_status: compiles
