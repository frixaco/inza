  - id: rust-book-ch16-message-passing-002
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      use std::sync::mpsc;
      use std::thread;
      
      fn main() {
          let (tx, rx) = mpsc::channel();
      
          thread::spawn(move || {
              let val = String::from("hi");
              tx.send(val).unwrap();
              println!("val is {val}");
          });
      
          let received = rx.recv().unwrap();
          println!("Got: {received}");
      }
      ```
    answer: |
      Ownership moves into the channel; the sending thread cannot use `val` afterward.
    tags:
      - rust-book
      - ch16
      - message-passing
      - diagnostic
    provenance:
      source_file: ch16_message_passing.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Transfer Data Between Threads with Message Passing"
      source: rust-book/src/ch16-02-message-passing.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch16-message-passing-003
    type: prompt_response
    prompt: |
      What is the difference between `recv` and `try_recv`?
    answer: |
      `recv` blocks until a message arrives or the channel closes. `try_recv` returns immediately with a `Result`.
    tags:
      - rust-book
      - ch16
      - message-passing
      - comparison
    provenance:
      source_file: ch16_message_passing.yaml
      chapter: "Chapter 16: Fearless Concurrency"
