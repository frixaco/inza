  - id: rust-book-ch16-message-passing-009
    type: prompt_response
    prompt: |
      What happens when you iterate over `rx` in a `for` loop?
    answer: |
      ```rust
      use std::sync::mpsc;
      
      let (tx, rx) = mpsc::channel();
      tx.send("hi").unwrap();
      drop(tx);
      
      for received in rx {
          println!("{received}");
      }
      ```
      The loop receives each value as it arrives and ends when the channel is closed.
    tags:
      - rust-book
      - ch16
      - message-passing
      - api_recall
    provenance:
      source_file: ch16_message_passing.yaml
