  - id: rust-book-ch04-slices-008
    type: prompt_response
    prompt: |
      Why is `fn first_word(s: &str) -> &str` more flexible than `fn first_word(s: &String) -> &str`?
    answer: |
      `&str` accepts both string slices and borrowed `String` values. `&String` unnecessarily restricts callers to `String`.
