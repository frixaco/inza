  - id: rust-book-ch04-slices-002
    type: prompt_response
    prompt: |
      What do `&s[0..5]`, `&s[..5]`, and `&s[0..]` mean for a `String`?
    answer: |
      ```rust
      let s = String::from("hello world");
      let hello = &s[0..5];
      let also_hello = &s[..5];
      let whole = &s[0..];
      ```
      The end index is exclusive; omitting the start means 0, and omitting the end means `s.len()`.
    tags:
      - rust-book
      - ch04
      - slices
      - syntax
    provenance:
      source_file: ch04_slices.yaml
      chapter: "Chapter 4: Understanding Ownership"
      section: "The Slice Type"
      source: rust-book/src/ch04-03-slices.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch04-slices-003
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn first_word(s: &String) -> &str {
          let bytes = s.as_bytes();
      
          for (i, &item) in bytes.iter().enumerate() {
              if item == b' ' {
                  return &s[0..i];
              }
          }
      
          &s[..]
      }
      
      fn main() {
          let mut s = String::from("hello world");
          let word = first_word(&s);
          s.clear();
          println!("the first word is: {word}");
      }
      ```
    answer: |
      The slice is an immutable borrow of `s`; `clear` needs a mutable borrow. Mutating could invalidate the slice.
    tags:
      - rust-book
      - ch04
      - slices
      - diagnostic
    provenance:
      source_file: ch04_slices.yaml
      chapter: "Chapter 4: Understanding Ownership"
      section: "The Slice Type"
      source: rust-book/src/ch04-03-slices.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch04-slices-004
    type: prompt_response
    prompt: |
      Why is returning `&str` from `first_word` better than returning an index?
    answer: |
      The slice stays tied to the borrowed string, so Rust prevents mutation that would make the result stale. A bare index has no such relationship.
    tags:
      - rust-book
      - ch04
      - slices
      - concept_boundary
    provenance:
      source_file: ch04_slices.yaml
      chapter: "Chapter 4: Understanding Ownership"
      section: "The Slice Type"
      source: rust-book/src/ch04-03-slices.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch04-slices-005
    type: prompt_response
    prompt: |
      Does a string-slice range index characters?
    answer: |
      No. String slice ranges are byte indexes and must fall on valid UTF-8 character boundaries.
    tags:
      - rust-book
      - ch04
      - slices
      - misconception
    provenance:
      source_file: ch04_slices.yaml
