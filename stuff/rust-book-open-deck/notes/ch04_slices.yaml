      What is the type of an array slice like `&a[1..3]`?
    answer: |
      ```rust
      fn main() {
          let a = [1, 2, 3, 4, 5];
          let slice: &[i32] = &a[1..3];
          assert_eq!(slice, &[2, 3]);
      }
      ```
