  - id: rust-book-ch04-slices-001
    type: prompt_response
    prompt: |
      What does a slice let you reference?
    answer: |
      A slice lets you reference a contiguous sequence of elements in a collection without owning that sequence.
    tags:
      - rust-book
      - ch04
      - slices
      - definition
    provenance:
