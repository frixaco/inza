  - id: rust-book-ch04-slices-007
    type: prompt_response
    prompt: |
      What does `&s[start..end]` store conceptually for a string slice?
    answer: |
      It stores a pointer to the start of the slice and a length. The `end` index is one past the last byte included.
    tags:
