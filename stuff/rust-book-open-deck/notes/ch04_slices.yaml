  - id: rust-book-ch04-slices-006
    type: prompt_response
    prompt: |
      Why is returning a bare `usize` index from `first_word` brittle?
    answer: |
      The index is not tied to the `String` state it came from. The string can change or be cleared while the old index still exists.
    tags:
