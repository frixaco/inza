  - id: rust-book-ch04-slices-011
    type: prompt_response
    prompt: |
      What are the shorthand forms for slicing from the start, to the end, or the whole string?
    answer: |
      ```rust
      fn main() {
          let s = String::from("hello");
          let a = &s[0..2];
          let b = &s[..2];
          let c = &s[3..s.len()];
          let d = &s[3..];
          let e = &s[0..s.len()];
          let f = &s[..];
          println!("{a} {b} {c} {d} {e} {f}");
      }
      ```
      Omitting the start means 0; omitting the end means the string length.
    tags:
      - rust-book
      - ch04
      - slices
      - syntax
    provenance:
