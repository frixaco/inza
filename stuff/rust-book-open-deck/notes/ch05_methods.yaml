      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: Methods
      source: rust-book/src/ch05-03-method-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch05-methods-002
    type: prompt_response
    prompt: |
      What is the difference between a method and an associated function?
    answer: |
      A method has a `self` parameter and is called on an instance. An associated function is defined in an `impl` block but has no `self`, such as `String::from`.
    tags:
      - rust-book
      - ch05
      - methods
      - comparison
    provenance:
      source_file: ch05_methods.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: Methods
      source: rust-book/src/ch05-03-method-syntax.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch05-methods-003
    type: prompt_response
    prompt: |
      When should a method take `self`, `&self`, or `&mut self`?
    answer: |
      Use `self` to consume the value, `&self` to read it, and `&mut self` to mutate it without taking ownership.
    tags:
      - rust-book
      - ch05
      - methods
      - concept_boundary
    provenance:
      source_file: ch05_methods.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
