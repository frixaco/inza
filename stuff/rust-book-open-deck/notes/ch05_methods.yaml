  - id: rust-book-ch05-methods-005
    type: prompt_response
    prompt: |
      Inside `impl Rectangle`, what does `Self` mean?
    answer: |
      `Self` is an alias for the type named in the `impl` block, so here it means `Rectangle`.
    tags:
      - rust-book
