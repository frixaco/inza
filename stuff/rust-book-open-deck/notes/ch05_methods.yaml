  - id: rust-book-ch05-methods-010
    type: prompt_response
    prompt: |
      What syntax calls an associated function that is not a method?
    answer: |
      Use `::` with the type name, such as `Rectangle::square(3)`. Dot syntax is for methods called on an instance.
    tags:
