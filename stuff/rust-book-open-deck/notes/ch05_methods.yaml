notes:
  - id: rust-book-ch05-methods-001
    type: prompt_response
    prompt: |
      What syntax defines a method on `Rectangle` that borrows `self`?
    answer: |
      ```rust
      struct Rectangle {
          width: u32,
          height: u32,
      }
      
      impl Rectangle {
          fn area(&self) -> u32 {
              self.width * self.height
          }
      }
      ```
    tags:
      - rust-book
      - ch05
      - methods
      - syntax
    provenance:
