  - id: rust-book-ch05-methods-009
    type: prompt_response
    prompt: |
      Why is `Rectangle::square(3)` an associated function rather than a method?
    answer: |
      It creates a new `Rectangle` without needing an existing instance, so it has no `self` parameter and is called with `::`.
    tags:
