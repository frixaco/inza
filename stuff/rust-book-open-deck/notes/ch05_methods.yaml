  - id: rust-book-ch05-methods-012
    type: prompt_response
    prompt: |
      What does a complete associated function returning `Self` look like for `Rectangle::square`?
    answer: |
      ```rust
      struct Rectangle {
          width: u32,
          height: u32,
      }
      
      impl Rectangle {
          fn square(size: u32) -> Self {
              Self {
                  width: size,
                  height: size,
              }
          }
      }
      
      fn main() {
          let square = Rectangle::square(3);
          println!("{}", square.width);
      }
      ```
    tags:
      - rust-book
      - ch05
      - methods
      - syntax
    provenance:
