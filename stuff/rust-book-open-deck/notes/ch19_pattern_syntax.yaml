      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-013
    type: prompt_response
    prompt: |
      Why must an enum pattern match the data shape of the variant?
    answer: |
      Each variant has its own fields. A tuple-like variant must be matched with the right number of subpatterns, while struct-like variants are matched by field names.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - diagnostic
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch19-pattern-syntax-014
    type: prompt_response
    prompt: |
      What does a nested destructuring pattern let you do?
    answer: |
      It matches through multiple layers of data at once, such as destructuring an enum variant that contains a struct or tuple.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
