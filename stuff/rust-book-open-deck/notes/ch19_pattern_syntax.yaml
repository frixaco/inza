  - id: rust-book-ch19-pattern-syntax-018
    type: prompt_response
    prompt: |
      What does destructuring a struct with literal field patterns look like?
    answer: |
      ```rust
      struct Point {
          x: i32,
          y: i32,
      }
      
      fn main() {
          let p = Point { x: 0, y: 7 };
          match p {
              Point { x, y: 0 } => println!("On the x axis at {x}"),
              Point { x: 0, y } => println!("On the y axis at {y}"),
              Point { x, y } => println!("On neither axis: ({x}, {y})"),
          }
      }
      ```
