  - id: rust-book-ch19-pattern-syntax-012
    type: prompt_response
    prompt: |
      What does `Point { x, y }` mean in a pattern?
    answer: |
      ```rust
      struct Point {
          x: i32,
          y: i32,
      }
      
      let p = Point { x: 3, y: 5 };
      let Point { x, y } = p;
      ```
      It is shorthand for binding fields with the same names as the struct fields, equivalent to `Point { x: x, y: y }`.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
