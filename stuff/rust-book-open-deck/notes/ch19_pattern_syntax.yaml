  - id: rust-book-ch19-pattern-syntax-020
    type: prompt_response
    prompt: |
      Why can `_s` move a `String` while `_` does not?
    answer: |
      ```rust
      fn main() {
          let s = Some(String::from("hello"));
          if let Some(_s) = s {
              println!("found a string");
          }
          println!("{s:?}");
      }
      ```
      `_s` is a binding, so it moves the inner `String`; `_` does not bind and would leave `s` usable.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - diagnostic
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: diagnostic
      compile_status: expected_failure
