  - id: rust-book-ch19-pattern-syntax-024
    type: prompt_response
    prompt: |
      What does an `@` binding with a range pattern look like?
    answer: |
      ```rust
      enum Message {
          Hello { id: i32 },
      }
      
      fn main() {
          let msg = Message::Hello { id: 5 };
          match msg {
              Message::Hello { id: id_variable @ 3..=7 } => {
                  println!("Found an id in range: {id_variable}");
              }
              Message::Hello { id: 10..=12 } => println!("Found an id in another range"),
              Message::Hello { id } => println!("Found some other id: {id}"),
          }
      }
      ```
      `id_variable @ 3..=7` both tests the range and binds the matched value.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
