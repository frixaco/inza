  - id: rust-book-ch19-pattern-syntax-019
    type: prompt_response
    prompt: |
      What does nested enum destructuring look like?
    answer: |
      ```rust
      enum Color {
          Rgb(i32, i32, i32),
          Hsv(i32, i32, i32),
      }
      
      enum Message {
          ChangeColor(Color),
      }
      
      fn main() {
          let msg = Message::ChangeColor(Color::Hsv(0, 160, 255));
          match msg {
              Message::ChangeColor(Color::Rgb(r, g, b)) => println!("rgb {r} {g} {b}"),
              Message::ChangeColor(Color::Hsv(h, s, v)) => println!("hsv {h} {s} {v}"),
          }
      }
      ```
    tags:
      - rust-book
