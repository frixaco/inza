notes:
  - id: rust-book-ch19-pattern-syntax-001
    type: prompt_response
    prompt: |
      What does `1 | 2` mean in a pattern?
    answer: |
      ```rust
      let x = 1;
      match x {
          1 | 2 => println!("one or two"),
          _ => println!("something else"),
      }
      ```
      It matches either `1` or `2`.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-002
    type: prompt_response
    prompt: |
      What does `1..=5` mean in a pattern?
    answer: |
      ```rust
      let x = 3;
      match x {
          1..=5 => println!("one through five"),
          _ => println!("something else"),
      }
      ```
      It matches any value in the inclusive range from 1 through 5.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-003
    type: prompt_response
    prompt: |
      What does `_` mean in a pattern?
    answer: |
      ```rust
      let value = Some(5);
      match value {
          Some(_) => println!("got some value"),
          None => println!("got nothing"),
      }
      ```
      It matches any value without binding it.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-004
    type: prompt_response
    prompt: |
      What is the difference between `_` and a variable name starting with `_`, such as `_s`?
    answer: |
      `_` does not bind at all. `_s` binds the value but suppresses unused-variable warnings, so it can still move ownership.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - comparison
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch19-pattern-syntax-005
    type: prompt_response
    prompt: |
      What does `..` do in a destructuring pattern?
    answer: |
      ```rust
      struct Point {
          x: i32,
          y: i32,
          z: i32,
      }
      
      let origin = Point { x: 0, y: 0, z: 0 };
      let Point { x, .. } = origin;
      ```
      It ignores the remaining fields or elements not named explicitly.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-006
    type: prompt_response
    prompt: |
      What binding-and-test behavior does `@` add to a pattern?
    answer: |
      ```rust
      let id = 5;
      match id {
          value @ 3..=7 => println!("id in range: {value}"),
          _ => println!("id out of range"),
      }
      ```
      It binds a name to a value while also testing that value against a subpattern, such as `id @ 3..=7`.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-007
    type: prompt_response
    prompt: |
      What extra condition can a match guard add to an arm?
    answer: |
      ```rust
      let num = Some(4);
      match num {
          Some(x) if x % 2 == 0 => println!("even"),
          Some(_) => println!("odd"),
          None => {}
      }
      ```
      An extra `if condition` on a match arm that must be true for the arm to match.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - syntax
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-008
    type: prompt_response
    prompt: |
      In `match x { Some(y) => ... }`, does `y` refer to an outer variable named `y`?
    answer: |
      No. `y` in the pattern is a new binding that shadows any outer `y`. Use a match guard if you need to compare against an outer variable.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - misconception
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch19-pattern-syntax-009
    type: prompt_response
    prompt: |
      How can a match arm compare an inner value to an outer variable instead of shadowing it?
    answer: |
      ```rust
      let y = 10;
      let x = Some(10);
      
      match x {
          Some(n) if n == y => println!("matched outer y"),
          _ => println!("no match"),
      }
      ```
      Use a match guard, such as `Some(n) if n == y => ...`. The pattern binds `n`, and the guard expression can refer to the outer `y`.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - transformation
    provenance:
      source_file: ch19_pattern_syntax.yaml
      chapter: "Chapter 19: Patterns and Matching"
      section: "Pattern Syntax"
      source: rust-book/src/ch19-03-pattern-syntax.md
      card_type: transformation
      compile_status: compiles
  - id: rust-book-ch19-pattern-syntax-010
    type: prompt_response
    prompt: |
      Which value kinds can use inclusive range patterns like `1..=5`?
    answer: |
      Numeric values and `char` values. The compiler can check at compile time that those ranges are not empty.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - concept_boundary
    provenance:
