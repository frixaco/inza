  - id: rust-book-ch19-pattern-syntax-015
    type: prompt_response
    prompt: |
      Do match guards participate in exhaustiveness checking?
    answer: |
      No. The compiler does not use guard conditions to prove that all cases are covered, so guarded matches may still need a catch-all arm.
    tags:
      - rust-book
      - ch19
      - pattern-syntax
      - concept_boundary
    provenance:
