  - id: rust-book-ch03-variables-and-mutability-009
    type: prompt_response
    prompt: |
      Why can shadowing be useful even when the final value should be immutable?
    answer: |
      Shadowing lets you transform a value through new bindings and then leave the final binding immutable, avoiding an ongoing mutable variable.
