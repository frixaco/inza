  - id: rust-book-ch03-variables-and-mutability-004
    type: prompt_response
    prompt: |
      Does this compile, and why?
      
      ```rust
      fn main() {
          let spaces = "   ";
          let spaces = spaces.len();
      }
      ```
    answer: |
      Yes. The second `let` shadows the first binding, so the new `spaces` can have type `usize` instead of `&str`.
    tags:
      - rust-book
      - ch03
      - variables-and-mutability
      - prediction
    provenance:
      source_file: ch03_variables_and_mutability.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: "Variables and Mutability"
      source: rust-book/src/ch03-01-variables-and-mutability.md
      card_type: prediction
      compile_status: compiles
  - id: rust-book-ch03-variables-and-mutability-005
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn main() {
          let mut spaces = "   ";
          spaces = spaces.len();
      }
      ```
    answer: |
      A mutable binding can change value but not type. `spaces` was inferred as `&str`, so assigning a `usize` from `len()` violates the type rule.
    tags:
      - rust-book
      - ch03
      - variables-and-mutability
      - diagnostic
    provenance:
      source_file: ch03_variables_and_mutability.yaml
      chapter: "Chapter 3: Common Programming Concepts"
