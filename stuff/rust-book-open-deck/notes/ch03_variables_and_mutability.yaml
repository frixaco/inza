      source: rust-book/src/ch03-01-variables-and-mutability.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch03-variables-and-mutability-006
    type: prompt_response
    prompt: |
      What are the extra rules for constants compared with immutable variables?
    answer: |
      Constants cannot use `mut`, must have an explicit type annotation, can be declared in any scope including global scope, and must be set to a constant expression.
    tags:
      - rust-book
      - ch03
      - variables-and-mutability
      - invariant
    provenance:
      source_file: ch03_variables_and_mutability.yaml
