      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch03-variables-and-mutability-003
    type: prompt_response
    prompt: |
      What is a constant in Rust, and how is it declared?
    answer: |
      A constant is an always-immutable named value declared with `const`, an explicit type, and a compile-time constant expression, such as `const THREE_HOURS_IN_SECONDS: u32 = 60 * 60 * 3;`.
    tags:
      - rust-book
      - ch03
      - variables-and-mutability
      - definition
    provenance:
