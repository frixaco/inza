- id: rust-book-ch07-paths-010
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Paths for Referring to an Item in the Module Tree"
  source: "rust-book/src/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.md"
  card_type: syntax
  front: |
    What do absolute and relative paths to the same module item look like?
  back: |
    ```rust
    mod front_of_house {
        pub mod hosting {
            pub fn add_to_waitlist() {}
        }
    }

    pub fn eat_at_restaurant() {
        crate::front_of_house::hosting::add_to_waitlist();
        front_of_house::hosting::add_to_waitlist();
    }
    ```
    The first path starts at `crate`; the second starts in the current module.
