- id: rust-book-ch07-use-keyword-004
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Bringing Paths Into Scope with the use Keyword"
  source: "rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md"
  card_type: syntax
  front: |
    What syntax gives an imported item a local alias?
  back: |
    ```rust
    use std::io::Result as IoResult;

    fn function2() -> IoResult<()> {
        Ok(())
    }
    ```
    `as` gives the imported item a local name.
  compile_status: compiles
  tags:
