- id: rust-book-ch07-use-keyword-014
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Bringing Paths Into Scope with the use Keyword"
  source: "rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md"
  card_type: syntax
  front: |
    What does a glob import look like?
  back: |
    ```rust
    use std::collections::*;

    fn main() {
        let mut scores = HashMap::new();
        scores.insert("Blue", 10);
    }
    ```
    `*` brings all public names from the path into scope.
