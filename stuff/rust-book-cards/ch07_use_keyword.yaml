- id: rust-book-ch07-use-keyword-001
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Bringing Paths Into Scope with the use Keyword"
  source: "rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md"
  card_type: definition
  front: |
    What does a `use` declaration let code do with a path?
  back: |
    `use` brings a path into scope so code can refer to the item with a shorter name.
  compile_status: concept_only
  tags:
