- id: rust-book-ch07-use-keyword-009
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Bringing Paths Into Scope with the use Keyword"
  source: "rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md"
  card_type: syntax
  front: |
    How can two `use` statements with the same prefix be combined with nested paths?
  back: |
    ```rust
    use std::{cmp::Ordering, io};

    fn main() {
        let order = Ordering::Equal;
        let stdin = io::stdin();
    }
    ```
    This brings both `std::cmp::Ordering` and `std::io` into scope.
  compile_status: compiles
  tags:
    - rust-book
    - ch07
    - use-keyword
    - syntax
- id: rust-book-ch07-use-keyword-010
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Bringing Paths Into Scope with the use Keyword"
  source: "rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md"
  card_type: syntax
  front: |
    In a nested `use` path, what does `self` mean?
  back: |
    ```rust
    use std::io::{self, Write};

    fn main() {
        let mut output = io::stdout();
        writeln!(output, "hello").unwrap();
    }
    ```
    `self` imports the common prefix itself; here it imports `std::io`.
  compile_status: compiles
  tags:
    - rust-book
    - ch07
    - use-keyword
    - syntax
- id: rust-book-ch07-use-keyword-011
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Bringing Paths Into Scope with the use Keyword"
  source: "rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md"
  card_type: concept_boundary
  front: |
    When is the glob operator `*` appropriate with `use`?
  back: |
    Use it sparingly, such as in tests to bring all public items into scope. It can make it harder to tell which names came from where.
  compile_status: concept_only
  tags:
    - rust-book
    - ch07
    - use-keyword
    - concept_boundary
- id: rust-book-ch07-use-keyword-012
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Bringing Paths Into Scope with the use Keyword"
  source: "rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md"
  card_type: syntax
  front: |
    What does a concrete `as` alias look like for two different `Result` types?
  back: |
    ```rust
    use std::fmt::Result;
    use std::io::Result as IoResult;

    fn function1() -> Result {
        Ok(())
    }

    fn function2() -> IoResult<()> {
        Ok(())
    }
    ```
    `as` avoids bringing two items into scope with the same local name.
  compile_status: compiles
  tags:
    - rust-book
    - ch07
    - use-keyword
    - syntax
