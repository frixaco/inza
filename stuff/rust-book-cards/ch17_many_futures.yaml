- id: rust-book-ch17-many-futures-001
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Working With Any Number of Futures"
  source: "rust-book/src/ch17-03-more-futures.md"
  card_type: diagnostic
  front: |
    What type rule makes a `Vec` of different `async` blocks fail even if each returns `()`?
  back: |
    Each `async` block has a distinct anonymous future type. A `Vec` needs one element type unless the futures are boxed as trait objects.
  compile_status: concept_only
  tags:
