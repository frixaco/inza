- id: rust-book-ch17-many-futures-005
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Working With Any Number of Futures"
  source: "rust-book/src/ch17-03-more-futures.md"
  card_type: comparison
  front: |
    Why does `thread::sleep` inside async work block differently from `trpl::sleep(...).await`?
  back: |
    `thread::sleep` blocks the current OS thread. `trpl::sleep(...).await` returns a future that can yield to the runtime while waiting.
  compile_status: concept_only
