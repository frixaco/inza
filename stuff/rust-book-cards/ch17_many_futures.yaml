- id: rust-book-ch17-many-futures-004
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Working With Any Number of Futures"
  source: "rust-book/src/ch17-03-more-futures.md"
  card_type: comparison
  front: |
    What is the difference between `join_all`-style waiting and racing futures?
  back: |
    Joining waits for all futures to finish. Racing returns when one future completes first and may cancel or ignore the rest depending on the API.
