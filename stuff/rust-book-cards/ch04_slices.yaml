- id: rust-book-ch04-slices-011
  chapter: "Chapter 4: Understanding Ownership"
  section: "The Slice Type"
  source: "rust-book/src/ch04-03-slices.md"
  card_type: syntax
  front: |
    What are the shorthand forms for slicing from the start, to the end, or the whole string?
  back: |
    ```rust
    fn main() {
        let s = String::from("hello");
        let a = &s[0..2];
        let b = &s[..2];
        let c = &s[3..s.len()];
        let d = &s[3..];
        let e = &s[0..s.len()];
        let f = &s[..];
        println!("{a} {b} {c} {d} {e} {f}");
    }
    ```
    Omitting the start means 0; omitting the end means the string length.
  compile_status: compiles
  tags:
    - rust-book
    - ch04
    - slices
    - syntax
- id: rust-book-ch04-slices-012
  chapter: "Chapter 4: Understanding Ownership"
  section: "The Slice Type"
  source: "rust-book/src/ch04-03-slices.md"
  card_type: syntax
  front: |
    What is the improved `first_word` signature that accepts both `String` values and string literals?
  back: |
    ```rust
    fn first_word(s: &str) -> &str {
        for (i, &item) in s.as_bytes().iter().enumerate() {
            if item == b' ' {
                return &s[..i];
            }
        }
        &s[..]
    }

    fn main() {
        let my_string = String::from("hello world");
        let word1 = first_word(&my_string[..]);
        let word2 = first_word("hello world");
        println!("{word1} {word2}");
    }
    ```
    Taking `&str` lets callers pass a string slice directly or pass a slice of a `String`.
  compile_status: compiles
  tags:
    - rust-book
    - ch04
    - slices
    - syntax
