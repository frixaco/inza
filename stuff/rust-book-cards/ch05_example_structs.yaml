- id: rust-book-ch05-example-structs-006
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "An Example Program Using Structs"
  source: "rust-book/src/ch05-02-example-structs.md"
  card_type: diagnostic
  front: |
    Why does `println!("{}", rect1)` fail for a custom `Rectangle` by default?
  back: |
    ```rust
    struct Rectangle {
        width: u32,
        height: u32,
    }

    fn main() {
        let rect1 = Rectangle { width: 30, height: 50 };
        println!("{}", rect1);
    }
    ```
    `{}` uses the `Display` trait, and Rust has no single canonical user-facing format for arbitrary structs. Use `Debug` with `#[derive(Debug)]` for developer output or implement `Display` yourself.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch05
    - example-structs
    - diagnostic
- id: rust-book-ch05-example-structs-007
  chapter: "Chapter 5: Using Structs to Structure Related Data"
