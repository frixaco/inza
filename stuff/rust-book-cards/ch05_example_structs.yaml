- id: rust-book-ch05-example-structs-008
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "An Example Program Using Structs"
  source: "rust-book/src/ch05-02-example-structs.md"
  card_type: concept_boundary
  front: |
    Why does the book call `dbg!(&rect1)` instead of `dbg!(rect1)`?
  back: |
    `dbg!` takes ownership of the expression and returns it. Passing `&rect1` avoids moving the `Rectangle`, so `rect1` remains usable afterward.
  compile_status: concept_only
  tags:
    - rust-book
    - ch05
    - example-structs
    - concept_boundary
