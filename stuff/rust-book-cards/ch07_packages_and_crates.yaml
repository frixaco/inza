- id: rust-book-ch07-packages-and-crates-002
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Packages and Crates"
  source: "rust-book/src/ch07-01-packages-and-crates.md"
  card_type: definition
  front: |
    What does a Cargo package bundle together?
  back: |
    A package is a bundle of one or more crates plus a `Cargo.toml` describing how to build them.
  compile_status: concept_only
  tags:
    - rust-book
