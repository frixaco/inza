- id: rust-book-ch07-packages-and-crates-003
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Packages and Crates"
  source: "rust-book/src/ch07-01-packages-and-crates.md"
  card_type: invariant
  front: |
    What crate composition rules does a Cargo package have?
  back: |
    A package can contain at most one library crate, can contain any number of binary crates, and must contain at least one crate.
  compile_status: concept_only
  tags:
    - rust-book
    - ch07
    - packages-and-crates
    - invariant
- id: rust-book-ch07-packages-and-crates-004
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Packages and Crates"
  source: "rust-book/src/ch07-01-packages-and-crates.md"
  card_type: api_recall
  front: |
    Which files are conventional crate roots for a Cargo package?
  back: |
    `src/main.rs` is the crate root for a binary crate. `src/lib.rs` is the crate root for a library crate.
  compile_status: non_rust
  tags:
    - rust-book
    - ch07
    - packages-and-crates
    - api_recall
- id: rust-book-ch07-packages-and-crates-005
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Packages and Crates"
  source: "rust-book/src/ch07-01-packages-and-crates.md"
  card_type: comparison
  front: |
    What is the difference between a binary crate and a library crate?
  back: |
    A binary crate compiles to an executable and must have a `main` function. A library crate exposes functionality for other code and does not have a `main` function.
  compile_status: concept_only
  tags:
    - rust-book
    - ch07
    - packages-and-crates
    - comparison
- id: rust-book-ch07-packages-and-crates-006
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Packages and Crates"
  source: "rust-book/src/ch07-01-packages-and-crates.md"
  card_type: definition
  front: |
    What role does a crate root source file play?
  back: |
    The crate root is the source file where the compiler starts and which forms the root module of the crate.
