- id: rust-book-ch20-advanced-traits-008
  chapter: "Chapter 20: Advanced Features"
  section: "Advanced Traits"
  source: "rust-book/src/ch20-02-advanced-traits.md"
  card_type: syntax
  front: |
    What does overloading `+` for a `Point` with `Add` look like?
  back: |
    ```rust
    use std::ops::Add;

    #[derive(Debug, PartialEq)]
    struct Point {
        x: i32,
        y: i32,
    }

    impl Add for Point {
        type Output = Point;

        fn add(self, other: Point) -> Point {
            Point {
                x: self.x + other.x,
                y: self.y + other.y,
            }
        }
    }
    ```
    `type Output` specifies the result type of the `+` operation.
  compile_status: compiles
  tags:
    - rust-book
    - ch20
    - advanced-traits
    - syntax
- id: rust-book-ch20-advanced-traits-009
  chapter: "Chapter 20: Advanced Features"
  section: "Advanced Traits"
  source: "rust-book/src/ch20-02-advanced-traits.md"
  card_type: syntax
  front: |
    What does using a nondefault `Rhs` type with `Add` look like?
  back: |
    ```rust
    use std::ops::Add;

    struct Millimeters(u32);
    struct Meters(u32);

    impl Add<Meters> for Millimeters {
        type Output = Millimeters;

        fn add(self, other: Meters) -> Millimeters {
            Millimeters(self.0 + (other.0 * 1000))
        }
    }
    ```
    `impl Add<Meters>` overrides the default `Rhs = Self`.
  compile_status: compiles
  tags:
    - rust-book
    - ch20
    - advanced-traits
    - syntax
- id: rust-book-ch20-advanced-traits-010
  chapter: "Chapter 20: Advanced Features"
  section: "Advanced Traits"
  source: "rust-book/src/ch20-02-advanced-traits.md"
  card_type: syntax
  front: |
    What does fully qualified syntax for an associated function look like?
  back: |
    ```rust
    trait Animal {
        fn baby_name() -> String;
    }

    struct Dog;

    impl Dog {
        fn baby_name() -> String {
            String::from("Spot")
        }
    }

    impl Animal for Dog {
        fn baby_name() -> String {
            String::from("puppy")
        }
    }

    fn main() {
        let name = <Dog as Animal>::baby_name();
        assert_eq!(name, "puppy");
    }
    ```
  compile_status: compiles
  tags:
    - rust-book
    - ch20
    - advanced-traits
    - syntax
- id: rust-book-ch20-advanced-traits-011
  chapter: "Chapter 20: Advanced Features"
  section: "Advanced Traits"
  source: "rust-book/src/ch20-02-advanced-traits.md"
  card_type: syntax
  front: |
    What does a supertrait requirement look like?
  back: |
    ```rust
    use std::fmt;

    trait OutlinePrint: fmt::Display {
        fn outline_print(&self) {
            let output = self.to_string();
            println!("* {output} *");
        }
    }
    ```
    Any type implementing `OutlinePrint` must also implement `Display`.
  compile_status: compiles
  tags:
    - rust-book
    - ch20
    - advanced-traits
    - syntax
