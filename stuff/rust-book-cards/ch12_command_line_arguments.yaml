- id: rust-book-ch12-command-line-arguments-004
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Accepting Command Line Arguments"
  source: "rust-book/src/ch12-01-accepting-command-line-arguments.md"
  card_type: diagnostic
  front: |
    Why is direct indexing into `args` fragile for CLI parsing?
  back: |
    If too few arguments are provided, indexing panics. Later code validates argument count and reports an error instead.
  compile_status: concept_only
  tags:
    - rust-book
