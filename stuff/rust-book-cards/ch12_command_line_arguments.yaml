- id: rust-book-ch12-command-line-arguments-005
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Accepting Command Line Arguments"
  source: "rust-book/src/ch12-01-accepting-command-line-arguments.md"
  card_type: concept_boundary
  front: |
    What caveat does the book give about `std::env::args()` and invalid Unicode?
  back: |
    `env::args()` will panic if any argument contains invalid Unicode. Use `std::env::args_os()` when the program needs to accept non-Unicode arguments.
  compile_status: concept_only
  tags:
    - rust-book
    - ch12
    - command-line-arguments
    - concept_boundary
