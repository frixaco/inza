  section: "Applying Concurrency with Async"
  source: "rust-book/src/ch17-02-concurrency-with-async.md"
  card_type: prediction
  front: |
    What happens to a task spawned with `trpl::spawn_task` if the main async block finishes first?
  back: |
    The task may be shut down before it completes. The book keeps the returned handle and awaits it when the spawned task must finish.
