- id: rust-book-ch17-async-concurrency-008
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Applying Concurrency with Async"
  source: "rust-book/src/ch17-02-concurrency-with-async.md"
  card_type: comparison
  front: |
    How does `trpl::join` differ from choosing only the first future that completes?
  back: |
    `join` waits for all of its futures to complete and returns all outputs. A race-style operation finishes when one branch completes and may cancel or ignore the others.
  compile_status: concept_only
  tags:
    - rust-book
    - ch17
    - async-concurrency
    - comparison
- id: rust-book-ch17-async-concurrency-009
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Applying Concurrency with Async"
  source: "rust-book/src/ch17-02-concurrency-with-async.md"
  card_type: concept_boundary
  front: |
    What fairness caveat does the book call out for async joining?
  back: |
    An executor or join operation must avoid polling one ready future forever while starving another. The book's `trpl::join` alternates polling so both futures can progress.
  compile_status: concept_only
  tags:
    - rust-book
    - ch17
    - async-concurrency
    - concept_boundary
- id: rust-book-ch17-async-concurrency-010
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Applying Concurrency with Async"
  source: "rust-book/src/ch17-02-concurrency-with-async.md"
  card_type: syntax
  front: |
    What does `async move` do to captured variables?
  back: |
    ```rust
    fn main() {
        let message = String::from("hello");
        let future = async move {
            println!("{message}");
        };
    }
    ```
    `move` transfers captured values into the async block's future, like `move` on closures.
  compile_status: compiles
  tags:
    - rust-book
    - ch17
    - async-concurrency
    - syntax
- id: rust-book-ch17-async-concurrency-011
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Applying Concurrency with Async"
  source: "rust-book/src/ch17-02-concurrency-with-async.md"
  card_type: prediction
  front: |
    What happens if the outer binding is used after an `async move` block captures its `String`?
  back: |
    ```rust
    fn main() {
        let message = String::from("hello");
        let future = async move {
            println!("{message}");
        };
        println!("{message}");
    }
    ```
    The `String` was moved into the future created by the async block.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch17
    - async-concurrency
    - prediction
