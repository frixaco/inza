  card_type: api_recall
  front: |
    What does `cargo add rand@0.8.5 trpl@0.2.0` do in the Rust Book's offline setup?
  back: |
    It downloads and caches those dependencies ahead of time so later Cargo commands can use `--offline` instead of trying the network.
