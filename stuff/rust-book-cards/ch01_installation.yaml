- id: rust-book-ch01-installation-005
  chapter: "Chapter 1: Getting Started"
  section: "Installation"
  source: "rust-book/src/ch01-01-installation.md"
  card_type: concept_boundary
  front: |
    Why might a new Rust installation still need a C compiler or platform tools?
  back: |
    Rust needs a linker to combine compiled outputs into an executable. Installing a C compiler or platform tools usually provides a linker, and some Rust packages also depend on C code.
  compile_status: concept_only
  tags:
    - rust-book
    - ch01
    - installation
    - concept_boundary
