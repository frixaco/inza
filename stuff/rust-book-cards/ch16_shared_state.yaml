- id: rust-book-ch16-shared-state-008
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Shared-State Concurrency"
  source: "rust-book/src/ch16-03-shared-state.md"
  card_type: diagnostic
  front: |
    Why does moving one `Mutex<i32>` into ten spawned closures fail?
  back: |
    ```rust
    use std::sync::Mutex;
    use std::thread;

    fn main() {
        let counter = Mutex::new(0);

        for _ in 0..10 {
            thread::spawn(move || {
                let mut num = counter.lock().unwrap();
                *num += 1;
            });
        }
    }
    ```
    The first closure takes ownership of the mutex, so later loop iterations no longer own a value to move. Shared ownership requires a smart pointer such as `Arc<T>`.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch16
    - shared-state
    - diagnostic
- id: rust-book-ch16-shared-state-009
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Shared-State Concurrency"
  source: "rust-book/src/ch16-03-shared-state.md"
  card_type: comparison
  front: |
    Why isn't every reference-counted pointer an `Arc<T>` by default?
  back: |
