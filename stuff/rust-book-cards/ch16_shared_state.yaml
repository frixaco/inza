- id: rust-book-ch16-shared-state-003
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Shared-State Concurrency"
  source: "rust-book/src/ch16-03-shared-state.md"
  card_type: diagnostic
  front: |
    Why does this fail?

    ```rust
    use std::rc::Rc;
    use std::sync::Mutex;
    use std::thread;

    fn main() {
        let counter = Rc::new(Mutex::new(0));
        let mut handles = vec![];

        for _ in 0..10 {
            let counter = Rc::clone(&counter);
            let handle = thread::spawn(move || {
                let mut num = counter.lock().unwrap();
                *num += 1;
            });
            handles.push(handle);
        }

        for handle in handles {
            handle.join().unwrap();
        }
    }
    ```
  back: |
    `Rc<T>` is not `Send`; its reference count is not safe to update across threads. Use `Arc<T>`.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch16
    - shared-state
    - diagnostic
- id: rust-book-ch16-shared-state-004
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Shared-State Concurrency"
  source: "rust-book/src/ch16-03-shared-state.md"
  card_type: comparison
  front: |
    What is the boundary between `Rc<T>` and `Arc<T>`?
  back: |
    Use `Rc<T>` for single-threaded shared ownership. Use `Arc<T>` for atomically reference-counted ownership across threads.
  compile_status: concept_only
