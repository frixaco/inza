- id: rust-book-ch08-vectors-003
  chapter: "Chapter 8: Common Collections"
  section: "Storing Lists of Values with Vectors"
  source: "rust-book/src/ch08-01-vectors.md"
  card_type: comparison
  front: |
    What is the difference between `&v[2]` and `v.get(2)`?
  back: |
    Indexing returns a reference or panics if out of bounds. `get` returns `Option<&T>` so the missing case can be handled explicitly.
