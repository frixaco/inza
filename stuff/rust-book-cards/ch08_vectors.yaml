- id: rust-book-ch08-vectors-012
  chapter: "Chapter 8: Common Collections"
  section: "Storing Lists of Values with Vectors"
  source: "rust-book/src/ch08-01-vectors.md"
  card_type: syntax
  front: |
    How do you handle a vector lookup with `get`?
  back: |
    ```rust
    fn main() {
        let v = vec![1, 2, 3, 4, 5];
        match v.get(2) {
            Some(third) => println!("The third element is {third}"),
            None => println!("There is no third element."),
        }
    }
    ```
    `get` returns `Option<&T>`.
  compile_status: compiles
