- id: rust-book-ch08-vectors-008
  chapter: "Chapter 8: Common Collections"
  section: "Storing Lists of Values with Vectors"
  source: "rust-book/src/ch08-01-vectors.md"
  card_type: transformation
  front: |
    How do you add 50 to every element while iterating mutably over a `Vec<i32>`?
  back: |
    Iterate over `&mut v` and dereference each element before assigning:
    
    ```rust
    let mut v = vec![100, 32, 57];

    for i in &mut v {
        *i += 50;
    }
    ```
  compile_status: compiles
  tags:
    - rust-book
    - ch08
    - vectors
    - transformation
- id: rust-book-ch08-vectors-009
  chapter: "Chapter 8: Common Collections"
  section: "Storing Lists of Values with Vectors"
  source: "rust-book/src/ch08-01-vectors.md"
  card_type: diagnostic
  front: |
    Why can't a `for` loop over `&v` insert or remove items from `v` inside the loop body?
  back: |
    The loop holds a borrow of the vector while iterating. Mutating the vector at the same time could invalidate references to its elements.
  compile_status: concept_only
