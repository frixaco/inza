- id: rust-book-ch08-vectors-014
  chapter: "Chapter 8: Common Collections"
  section: "Storing Lists of Values with Vectors"
  source: "rust-book/src/ch08-01-vectors.md"
  card_type: syntax
  front: |
    What syntax iterates immutably over every value in a vector?
  back: |
    ```rust
    fn main() {
        let v = vec![100, 32, 57];
        for i in &v {
            println!("{i}");
        }
    }
    ```
    Iterating over `&v` borrows the vector without consuming it.
