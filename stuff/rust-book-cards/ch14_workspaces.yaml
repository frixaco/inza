- id: rust-book-ch14-workspaces-002
  chapter: "Chapter 14: More about Cargo and Crates.io"
  section: "Cargo Workspaces"
  source: "rust-book/src/ch14-03-cargo-workspaces.md"
  card_type: syntax
  front: |
    What top-level TOML key lists workspace member packages?
  back: |
    ```toml
    [workspace]
    members = ["adder", "add_one"]
    ```
  compile_status: non_rust
  tags:
