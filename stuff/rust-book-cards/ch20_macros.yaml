- id: rust-book-ch20-macros-003
  chapter: "Chapter 20: Advanced Features"
  section: "Macros"
  source: "rust-book/src/ch20-05-macros.md"
  card_type: comparison
  front: |
    What is the difference between declarative and procedural macros?
  back: |
    Declarative macros match input against patterns and expand templates. Procedural macros take token streams as input and produce token streams as output.
  compile_status: concept_only
  tags:
