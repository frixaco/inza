    - comparison
- id: rust-book-ch20-macros-004
  chapter: "Chapter 20: Advanced Features"
  section: "Macros"
  source: "rust-book/src/ch20-05-macros.md"
  card_type: syntax
  front: |
    What macro form defines a declarative macro?
  back: |
    ```rust
    macro_rules! say_hello {
        () => {
            println!("hello");
        };
    }

    fn main() {
        say_hello!();
    }
    ```
    Declarative macros are defined with `macro_rules! name { ... }`.
  compile_status: compiles
  tags:
