- id: rust-book-ch20-macros-002
  chapter: "Chapter 20: Advanced Features"
  section: "Macros"
  source: "rust-book/src/ch20-05-macros.md"
  card_type: comparison
  front: |
    What is a key difference between macros and functions?
  back: |
    Macros are expanded before compilation and can take variable numbers or shapes of arguments. Functions have fixed signatures and are called at runtime.
  compile_status: concept_only
  tags:
    - rust-book
