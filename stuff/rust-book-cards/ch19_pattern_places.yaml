- id: rust-book-ch19-pattern-places-005
  chapter: "Chapter 19: Patterns and Matching"
  section: "All the Places Patterns Can Be Used"
  source: "rust-book/src/ch19-01-all-the-places-for-patterns.md"
  card_type: syntax
  front: |
    What does tuple destructuring in a `let` statement look like?
  back: |
    ```rust
    fn main() {
        let (x, y, z) = (1, 2, 3);
        println!("{x}, {y}, {z}");
    }
    ```
    The tuple pattern must match the tuple value's shape.
