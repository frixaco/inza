- id: rust-book-ch07-modules-privacy-002
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Control Scope and Privacy with Modules"
  source: "rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md"
  card_type: syntax
  front: |
    What syntax declares a module named `front_of_house` inline?
  back: |
    ```rust
    mod front_of_house {
        mod hosting {
            fn add_to_waitlist() {}
        }
    }
    ```
