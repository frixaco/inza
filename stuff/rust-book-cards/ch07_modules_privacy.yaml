- id: rust-book-ch07-modules-privacy-009
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Control Scope and Privacy with Modules"
  source: "rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md"
  card_type: project_architecture
  front: |
    Why use modules instead of leaving all code in one file?
  back: |
    Modules group related definitions, name relationships between code, control scope, and choose which implementation details are public or private.
