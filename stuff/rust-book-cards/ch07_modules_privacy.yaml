  section: "Control Scope and Privacy with Modules"
  source: "rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md"
  card_type: api_recall
  front: |
    Where does Rust look for `mod vegetables;` declared inside `src/garden.rs`?
  back: |
    In `src/garden/vegetables.rs` or `src/garden/vegetables/mod.rs`.
