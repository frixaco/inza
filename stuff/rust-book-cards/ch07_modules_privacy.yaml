- id: rust-book-ch07-modules-privacy-003
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Control Scope and Privacy with Modules"
  source: "rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md"
  card_type: invariant
  front: |
    What is Rust's default privacy rule for modules and items?
  back: |
    Items are private to their parent modules by default. Use `pub` to expose an item to ancestor modules.
  compile_status: concept_only
  tags:
    - rust-book
    - ch07
    - modules-privacy
    - invariant
- id: rust-book-ch07-modules-privacy-004
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Control Scope and Privacy with Modules"
  source: "rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md"
  card_type: misconception
  front: |
    Does `pub mod hosting` automatically make every function inside `hosting` public?
  back: |
    No. Making the module public exposes the module path, but each item inside still needs `pub` if callers should use it.
  compile_status: concept_only
  tags:
    - rust-book
    - ch07
    - modules-privacy
    - misconception
- id: rust-book-ch07-modules-privacy-005
  chapter: "Chapter 7: Packages, Crates, and Modules"
  section: "Control Scope and Privacy with Modules"
  source: "rust-book/src/ch07-02-defining-modules-to-control-scope-and-privacy.md"
  card_type: definition
  front: |
    What does `mod garden;` in a crate root make the compiler do?
  back: |
    It declares a `garden` module and makes the compiler look for its source in `src/garden.rs` or `src/garden/mod.rs`.
  compile_status: non_rust
  tags:
    - rust-book
    - ch07
    - modules-privacy
    - definition
