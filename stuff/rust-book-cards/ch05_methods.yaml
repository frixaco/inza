- id: rust-book-ch05-methods-008
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Methods"
  source: "rust-book/src/ch05-03-method-syntax.md"
  card_type: concept_boundary
  front: |
    Can a method have the same name as a struct field?
  back: |
    Yes. `rect.width` accesses the field, while `rect.width()` calls the method. Getter methods often use the same name as the private field they expose.
