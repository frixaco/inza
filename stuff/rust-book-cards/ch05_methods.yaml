- id: rust-book-ch05-methods-012
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Methods"
  source: "rust-book/src/ch05-03-method-syntax.md"
  card_type: syntax
  front: |
    What does a complete associated function returning `Self` look like for `Rectangle::square`?
  back: |
    ```rust
    struct Rectangle {
        width: u32,
        height: u32,
    }

    impl Rectangle {
        fn square(size: u32) -> Self {
            Self {
                width: size,
                height: size,
            }
        }
    }

    fn main() {
        let square = Rectangle::square(3);
        println!("{}", square.width);
    }
    ```
  compile_status: compiles
  tags:
