- id: rust-book-ch05-methods-004
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Methods"
  source: "rust-book/src/ch05-03-method-syntax.md"
  card_type: api_recall
  front: |
    What does Rust automatically do for method calls like `p1.distance(&p2)`?
  back: |
    Rust automatically borrows, mutably borrows, or dereferences the receiver as needed to match the method's `self` parameter.
