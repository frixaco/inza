- id: rust-book-ch05-methods-003
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Methods"
  source: "rust-book/src/ch05-03-method-syntax.md"
  card_type: concept_boundary
  front: |
    When should a method take `self`, `&self`, or `&mut self`?
  back: |
    Use `self` to consume the value, `&self` to read it, and `&mut self` to mutate it without taking ownership.
