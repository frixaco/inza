- id: rust-book-ch05-methods-007
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Methods"
  source: "rust-book/src/ch05-03-method-syntax.md"
  card_type: syntax
  front: |
    What is the method syntax for checking whether one `Rectangle` can hold another?
  back: |
    ```rust
    struct Rectangle {
        width: u32,
        height: u32,
    }

    impl Rectangle {
        fn can_hold(&self, other: &Rectangle) -> bool {
            self.width > other.width && self.height > other.height
        }
    }
    ```
