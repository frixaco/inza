- id: rust-book-ch05-methods-013
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Methods"
  source: "rust-book/src/ch05-03-method-syntax.md"
  card_type: syntax
  front: |
    How do you call a method versus an associated function on the same type?
  back: |
    Use dot syntax for a method with `self`, and `::` for an associated function without `self`:
    ```rust
    struct Rectangle { width: u32, height: u32 }

    impl Rectangle {
        fn area(&self) -> u32 { self.width * self.height }
        fn square(size: u32) -> Self { Self { width: size, height: size } }
    }

    fn main() {
        let rect = Rectangle::square(3);
        let area = rect.area();
        println!("{area}");
    }
    ```
  compile_status: compiles
  tags:
    - rust-book
    - ch05
    - methods
    - syntax
