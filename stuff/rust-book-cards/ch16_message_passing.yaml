- id: rust-book-ch16-message-passing-009
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Transfer Data Between Threads with Message Passing"
  source: "rust-book/src/ch16-02-message-passing.md"
  card_type: api_recall
  front: |
    What happens when you iterate over `rx` in a `for` loop?
  back: |
    ```rust
    use std::sync::mpsc;

    let (tx, rx) = mpsc::channel();
    tx.send("hi").unwrap();
    drop(tx);

    for received in rx {
        println!("{received}");
    }
    ```
    The loop receives each value as it arrives and ends when the channel is closed.
  compile_status: compiles
  tags:
    - rust-book
    - ch16
    - message-passing
    - api_recall
