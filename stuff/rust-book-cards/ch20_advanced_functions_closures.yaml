- id: rust-book-ch20-advanced-functions-closures-003
  chapter: "Chapter 20: Advanced Features"
  section: "Advanced Functions and Closures"
  source: "rust-book/src/ch20-04-advanced-functions-and-closures.md"
  card_type: concept_boundary
  front: |
    When should a parameter use `fn` instead of a generic `Fn` bound?
  back: |
    Use `fn` when you specifically need a function pointer, often for C interop. Use `Fn` bounds to accept closures and functions.
  compile_status: concept_only
