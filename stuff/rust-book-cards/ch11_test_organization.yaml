- id: rust-book-ch11-test-organization-009
  chapter: "Chapter 11: Writing Automated Tests"
  section: "Test Organization"
  source: "rust-book/src/ch11-03-test-organization.md"
  card_type: project_architecture
  front: |
    Why are integration tests mainly for library crates?
  back: |
    Integration tests import the crate under test as an external crate. Binary-only crates do not expose functions for integration tests to import, which is why projects often keep reusable logic in `src/lib.rs`.
  compile_status: concept_only
  tags:
    - rust-book
    - ch11
    - test-organization
