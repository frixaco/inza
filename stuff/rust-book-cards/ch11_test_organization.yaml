- id: rust-book-ch11-test-organization-008
  chapter: "Chapter 11: Writing Automated Tests"
  section: "Test Organization"
  source: "rust-book/src/ch11-03-test-organization.md"
  card_type: concept_boundary
  front: |
    Do integration tests need `#[cfg(test)]`?
  back: |
    No. Cargo treats the `tests/` directory specially and compiles integration tests only when running `cargo test`.
