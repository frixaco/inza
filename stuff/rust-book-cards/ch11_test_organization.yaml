- id: rust-book-ch11-test-organization-005
  chapter: "Chapter 11: Writing Automated Tests"
  section: "Test Organization"
  source: "rust-book/src/ch11-03-test-organization.md"
  card_type: concept_boundary
  front: |
    Why can unit tests test private functions?
  back: |
    ```rust
    fn internal_adder(left: u64, right: u64) -> u64 {
        left + right
    }

    #[cfg(test)]
    mod tests {
        use super::*;

        #[test]
        fn internal() {
            assert_eq!(4, internal_adder(2, 2));
        }
    }
    ```
    The `tests` module is a child module of the code being tested, and child modules can access items in their ancestor modules.
  compile_status: compiles
  tags:
    - rust-book
    - ch11
    - test-organization
    - concept_boundary
