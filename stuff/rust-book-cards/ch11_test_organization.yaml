- id: rust-book-ch11-test-organization-004
  chapter: "Chapter 11: Writing Automated Tests"
  section: "Test Organization"
  source: "rust-book/src/ch11-03-test-organization.md"
  card_type: project_architecture
  front: |
    Why put shared integration-test helper code in `tests/common/mod.rs` instead of `tests/common.rs`?
  back: |
    A file directly under `tests/` is treated as an integration test crate. A module file under a directory can be imported by tests without being run as its own test crate.
