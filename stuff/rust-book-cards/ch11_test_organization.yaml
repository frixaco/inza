- id: rust-book-ch11-test-organization-002
  chapter: "Chapter 11: Writing Automated Tests"
  section: "Test Organization"
  source: "rust-book/src/ch11-03-test-organization.md"
  card_type: syntax
  front: |
    Where do unit tests conventionally live in a source file?
  back: |
    ```rust
    #[cfg(test)]
    mod tests {
        #[test]
        fn it_works() {
            assert_eq!(2 + 2, 4);
        }
    }
    ```
    Inside a `#[cfg(test)] mod tests { ... }` module.
  compile_status: compiles
