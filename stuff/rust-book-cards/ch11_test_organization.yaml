- id: rust-book-ch11-test-organization-001
  chapter: "Chapter 11: Writing Automated Tests"
  section: "Test Organization"
  source: "rust-book/src/ch11-03-test-organization.md"
  card_type: comparison
  front: |
    What is the difference between unit tests and integration tests in Rust?
  back: |
    Unit tests live near the code and can test private items. Integration tests live in `tests/` and use the library as an external crate.
  compile_status: concept_only
