- id: rust-book-ch15-deref-002
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: syntax
  front: |
    What associated type and method must a simple smart pointer implement for `Deref`?
  back: |
    ```rust
    struct MyBox<T>(T);

    impl<T> std::ops::Deref for MyBox<T> {
        type Target = T;
        fn deref(&self) -> &Self::Target { &self.0 }
    }
    ```
  compile_status: compiles
  tags:
    - rust-book
    - ch15
    - deref
    - syntax
- id: rust-book-ch15-deref-003
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: prediction
  front: |
    What does `*y` access when `y` is a `Box<i32>`?
  back: |
    ```rust
    let y = Box::new(5);
    assert_eq!(5, *y);
    ```
    `Box<T>` implements `Deref<Target = T>`, so `*y` follows the box to the contained `i32`.
  compile_status: compiles
  tags:
    - rust-book
    - ch15
    - deref
    - prediction
- id: rust-book-ch15-deref-004
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: definition
  front: |
    Which automatic reference conversion is deref coercion?
  back: |
    Deref coercion is the automatic conversion from a reference to a type implementing `Deref` into a reference to its target type.
  compile_status: concept_only
  tags:
    - rust-book
    - ch15
    - deref
    - definition
- id: rust-book-ch15-deref-005
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: comparison
  front: |
    What is the boundary between `Deref` and `DerefMut`?
  back: |
    `Deref` supports immutable dereferencing to `&Target`; `DerefMut` supports mutable dereferencing to `&mut Target`.
  compile_status: concept_only
  tags:
    - rust-book
    - ch15
    - deref
    - comparison
- id: rust-book-ch15-deref-006
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
