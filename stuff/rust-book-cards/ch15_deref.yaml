- id: rust-book-ch15-deref-007
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: diagnostic
  front: |
    Why does `*y` fail for a custom smart pointer until `Deref` is implemented?
  back: |
    ```rust
    struct MyBox<T>(T);

    fn main() {
        let y = MyBox(5);
        assert_eq!(5, *y);
    }
    ```
    Without `Deref`, the compiler only knows how to dereference ordinary references. Implementing `Deref` tells Rust how to get a reference to the target value.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch15
    - deref
    - diagnostic
- id: rust-book-ch15-deref-008
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: prediction
  front: |
    What does deref coercion turn `&MyBox<String>` into for a function expecting `&str`?
  back: |
    Deref coercion can turn `&MyBox<String>` into `&String` by calling `MyBox::deref`, then `&String` into `&str` by using `String`'s `Deref` implementation.
  compile_status: concept_only
  tags:
    - rust-book
    - ch15
    - deref
    - prediction
- id: rust-book-ch15-deref-009
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: invariant
  front: |
    What are the three deref coercion cases the book lists?
  back: |
    `&T` to `&U` when `T: Deref<Target = U>`, `&mut T` to `&mut U` when `T: DerefMut<Target = U>`, and `&mut T` to `&U` when `T: Deref<Target = U>`.
  compile_status: concept_only
  tags:
    - rust-book
    - ch15
    - deref
    - invariant
- id: rust-book-ch15-deref-010
  chapter: "Chapter 15: Smart Pointers"
  section: "Treating Smart Pointers Like Regular References"
  source: "rust-book/src/ch15-02-deref.md"
  card_type: concept_boundary
  front: |
    Why doesn't Rust coerce `&T` to `&mut U` through deref coercion?
  back: |
    An immutable reference cannot be coerced into a mutable reference because that would violate Rust's borrowing rules.
  compile_status: concept_only
