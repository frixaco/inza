- id: rust-book-ch21-single-threaded-012
  chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
  section: "Building a Single-Threaded Web Server"
  source: "rust-book/src/ch21-01-single-threaded.md"
  card_type: syntax
  front: |
    What is the basic `TcpListener` loop shape in the book server?
  back: |
    ```rust
    use std::net::TcpListener;

    fn main() {
        let listener = TcpListener::bind("127.0.0.1:7878").unwrap();

        for stream in listener.incoming() {
            let stream = stream.unwrap();
            println!("Connection established!");
        }
    }
    ```
    `bind` returns a `Result`, and `incoming` yields connection attempts.
  compile_status: compiles
  tags:
    - rust-book
    - ch21
    - single-threaded
    - syntax
- id: rust-book-ch21-single-threaded-013
  chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
  section: "Building a Single-Threaded Web Server"
  source: "rust-book/src/ch21-01-single-threaded.md"
  card_type: syntax
  front: |
    How does the book collect HTTP request lines until the blank line?
  back: |
    ```rust
    use std::io::{BufRead, BufReader};
    use std::net::TcpStream;

    fn handle_connection(stream: TcpStream) {
        let buf_reader = BufReader::new(&stream);
        let http_request: Vec<_> = buf_reader
            .lines()
            .map(|result| result.unwrap())
            .take_while(|line| !line.is_empty())
            .collect();
    }
    ```
    The blank line marks the end of the HTTP request headers.
  compile_status: compiles
  tags:
    - rust-book
    - ch21
    - single-threaded
    - syntax
- id: rust-book-ch21-single-threaded-014
  chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
  section: "Building a Single-Threaded Web Server"
  source: "rust-book/src/ch21-01-single-threaded.md"
  card_type: syntax
  front: |
    What does the book's response formatting shape look like?
  back: |
    ```rust
    fn response(status_line: &str, contents: &str) -> String {
        let length = contents.len();
        format!("{status_line}\r\nContent-Length: {length}\r\n\r\n{contents}")
    }
    ```
    The `\r\n\r\n` separates headers from the body.
  compile_status: compiles
