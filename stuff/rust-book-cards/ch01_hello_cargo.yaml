- id: rust-book-ch01-hello-cargo-004
  chapter: "Chapter 1: Getting Started"
  section: "Hello, Cargo!"
  source: "rust-book/src/ch01-03-hello-cargo.md"
  card_type: concept_boundary
  front: |
    When would you use `cargo build --release` instead of `cargo build`?
  back: |
    Use `--release` when you want optimized code for distribution or benchmarking; it takes longer to compile and writes to `target/release`.
  compile_status: non_rust
