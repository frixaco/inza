  chapter: "Chapter 1: Getting Started"
  section: "Hello, Cargo!"
  source: "rust-book/src/ch01-03-hello-cargo.md"
  card_type: definition
  front: |
    Which two roles does Cargo play in the Rust ecosystem?
  back: |
    Cargo is Rust's build system and package manager. It builds your package, downloads dependency crates, and builds those dependencies.
