  section: "Implementing an Object-Oriented Design Pattern"
  source: "rust-book/src/ch18-03-oo-design-patterns.md"
  card_type: diagnostic
  front: |
    Why does the trait-object state pattern store `state` as `Option<Box<dyn State>>`?
  back: |
    State transition methods consume the old boxed state and return a new one. `Option::take` lets `Post` move the current state out of `&mut self` temporarily, leaving `None` until the replacement is stored.
