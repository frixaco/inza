  chapter: "Chapter 9: Error Handling"
  section: "Recoverable Errors with Result"
  source: "rust-book/src/ch09-02-recoverable-errors-with-result.md"
  card_type: syntax
  front: |
    What `main` signature lets the book use `?` on `Result` values?
  back: |
    ```rust
    use std::error::Error;

    fn main() -> Result<(), Box<dyn Error>> {
        Ok(())
    }
    ```
    In the book, `Box<dyn Error>` means “any kind of error” at this stage.
  compile_status: compiles
