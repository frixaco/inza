- id: rust-book-ch09-recoverable-errors-with-result-009
  chapter: "Chapter 9: Error Handling"
  section: "Recoverable Errors with Result"
  source: "rust-book/src/ch09-02-recoverable-errors-with-result.md"
  card_type: transformation
  front: |
    What does `unwrap_or_else` add compared with plain `unwrap` when handling `Result`?
  back: |
    ```rust
    let value = "42".parse::<i32>().unwrap_or_else(|error| {
        panic!("could not parse integer: {error}");
    });
    ```
    It returns the `Ok` value, or lazily runs a closure with the error value so code can choose custom handling for the `Err` case.
