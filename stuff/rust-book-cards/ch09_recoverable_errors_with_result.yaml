- id: rust-book-ch09-recoverable-errors-with-result-002
  chapter: "Chapter 9: Error Handling"
  section: "Recoverable Errors with Result"
  source: "rust-book/src/ch09-02-recoverable-errors-with-result.md"
  card_type: comparison
  front: |
    What is the practical difference between `unwrap` and `expect`?
  back: |
    Both return the `Ok` value or panic on `Err`; `expect` lets you supply a panic message explaining the assumption.
