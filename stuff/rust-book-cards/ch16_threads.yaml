- id: rust-book-ch16-threads-004
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Using Threads to Run Code Simultaneously"
  source: "rust-book/src/ch16-01-threads.md"
  card_type: diagnostic
  front: |
    Why does this spawned closure need `move`?

    ```rust
    use std::thread;

    fn main() {
        let v = vec![1, 2, 3];

        let handle = thread::spawn(|| {
            println!("Here's a vector: {v:?}");
        });

        handle.join().unwrap();
    }
    ```
  back: |
    The spawned thread may outlive the current function, so the closure must take ownership of captured values instead of borrowing them.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch16
    - threads
    - diagnostic
- id: rust-book-ch16-threads-005
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Using Threads to Run Code Simultaneously"
  source: "rust-book/src/ch16-01-threads.md"
  card_type: concept_boundary
  front: |
    Why can placing `join` immediately after `spawn` remove concurrency?
  back: |
    The main thread waits right away, so it cannot do its own work concurrently with the spawned thread.
