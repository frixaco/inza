- id: rust-book-ch16-threads-002
  chapter: "Chapter 16: Fearless Concurrency"
  section: "Using Threads to Run Code Simultaneously"
  source: "rust-book/src/ch16-01-threads.md"
  card_type: api_recall
  front: |
    What does calling `join` on a thread handle do?
  back: |
    ```rust
    let handle = std::thread::spawn(|| 5);
    let result = handle.join().unwrap();
    assert_eq!(result, 5);
    ```
    It waits for the spawned thread to finish and returns a `Result` indicating whether the thread panicked.
