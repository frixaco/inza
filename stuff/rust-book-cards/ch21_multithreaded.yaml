- id: rust-book-ch21-multithreaded-001
  chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
  section: "From Single-Threaded to Multithreaded Server"
  source: "rust-book/src/ch21-02-multithreaded.md"
  card_type: project_architecture
  front: |
    Why does the server need a thread pool?
  back: |
    A single slow request blocks all later requests. A thread pool lets multiple requests be handled concurrently with a bounded number of worker threads.
