- id: rust-book-ch13-iterators-008
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Processing a Series of Items with Iterators"
  source: "rust-book/src/ch13-02-iterators.md"
  card_type: diagnostic
  front: |
    Why does calling `next` directly require a mutable iterator binding?
  back: |
    `next` advances internal iterator state, so it takes `&mut self` and consumes one item at a time.
