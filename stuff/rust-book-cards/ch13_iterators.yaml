- id: rust-book-ch13-iterators-001
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Processing a Series of Items with Iterators"
  source: "rust-book/src/ch13-02-iterators.md"
  card_type: definition
  front: |
    Which trait behavior makes a value an iterator in Rust?
  back: |
    Implementing the `Iterator` trait and its `next` method makes a value produce a sequence of items.
