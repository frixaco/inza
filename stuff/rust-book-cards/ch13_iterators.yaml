- id: rust-book-ch13-iterators-006
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Processing a Series of Items with Iterators"
  source: "rust-book/src/ch13-02-iterators.md"
  card_type: diagnostic
  front: |
    Why does `v1.iter().map(|x| x + 1);` by itself do nothing observable?
  back: |
    Iterator adapters are lazy. Without a consuming adapter or loop, the returned iterator is never driven.
