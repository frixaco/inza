- id: rust-book-ch13-iterators-003
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Processing a Series of Items with Iterators"
  source: "rust-book/src/ch13-02-iterators.md"
  card_type: comparison
  front: |
    What is the difference between `iter`, `iter_mut`, and `into_iter` on a collection?
  back: |
    `iter` yields shared references, `iter_mut` yields mutable references, and `into_iter` usually consumes the collection to yield owned values.
  compile_status: concept_only
  tags:
    - rust-book
    - ch13
    - iterators
    - comparison
- id: rust-book-ch13-iterators-004
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Processing a Series of Items with Iterators"
  source: "rust-book/src/ch13-02-iterators.md"
  card_type: definition
  front: |
    Which kind of iterator adapter drives an iterator to completion?
  back: |
    Consuming adapters, such as `sum`, take ownership of the iterator and drive it to completion.
