- id: rust-book-ch13-iterators-005
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Processing a Series of Items with Iterators"
  source: "rust-book/src/ch13-02-iterators.md"
  card_type: definition
  front: |
    Which kind of iterator method returns a new lazy iterator?
  back: |
    Iterator adapters such as `map` or `filter` return a new iterator; they are lazy until consumed.
