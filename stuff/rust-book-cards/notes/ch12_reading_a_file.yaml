  - id: rust-book-ch12-reading-a-file-002
    type: prompt_response
    prompt: |
      Why should file-reading errors be handled instead of ignored in a CLI tool?
    answer: |
      The user needs to know when the file path is wrong, inaccessible, or otherwise unreadable, rather than seeing misleading empty output.
    tags:
      - rust-book
