notes:
  - id: rust-book-ch12-reading-a-file-001
    type: prompt_response
    prompt: |
      Which function reads an entire file into a `String` in the minigrep project?
    answer: |
      ```rust
      let contents = std::fs::read_to_string("poem.txt");
      ```
      `fs::read_to_string(file_path)` returns `Result<String, io::Error>`.
