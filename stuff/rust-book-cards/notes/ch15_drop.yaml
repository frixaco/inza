  - id: rust-book-ch15-drop-008
    type: prompt_response
    prompt: |
      How do you explicitly drop a value before the end of scope?
    answer: |
      ```rust
      struct CustomSmartPointer {
          data: String,
      }
      
      impl Drop for CustomSmartPointer {
          fn drop(&mut self) {
              println!("Dropping `{}`", self.data);
          }
      }
      
      fn main() {
          let c = CustomSmartPointer { data: String::from("some data") };
          std::mem::drop(c);
          println!("dropped before the end of main");
      }
      ```
      `std::mem::drop` consumes the value, so it cannot be used afterward.
    tags:
      - rust-book
      - ch15
      - drop
      - syntax
    provenance:
