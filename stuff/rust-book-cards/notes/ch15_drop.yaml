  - id: rust-book-ch15-drop-003
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      struct CustomSmartPointer {
          data: String,
      }
      
      impl Drop for CustomSmartPointer {
          fn drop(&mut self) {
              println!("Dropping `{}`", self.data);
          }
      }
      
      fn main() {
          let c = CustomSmartPointer {
              data: String::from("some data"),
          };
          c.drop();
      }
      ```
    answer: |
      Rust prevents explicit calls to the destructor method because it would risk double cleanup. Use `std::mem::drop(c)` to drop early.
    tags:
      - rust-book
      - ch15
      - drop
      - diagnostic
    provenance:
      source_file: ch15_drop.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Running Code on Cleanup with the Drop Trait"
      source: rust-book/src/ch15-03-drop.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch15-drop-004
    type: prompt_response
    prompt: |
      What does `std::mem::drop(value)` do?
    answer: |
      It takes ownership of `value`, so the value is dropped before the end of its scope.
    tags:
      - rust-book
      - ch15
      - drop
      - api_recall
    provenance:
      source_file: ch15_drop.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Running Code on Cleanup with the Drop Trait"
      source: rust-book/src/ch15-03-drop.md
      card_type: api_recall
      compile_status: concept_only
  - id: rust-book-ch15-drop-005
    type: prompt_response
    prompt: |
      In what order are local variables dropped at the end of a scope?
    answer: |
      They are dropped in reverse order of creation.
    tags:
      - rust-book
      - ch15
      - drop
      - prediction
    provenance:
      source_file: ch15_drop.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Running Code on Cleanup with the Drop Trait"
      source: rust-book/src/ch15-03-drop.md
      card_type: prediction
      compile_status: concept_only
  - id: rust-book-ch15-drop-006
    type: prompt_response
    prompt: |
      Is the `Drop` trait usually called manually by user code?
    answer: |
      No. Rust calls `Drop::drop` automatically when a value goes out of scope. To drop early, call the safe function `std::mem::drop`, which consumes the value.
    tags:
      - rust-book
      - ch15
      - drop
      - concept_boundary
    provenance:
      source_file: ch15_drop.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Running Code on Cleanup with the Drop Trait"
      source: rust-book/src/ch15-03-drop.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch15-drop-007
    type: prompt_response
    prompt: |
      What does a complete `Drop` implementation look like?
    answer: |
      ```rust
      struct CustomSmartPointer {
          data: String,
      }
      
      impl Drop for CustomSmartPointer {
          fn drop(&mut self) {
              println!("Dropping CustomSmartPointer with data `{}`!", self.data);
          }
      }
      ```
      Rust calls `drop` automatically when the value goes out of scope.
    tags:
      - rust-book
      - ch15
      - drop
      - syntax
    provenance:
      source_file: ch15_drop.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Running Code on Cleanup with the Drop Trait"
