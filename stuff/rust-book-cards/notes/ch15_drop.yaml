  - id: rust-book-ch15-drop-002
    type: prompt_response
    prompt: |
      What method does a `Drop` implementation define?
    answer: |
      `fn drop(&mut self) { ... }` in an `impl Drop for Type` block.
    tags:
      - rust-book
      - ch15
      - drop
      - syntax
    provenance:
      source_file: ch15_drop.yaml
