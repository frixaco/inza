notes:
  - id: rust-book-ch10-traits-001
    type: prompt_response
    prompt: |
      What shared behavior does a Rust trait define?
    answer: |
      A trait defines shared behavior by specifying method signatures and optionally default method bodies.
    tags:
      - rust-book
      - ch10
      - traits
      - definition
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch10-traits-002
    type: prompt_response
    prompt: |
      What syntax implements a trait for a type?
    answer: |
      ```rust
      trait Summary { fn summarize(&self) -> String; }
      struct NewsArticle;
      impl Summary for NewsArticle {
          fn summarize(&self) -> String { String::from("article") }
      }
      ```
    tags:
      - rust-book
      - ch10
      - traits
      - syntax
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-traits-003
    type: prompt_response
    prompt: |
      What is the orphan rule for trait implementations?
    answer: |
      You can implement a trait for a type only if the trait or the type is local to your crate.
    tags:
      - rust-book
      - ch10
      - traits
      - invariant
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch10-traits-004
    type: prompt_response
    prompt: |
      What is the difference between `impl Trait` in a parameter and a named generic type parameter?
    answer: |
      `impl Trait` is concise for short bounds. A named generic is needed when multiple parameters must have the same concrete type or when bounds get complex.
    tags:
      - rust-book
      - ch10
      - traits
      - comparison
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch10-traits-005
    type: prompt_response
    prompt: |
      What is the difference between returning `impl Trait` and returning a trait object?
    answer: |
      `impl Trait` returns one hidden concrete type chosen by the function. A trait object can represent multiple concrete types through dynamic dispatch.
    tags:
      - rust-book
      - ch10
      - traits
      - comparison
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch10-traits-006
    type: prompt_response
    prompt: |
      When is a `where` clause clearer than inline trait bounds?
    answer: |
      Use a `where` clause to keep signatures readable when generic bounds are long or numerous.
    tags:
      - rust-book
