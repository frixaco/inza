  - id: rust-book-ch10-traits-010
    type: prompt_response
    prompt: |
      What syntax requires one parameter type to implement both `Summary` and `Display`?
    answer: |
      ```rust
      use std::fmt::Display;
      
      trait Summary {}
      
      fn notify<T: Summary + Display>(item: &T) {}
      ```
      Use `+` in the bound to require both traits.
    tags:
      - rust-book
      - ch10
      - traits
      - syntax
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-traits-011
    type: prompt_response
    prompt: |
      Why can a function returning `impl Summary` not return either `NewsArticle` or `SocialPost` depending on a condition?
    answer: |
      ```rust
      trait Summary {}
      struct NewsArticle;
      struct SocialPost;
      impl Summary for NewsArticle {}
      impl Summary for SocialPost {}
      
      fn returns_summarizable(switch: bool) -> impl Summary {
          if switch { NewsArticle } else { SocialPost }
      }
      ```
      `impl Trait` in return position hides one concrete return type chosen by the function. Returning different concrete types requires another design, such as a trait object.
    tags:
      - rust-book
      - ch10
      - traits
      - diagnostic
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch10-traits-012
    type: prompt_response
    prompt: |
      Which kind of trait implementation applies to any type satisfying a bound?
    answer: |
      ```rust
      let s = 3.to_string();
      ```
      Blanket implementation applies a trait to any type that satisfies certain trait bounds, such as implementing `ToString` for all types that implement `Display`.
    tags:
      - rust-book
