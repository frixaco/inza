  - id: rust-book-ch10-traits-013
    type: prompt_response
    prompt: |
      What syntax declares a required trait method without a default body?
    answer: |
      ```rust
      trait Summary {
          fn summarize(&self) -> String;
      }
      ```
      The semicolon marks a required method signature with no body.
    tags:
      - rust-book
      - ch10
      - traits
      - syntax
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-traits-014
    type: prompt_response
    prompt: |
      Can a default trait method call another required method in the same trait?
    answer: |
      Yes.
      ```rust
      trait Summary {
          fn summarize_author(&self) -> String;
      
          fn summarize(&self) -> String {
              format!("(Read more from {}...)", self.summarize_author())
          }
      }
      ```
      Implementors can provide only `summarize_author` and inherit `summarize`.
    tags:
      - rust-book
      - ch10
      - traits
      - concept_boundary
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: concept_boundary
      compile_status: compiles
  - id: rust-book-ch10-traits-015
    type: prompt_response
    prompt: |
      How do these parameter forms differ: `fn notify(a: &impl Summary, b: &impl Summary)` and `fn notify<T: Summary>(a: &T, b: &T)`?
    answer: |
      The `impl Summary` form allows `a` and `b` to be different concrete types that both implement `Summary`. The named generic `T` form requires both arguments to have the same concrete type.
    tags:
      - rust-book
      - ch10
      - traits
      - comparison
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch10-traits-016
    type: prompt_response
    prompt: |
      What is the `impl Trait` syntax for a parameter that must implement both `Summary` and `Display`?
    answer: |
      Use `+` inside the `impl Trait` parameter:
      ```rust
      use std::fmt::Display;
      
      trait Summary {
          fn summarize(&self) -> String;
      }
      
      fn notify(item: &(impl Summary + Display)) {
          println!("{}", item.summarize());
          println!("{item}");
      }
      ```
    tags:
      - rust-book
      - ch10
      - traits
      - syntax
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-traits-017
    type: prompt_response
    prompt: |
      What does the same multi-bound trait requirement look like with a `where` clause?
    answer: |
      ```rust
      use std::fmt::{Debug, Display};
      
      fn some_function<T, U>(t: &T, u: &U) -> String
      where
          T: Display + Clone,
          U: Clone + Debug,
      {
          format!("{t} {u:?}")
      }
      ```
      `where` clauses keep long bounds readable.
    tags:
      - rust-book
      - ch10
      - traits
      - syntax
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-traits-018
    type: prompt_response
    prompt: |
      What syntax conditionally implements methods only for generic types with certain trait bounds?
    answer: |
      ```rust
      use std::fmt::Display;
      
      struct Pair<T> {
          x: T,
          y: T,
      }
      
      impl<T: Display + PartialOrd> Pair<T> {
          fn cmp_display(&self) {
              if self.x >= self.y {
                  println!("The largest member is x = {}", self.x);
              } else {
                  println!("The largest member is y = {}", self.y);
              }
          }
      }
      ```
      `cmp_display` exists only for `Pair<T>` where `T: Display + PartialOrd`.
    tags:
      - rust-book
      - ch10
      - traits
      - syntax
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-traits-019
    type: prompt_response
    prompt: |
      Why does Rust have the orphan rule for trait implementations?
    answer: |
      It preserves coherence: no two crates can create conflicting implementations for the same trait and type combination.
    tags:
      - rust-book
      - ch10
      - traits
      - invariant
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch10-traits-020
    type: prompt_response
    prompt: |
      Why do trait bounds make generic code using methods compile?
    answer: |
      A bound tells the compiler that every allowed concrete type has the required behavior. Without the bound, Rust cannot assume a generic `T` has methods or operators such as `summarize`, `clone`, or `>`.
    tags:
      - rust-book
      - ch10
      - traits
      - diagnostic
    provenance:
      source_file: ch10_traits.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Defining Shared Behavior with Traits"
      source: rust-book/src/ch10-02-traits.md
