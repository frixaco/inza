      compile_status: compiles
  - id: rust-book-ch05-defining-structs-004
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      struct User {
          active: bool,
          username: String,
          email: String,
          sign_in_count: u64,
      }
      
      fn main() {
          let user1 = User {
              email: String::from("someone@example.com"),
              username: String::from("someusername123"),
              active: true,
              sign_in_count: 1,
          };
      
          let user2 = User {
              email: String::from("another@example.com"),
              ..user1
          };
      
          println!("{}", user1.username);
      }
      ```
    answer: |
      Struct update syntax moves non-`Copy` fields that are not explicitly replaced; moved fields of `user1` are no longer usable.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - diagnostic
    provenance:
      source_file: ch05_defining_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "Defining and Instantiating Structs"
      source: rust-book/src/ch05-01-defining-structs.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch05-defining-structs-005
    type: prompt_response
    prompt: |
      What is the difference between tuple structs and unit-like structs?
    answer: |
      Tuple structs name the overall type but have unnamed fields. Unit-like structs have no fields and are useful when behavior matters more than stored data.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - comparison
    provenance:
      source_file: ch05_defining_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
