  - id: rust-book-ch05-defining-structs-012
    type: prompt_response
    prompt: |
      How do you destructure a tuple struct value named `origin: Point` into `x`, `y`, and `z`?
    answer: |
      ```rust
      struct Point(i32, i32, i32);
      let origin = Point(0, 0, 0);
      let Point(x, y, z) = origin;
      ```
      Unlike a plain tuple pattern, the tuple struct pattern must name the tuple struct type.
