  - id: rust-book-ch05-defining-structs-011
    type: prompt_response
    prompt: |
      Why can't a function expecting `Color` accept a `Point` even if both are tuple structs with three `i32` fields?
    answer: |
      Each tuple struct definition creates a distinct type. Having the same field types does not make `Color` and `Point` interchangeable.
    tags:
