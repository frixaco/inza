  - id: rust-book-ch05-defining-structs-008
    type: prompt_response
    prompt: |
      After struct update syntax moves `user1.username` into `user2`, why can `user1.email` still be used when `email` was explicitly replaced?
    answer: |
      Struct update moves only the fields it takes from the source instance. If `email` is explicitly set in `user2`, `user1.email` was not moved by the update.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - concept_boundary
    provenance:
