  - id: rust-book-ch05-defining-structs-010
    type: prompt_response
    prompt: |
      What is the syntax for defining two tuple structs named `Color` and `Point` with three `i32` fields?
    answer: |
      ```rust
      struct Color(i32, i32, i32);
      struct Point(i32, i32, i32);
      ```
      Tuple structs name the overall type but do not name the individual fields.
    tags:
