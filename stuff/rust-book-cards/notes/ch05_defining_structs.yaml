      source: rust-book/src/ch05-01-defining-structs.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch05-defining-structs-006
    type: prompt_response
    prompt: |
      What is the struct update syntax for creating `user2` from `user1` while overriding only `email`?
    answer: |
      ```rust
      struct User {
          active: bool,
          username: String,
          email: String,
          sign_in_count: u64,
      }
      
      let user1 = User {
          active: true,
          username: String::from("someusername123"),
          email: String::from("someone@example.com"),
          sign_in_count: 1,
      };
      
      let user2 = User {
          email: String::from("another@example.com"),
          ..user1
      };
      ```
      The `..user1` part fills every remaining field from `user1`.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - syntax
    provenance:
      source_file: ch05_defining_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "Defining and Instantiating Structs"
      source: rust-book/src/ch05-01-defining-structs.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch05-defining-structs-007
    type: prompt_response
    prompt: |
      Where must `..user1` appear in struct update syntax?
    answer: |
      `..user1` must come last, after any fields explicitly set in the new struct literal.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - syntax
    provenance:
