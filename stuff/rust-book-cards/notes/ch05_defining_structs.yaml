      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch05-defining-structs-002
    type: prompt_response
    prompt: |
      Why must the whole struct instance be mutable to mutate a field?
    answer: |
      Rust does not allow marking only individual fields mutable in an instance. Mutability belongs to the binding, not to selected fields.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - concept_boundary
