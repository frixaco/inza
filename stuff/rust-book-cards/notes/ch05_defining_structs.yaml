  - id: rust-book-ch05-defining-structs-013
    type: prompt_response
    prompt: |
      What is the syntax for defining and instantiating a unit-like struct named `AlwaysEqual`?
    answer: |
      ```rust
      struct AlwaysEqual;
      
      fn main() {
          let subject = AlwaysEqual;
      }
      ```
      Unit-like structs have no fields, so they use neither braces nor parentheses.
