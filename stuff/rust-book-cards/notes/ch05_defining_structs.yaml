  - id: rust-book-ch05-defining-structs-001
    type: prompt_response
    prompt: |
      What is the basic syntax for defining and instantiating a struct?
    answer: |
      ```rust
      struct User {
          active: bool,
          username: String,
      }
      
      let user = User { active: true, username: String::from("alice") };
      ```
    tags:
      - rust-book
