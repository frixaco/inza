  - id: rust-book-ch05-defining-structs-015
    type: prompt_response
    prompt: |
      What does field init shorthand look like in a full `build_user` function?
    answer: |
      ```rust
      struct User {
          active: bool,
          username: String,
          email: String,
          sign_in_count: u64,
      }
      
      fn build_user(email: String, username: String) -> User {
          User {
              active: true,
              username,
              email,
              sign_in_count: 1,
          }
      }
      ```
      `username` and `email` use shorthand because local variables with those names exist.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - syntax
    provenance:
      source_file: ch05_defining_structs.yaml
      chapter: "Chapter 5: Using Structs to Structure Related Data"
      section: "Defining and Instantiating Structs"
      source: rust-book/src/ch05-01-defining-structs.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch05-defining-structs-016
    type: prompt_response
    prompt: |
      How do you access an individual field of a tuple struct by index?
    answer: |
      ```rust
      struct Color(i32, i32, i32);
      
      fn main() {
          let black = Color(0, 0, 0);
          let red = black.0;
          println!("{red}");
      }
      ```
      Tuple struct fields use dot plus numeric index, like tuple fields.
    tags:
      - rust-book
      - ch05
      - defining-structs
      - syntax
    provenance:
