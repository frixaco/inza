  - id: rust-book-ch20-advanced-functions-closures-002
    type: prompt_response
    prompt: |
      How do function pointers differ from closures?
    answer: |
      Function pointers can point to functions and implement all three closure traits, but they cannot capture environment values.
    tags:
      - rust-book
      - ch20
      - advanced-functions-closures
      - comparison
    provenance:
      source_file: ch20_advanced_functions_closures.yaml
      chapter: "Chapter 20: Advanced Features"
