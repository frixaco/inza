      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch20-advanced-functions-closures-004
    type: prompt_response
    prompt: |
      Why can enum variant constructors be passed to iterator adapters like functions?
    answer: |
      Tuple struct and enum variant constructors are function-like values, so they can be used as mapping functions.
    tags:
      - rust-book
      - ch20
