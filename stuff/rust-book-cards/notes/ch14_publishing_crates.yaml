  - id: rust-book-ch14-publishing-crates-013
    type: prompt_response
    prompt: |
      What does `cargo yank --vers 1.0.1` do?
    answer: |
      It prevents new projects from depending on version `1.0.1`, but existing projects with a lockfile can still use it.
    tags:
      - rust-book
      - ch14
      - publishing-crates
      - api_recall
    provenance:
