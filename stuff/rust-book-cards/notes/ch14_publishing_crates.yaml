  - id: rust-book-ch14-publishing-crates-005
    type: prompt_response
    prompt: |
      Why should a published crate version not be casually deleted or changed?
    answer: |
      Other packages may depend on it. SemVer and yanking are used to manage compatibility without breaking the ecosystem.
    tags:
