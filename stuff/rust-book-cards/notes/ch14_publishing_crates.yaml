  - id: rust-book-ch14-publishing-crates-002
    type: prompt_response
    prompt: |
      What comment style documents the item that follows it?
    answer: |
      ```rust
      /// Adds one to the number given.
      pub fn add_one(x: i32) -> i32 {
          x + 1
      }
      ```
      `///` documentation comments go before the item they document.
    tags:
      - rust-book
      - ch14
      - publishing-crates
      - syntax
    provenance:
