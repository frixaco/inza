  - id: rust-book-ch14-publishing-crates-007
    type: prompt_response
    prompt: |
      When should documentation include `Panics`, `Errors`, or `Safety` sections?
    answer: |
      ```rust
      /// Divides two numbers.
      ///
      /// # Panics
      ///
      /// Panics if `rhs` is zero.
      pub fn divide(lhs: i32, rhs: i32) -> i32 {
          lhs / rhs
      }
      ```
      Use `Panics` for panic conditions, `Errors` for `Result` failure cases, and `Safety` for unsafe functions whose callers must uphold invariants.
    tags:
      - rust-book
      - ch14
      - publishing-crates
      - concept_boundary
    provenance:
      source_file: ch14_publishing_crates.yaml
      chapter: "Chapter 14: More about Cargo and Crates.io"
      section: "Publishing a Crate to Crates.io"
      source: rust-book/src/ch14-02-publishing-to-crates-io.md
      card_type: concept_boundary
      compile_status: compiles
