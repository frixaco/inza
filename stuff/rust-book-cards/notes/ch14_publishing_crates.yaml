  - id: rust-book-ch14-publishing-crates-003
    type: prompt_response
    prompt: |
      What comment style documents the enclosing item, such as a crate or module?
    answer: |
      ```rust
      //! # My Crate
      //!
      //! Documentation for the enclosing crate or module.
      ```
      `//!` inner documentation comments document the item that contains them.
    tags:
      - rust-book
      - ch14
      - publishing-crates
      - syntax
    provenance:
