  - id: rust-book-ch14-publishing-crates-011
    type: prompt_response
    prompt: |
      Which metadata fields does the book call out as required before publishing to crates.io?
    answer: |
      ```toml
      [package]
      description = "A short explanation of the crate"
      license = "MIT OR Apache-2.0"
      ```
      `description` and either `license` or `license-file` are required so users know what the crate does and under what terms they can use it.
    tags:
      - rust-book
