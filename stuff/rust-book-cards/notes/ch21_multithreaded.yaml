  - id: rust-book-ch21-multithreaded-008
    type: prompt_response
    prompt: |
      Why does `ThreadPool::execute` use an `FnOnce` bound?
    answer: |
      Each job closure is run exactly one time by a worker. `FnOnce` is the most general closure trait that supports one-time execution, including closures that move captured values.
    tags:
