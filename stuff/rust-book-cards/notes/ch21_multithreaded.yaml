  - id: rust-book-ch21-multithreaded-009
    type: prompt_response
    prompt: |
      Why must jobs sent to worker threads be `Send + 'static`?
    answer: |
      `Send` allows the closure to cross thread boundaries. `'static` ensures the closure does not borrow data that might be gone before the worker runs it.
