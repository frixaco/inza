  - id: rust-book-ch21-multithreaded-013
    type: prompt_response
    prompt: |
      What is the essential `ThreadPool::execute` signature and job boxing shape?
    answer: |
      ```rust
      use std::sync::mpsc;
      
      type Job = Box<dyn FnOnce() + Send + 'static>;
      
      pub struct ThreadPool {
          sender: mpsc::Sender<Job>,
      }
      
      impl ThreadPool {
          pub fn execute<F>(&self, f: F)
          where
              F: FnOnce() + Send + 'static,
          {
              let job = Box::new(f);
              self.sender.send(job).unwrap();
          }
      }
      ```
      The generic closure is boxed into the single `Job` type sent to workers.
    tags:
      - rust-book
      - ch21
      - multithreaded
      - syntax
    provenance:
      source_file: ch21_multithreaded.yaml
      chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
      section: "From Single-Threaded to Multithreaded Server"
      source: rust-book/src/ch21-02-multithreaded.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch21-multithreaded-014
    type: prompt_response
    prompt: |
      What does sharing the job receiver across workers look like?
    answer: |
      ```rust
      use std::sync::{mpsc, Arc, Mutex};
      
      type Job = Box<dyn FnOnce() + Send + 'static>;
      
      fn main() {
          let (_sender, receiver) = mpsc::channel::<Job>();
          let receiver = Arc::new(Mutex::new(receiver));
          let worker_receiver = Arc::clone(&receiver);
      }
      ```
      `Arc` gives shared ownership; `Mutex` serializes access to `recv`.
    tags:
      - rust-book
      - ch21
      - multithreaded
      - syntax
    provenance:
      source_file: ch21_multithreaded.yaml
      chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
      section: "From Single-Threaded to Multithreaded Server"
      source: rust-book/src/ch21-02-multithreaded.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch21-multithreaded-015
    type: prompt_response
    prompt: |
      Why does the book avoid `while let Ok(job) = receiver.lock().unwrap().recv()` in the worker loop?
    answer: |
      In that form, the temporary `MutexGuard` can live for the entire `while let` body, including while `job()` runs. That would prevent other workers from receiving jobs concurrently.
    tags:
      - rust-book
      - ch21
      - multithreaded
      - concept_boundary
    provenance:
      source_file: ch21_multithreaded.yaml
      chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
      section: "From Single-Threaded to Multithreaded Server"
      source: rust-book/src/ch21-02-multithreaded.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch21-multithreaded-016
    type: prompt_response
    prompt: |
      What worker receive-and-run loop shape releases the mutex before executing the job?
    answer: |
      ```rust
      use std::sync::{mpsc, Arc, Mutex};
      
      type Job = Box<dyn FnOnce() + Send + 'static>;
      
      fn worker_loop(receiver: Arc<Mutex<mpsc::Receiver<Job>>>) {
          loop {
              let job = receiver.lock().unwrap().recv().unwrap();
              job();
          }
      }
      ```
      The `MutexGuard` temporary is dropped at the end of the `let` statement, before `job()` runs.
    tags:
      - rust-book
      - ch21
      - multithreaded
      - syntax
