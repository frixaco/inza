  - id: rust-book-ch21-multithreaded-007
    type: prompt_response
    prompt: |
      What happens when `/sleep` is requested on the single-threaded server before another request?
    answer: |
      The handler sleeps before responding, and a single-threaded server cannot process later connections until the slow request finishes.
