  - id: rust-book-ch21-multithreaded-011
    type: prompt_response
    prompt: |
      Why does the final pool send jobs over a channel instead of assigning work to a specific worker directly?
    answer: |
      A shared receiver lets idle workers pull the next available job. The pool only needs to enqueue work; workers coordinate through the channel and mutex.
