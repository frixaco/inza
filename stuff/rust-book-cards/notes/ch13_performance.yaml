      source: rust-book/src/ch13-04-performance.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch13-performance-002
    type: prompt_response
    prompt: |
      What did the book's benchmark comparison show about loops and iterators?
    answer: |
      The iterator version can be as fast as or faster than an explicit loop after optimization, so clarity need not cost performance.
    tags:
      - rust-book
      - ch13
      - performance
      - comparison
    provenance:
      source_file: ch13_performance.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
      section: "Performance in Loops vs. Iterators"
      source: rust-book/src/ch13-04-performance.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch13-performance-003
    type: prompt_response
    prompt: |
      Should you avoid iterators in Rust because they are high-level?
    answer: |
      No. Iterators are idiomatic and designed to compile efficiently; choose the clearest correct code and measure when performance matters.
    tags:
      - rust-book
      - ch13
      - performance
      - misconception
