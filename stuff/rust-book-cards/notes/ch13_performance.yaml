notes:
  - id: rust-book-ch13-performance-001
    type: prompt_response
    prompt: |
      What does zero-cost abstraction mean in the iterator chapter?
    answer: |
      High-level abstractions compile to code comparable to hand-written lower-level code without extra runtime overhead in the common case.
    tags:
      - rust-book
      - ch13
      - performance
      - definition
    provenance:
      source_file: ch13_performance.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
