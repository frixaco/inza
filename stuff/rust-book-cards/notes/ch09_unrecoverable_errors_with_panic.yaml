notes:
  - id: rust-book-ch09-unrecoverable-errors-with-panic-001
    type: prompt_response
    prompt: |
      What runtime behavior does `panic!` trigger by default?
    answer: |
      It prints an error message, unwinds and cleans up the stack by default, and exits the program. A profile can instead abort immediately.
    tags:
      - rust-book
      - ch09
      - unrecoverable-errors-with-panic
      - definition
    provenance:
      source_file: ch09_unrecoverable_errors_with_panic.yaml
