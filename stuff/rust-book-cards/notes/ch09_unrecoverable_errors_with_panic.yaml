      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch09-unrecoverable-errors-with-panic-002
    type: prompt_response
    prompt: |
      What is the difference between unwinding and aborting on panic?
    answer: |
      Unwinding walks back up the stack and runs cleanup. Aborting ends the process without that cleanup and can produce a smaller binary.
    tags:
      - rust-book
      - ch09
      - unrecoverable-errors-with-panic
      - comparison
    provenance:
      source_file: ch09_unrecoverable_errors_with_panic.yaml
