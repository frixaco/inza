      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch09-unrecoverable-errors-with-panic-003
    type: prompt_response
    prompt: |
      What happens when code indexes outside a vector, such as `v[99]` for a three-element vector?
    answer: |
      The program panics at runtime because bounds checking detects an invalid index.
    tags:
      - rust-book
      - ch09
      - unrecoverable-errors-with-panic
      - prediction
    provenance:
      source_file: ch09_unrecoverable_errors_with_panic.yaml
