  - id: rust-book-ch09-unrecoverable-errors-with-panic-004
    type: prompt_response
    prompt: |
      Which environment variable enables a backtrace for a panic?
    answer: |
      `RUST_BACKTRACE=1`.
    tags:
      - rust-book
