  - id: rust-book-ch12-test-driven-development-005
    type: prompt_response
    prompt: |
      What lifetime shape does the book use for `search` returning borrowed lines?
    answer: |
      ```rust
      pub fn search<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
          let mut results = Vec::new();
      
          for line in contents.lines() {
              if line.contains(query) {
                  results.push(line);
              }
          }
      
          results
      }
      ```
      The returned line slices are tied to `contents`, not to `query`.
    tags:
      - rust-book
