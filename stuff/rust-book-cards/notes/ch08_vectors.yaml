  - id: rust-book-ch08-vectors-003
    type: prompt_response
    prompt: |
      What is the difference between `&v[2]` and `v.get(2)`?
    answer: |
      Indexing returns a reference or panics if out of bounds. `get` returns `Option<&T>` so the missing case can be handled explicitly.
    tags:
      - rust-book
      - ch08
      - vectors
      - comparison
    provenance:
      source_file: ch08_vectors.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing Lists of Values with Vectors"
      source: rust-book/src/ch08-01-vectors.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch08-vectors-004
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn main() {
          let mut v = vec![1, 2, 3, 4, 5];
          let first = &v[0];
          v.push(6);
          println!("The first element is: {first}");
      }
      ```
    answer: |
      `first` is an immutable borrow into the vector. `push` needs a mutable borrow and may reallocate, which could invalidate the reference.
    tags:
      - rust-book
      - ch08
      - vectors
      - diagnostic
    provenance:
      source_file: ch08_vectors.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing Lists of Values with Vectors"
      source: rust-book/src/ch08-01-vectors.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch08-vectors-005
    type: prompt_response
    prompt: |
      How can a vector store values of different concrete types?
    answer: |
      Wrap the alternatives in an enum if the set is known. Use trait objects when values share behavior but concrete types may vary.
    tags:
      - rust-book
