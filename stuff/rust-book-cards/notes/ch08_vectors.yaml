  - id: rust-book-ch08-vectors-012
    type: prompt_response
    prompt: |
      How do you handle a vector lookup with `get`?
    answer: |
      ```rust
      fn main() {
          let v = vec![1, 2, 3, 4, 5];
          match v.get(2) {
              Some(third) => println!("The third element is {third}"),
              None => println!("There is no third element."),
          }
      }
      ```
      `get` returns `Option<&T>`.
    tags:
      - rust-book
      - ch08
      - vectors
      - syntax
    provenance:
