  - id: rust-book-ch08-vectors-013
    type: prompt_response
    prompt: |
      What happens when indexing a vector out of bounds with `v[100]`?
    answer: |
      The program panics at runtime.
      ```rust
      fn main() {
          let v = vec![1, 2, 3, 4, 5];
          let _does_not_exist = &v[100];
      }
      ```
    tags:
