  - id: rust-book-ch08-vectors-002
    type: prompt_response
    prompt: |
      What macro creates a vector with initial values?
    answer: |
      ```rust
      let v = vec![1, 2, 3];
      ```
      This creates a `Vec<i32>` inferred from the elements.
