  - id: rust-book-ch08-vectors-006
    type: prompt_response
    prompt: |
      What memory layout property does the book emphasize for `Vec<T>`?
    answer: |
      A vector stores its elements next to each other in memory and can grow on the heap.
    tags:
      - rust-book
