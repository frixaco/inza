  - id: rust-book-ch08-vectors-011
    type: prompt_response
    prompt: |
      What syntax creates a mutable vector and pushes values into it?
    answer: |
      ```rust
      fn main() {
          let mut v = Vec::new();
          v.push(5);
          v.push(6);
          v.push(7);
          v.push(8);
      }
      ```
      The vector must be mutable to call `push`.
    tags:
