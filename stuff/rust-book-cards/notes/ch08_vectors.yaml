  - id: rust-book-ch08-vectors-001
    type: prompt_response
    prompt: |
      What syntax creates an empty vector of `i32` values?
    answer: |
      ```rust
      let v: Vec<i32> = Vec::new();
      ```
      The type annotation is needed because there are no elements to infer from.
    tags:
      - rust-book
      - ch08
