notes:
  - id: rust-book-ch12-stderr-001
    type: prompt_response
    prompt: |
      Why should errors go to stderr instead of stdout in a CLI program?
    answer: |
      Stdout is for successful program output that users may redirect to files or pipes. Stderr keeps diagnostics separate.
    tags:
      - rust-book
      - ch12
      - stderr
      - comparison
    provenance:
      source_file: ch12_stderr.yaml
      chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
      section: "Redirecting Errors to Standard Error"
      source: rust-book/src/ch12-06-writing-to-stderr-instead-of-stdout.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch12-stderr-002
    type: prompt_response
    prompt: |
      Which macro sends diagnostic output to standard error?
    answer: |
      ```rust
      eprintln!("Problem parsing arguments");
      ```
      `eprintln!`.
    tags:
      - rust-book
      - ch12
