  - id: rust-book-ch12-stderr-003
    type: prompt_response
    prompt: |
      What does the terminal still show after stdout is redirected and errors use `eprintln!`?
    answer: |
      The shell redirects stdout only. Stderr remains connected to the terminal unless redirected separately.
