  - id: rust-book-ch01-getting-started-002
    type: prompt_response
    prompt: |
      What is the practical boundary between `rustc` and Cargo for beginners?
    answer: |
      Use `rustc` to compile a single file directly. Use Cargo for real projects because it manages packages, builds, dependencies, and common commands.
