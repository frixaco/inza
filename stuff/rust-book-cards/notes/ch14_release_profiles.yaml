notes:
  - id: rust-book-ch14-release-profiles-001
    type: prompt_response
    prompt: |
      What build settings does a Cargo release profile collect?
    answer: |
      A named set of compiler settings that controls how Cargo builds code, such as `dev` and `release`.
    tags:
      - rust-book
      - ch14
      - release-profiles
      - definition
    provenance:
      source_file: ch14_release_profiles.yaml
      chapter: "Chapter 14: More about Cargo and Crates.io"
      section: "Customizing Builds with Release Profiles"
      source: rust-book/src/ch14-01-release-profiles.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch14-release-profiles-002
    type: prompt_response
    prompt: |
      What is the default optimization tradeoff between `dev` and `release` profiles?
    answer: |
      `dev` favors fast compilation with little optimization. `release` favors optimized runtime performance with slower compilation.
    tags:
      - rust-book
      - ch14
      - release-profiles
      - comparison
    provenance:
      source_file: ch14_release_profiles.yaml
      chapter: "Chapter 14: More about Cargo and Crates.io"
      section: "Customizing Builds with Release Profiles"
      source: rust-book/src/ch14-01-release-profiles.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch14-release-profiles-003
    type: prompt_response
    prompt: |
      How do you override the optimization level for the release profile?
    answer: |
      ```toml
      [profile.release]
      opt-level = 3
      ```
    tags:
      - rust-book
      - ch14
      - release-profiles
      - syntax
    provenance:
