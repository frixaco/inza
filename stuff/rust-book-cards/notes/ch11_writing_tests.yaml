  - id: rust-book-ch11-writing-tests-008
    type: prompt_response
    prompt: |
      Why is `use super::*;` common inside a unit test module?
    answer: |
      The test module is a child module, so `use super::*;` brings items from the parent module into scope for testing.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - concept_boundary
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch11-writing-tests-009
    type: prompt_response
    prompt: |
      How do you add a custom failure message to an assertion macro?
    answer: |
      ```rust
      let value = "Carol";
      assert!(
          value.contains("Carol"),
          "Greeting did not contain name, value was `{value}`"
      );
      ```
      Pass format-string arguments after the required assertion arguments, such as `assert!(condition, "expected valid value: {value}")`.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - api_recall
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: api_recall
      compile_status: compiles
  - id: rust-book-ch11-writing-tests-010
    type: prompt_response
    prompt: |
      Why can `#[should_panic(expected = "...")]` be better than plain `#[should_panic]`?
    answer: |
      It checks that the panic message contains expected text, reducing the chance that the test passes because of the wrong panic.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - concept_boundary
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch11-writing-tests-011
    type: prompt_response
    prompt: |
      Why does `assert_eq!` usually give better failure output than `assert!(left == right)`?
    answer: |
      `assert_eq!` prints both the left and right values on failure, making the mismatch easier to diagnose.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - comparison
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch11-writing-tests-012
    type: prompt_response
    prompt: |
      What trait support do values need for `assert_eq!` and `assert_ne!` to print useful failures?
    answer: |
      The values must implement `PartialEq` for comparison and `Debug` for printing. Most standard types implement both.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - invariant
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch11-writing-tests-013
    type: prompt_response
    prompt: |
      Why should a `#[should_panic]` test use `expected = "..."` when possible?
    answer: |
      Without `expected`, any panic makes the test pass, including a panic from the wrong bug. Matching part of the message makes the expected failure more specific.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - diagnostic
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch11-writing-tests-014
    type: prompt_response
    prompt: |
      Can a test that returns `Result<(), E>` use `#[should_panic]`?
    answer: |
      No. For `Result`-returning tests, return an `Err` value to fail the test instead of using `#[should_panic]`.
    tags:
      - rust-book
      - ch11
