notes:
  - id: rust-book-ch11-writing-tests-001
    type: prompt_response
    prompt: |
      What attribute marks a Rust test function?
    answer: |
      ```rust
      #[test]
      fn exploration() {
          assert_eq!(2 + 2, 4);
      }
      ```
      `#[test]` placed above a function.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - syntax
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch11-writing-tests-002
    type: prompt_response
    prompt: |
      Which macro checks that a Boolean condition is true in a test?
    answer: |
      ```rust
      #[test]
      fn larger_can_hold_smaller() {
          assert!(8 > 5);
      }
      ```
      `assert!(condition)`. It panics if the condition is false.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - concept_boundary
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: concept_boundary
      compile_status: compiles
  - id: rust-book-ch11-writing-tests-003
    type: prompt_response
    prompt: |
      What is the difference between `assert_eq!` and `assert_ne!`?
    answer: |
      ```rust
      assert_eq!(2 + 2, 4);
      assert_ne!(2 + 2, 5);
      ```
      `assert_eq!` requires two values to be equal; `assert_ne!` requires them to be different. Both print the compared values on failure when possible.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - comparison
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: comparison
      compile_status: compiles
  - id: rust-book-ch11-writing-tests-004
    type: prompt_response
    prompt: |
      How do you test that code should panic?
    answer: |
      ```rust
      #[test]
      #[should_panic(expected = "less than or equal to 100")]
      fn greater_than_100() {
          panic!("Guess value must be less than or equal to 100, got 200");
      }
      ```
      Add `#[should_panic]` above the test, optionally with `expected = "..."` to require part of the panic message.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - syntax
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch11-writing-tests-005
    type: prompt_response
    prompt: |
      When should a test return `Result<(), E>` instead of using `unwrap`?
    answer: |
      ```rust
      #[test]
      fn it_works() -> Result<(), String> {
          if 2 + 2 == 4 { Ok(()) } else { Err(String::from("bad math")) }
      }
      ```
      When using `?` makes setup or checks clearer. Return `Ok(())` for success and an error for failure.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - concept_boundary
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: concept_boundary
      compile_status: compiles
  - id: rust-book-ch11-writing-tests-006
    type: prompt_response
    prompt: |
      What three actions do Rust test bodies typically perform?
    answer: |
      Set up data or state, run the code under test, and assert that the result is expected.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - definition
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
      section: "How to Write Tests"
      source: rust-book/src/ch11-01-writing-tests.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch11-writing-tests-007
    type: prompt_response
    prompt: |
      What runtime event makes a Rust test fail?
    answer: |
      A test fails when its test function panics.
    tags:
      - rust-book
      - ch11
      - writing-tests
      - definition
    provenance:
      source_file: ch11_writing_tests.yaml
      chapter: "Chapter 11: Writing Automated Tests"
