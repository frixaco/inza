      compile_status: compiles
  - id: rust-book-ch03-data-types-004
    type: prompt_response
    prompt: |
      Why can indexing an array with a runtime out-of-bounds value panic?
    answer: |
      Rust checks array bounds at runtime when the index is not known to be valid. An out-of-bounds access panics instead of allowing invalid memory access.
    tags:
      - rust-book
      - ch03
      - data-types
      - diagnostic
    provenance:
      source_file: ch03_data_types.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: "Data Types"
      source: rust-book/src/ch03-02-data-types.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch03-data-types-005
    type: prompt_response
    prompt: |
      What is the practical boundary between an array and a tuple?
    answer: |
      An array has a fixed length and all elements have the same type. A tuple has fixed length too, but its fields may have different types.
    tags:
      - rust-book
      - ch03
      - data-types
      - comparison
    provenance:
      source_file: ch03_data_types.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: "Data Types"
      source: rust-book/src/ch03-02-data-types.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch03-data-types-006
    type: prompt_response
    prompt: |
      What does Rust mean by being statically typed?
    answer: |
      Rust must know the type of every variable at compile time. The compiler can often infer the type, but sometimes needs an annotation.
    tags:
      - rust-book
      - ch03
      - data-types
      - definition
    provenance:
      source_file: ch03_data_types.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: "Data Types"
      source: rust-book/src/ch03-02-data-types.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch03-data-types-007
    type: prompt_response
    prompt: |
      What is the difference between signed and unsigned integer types in Rust?
    answer: |
      Signed integer types, such as `i32`, can represent negative and positive values. Unsigned types, such as `u32`, represent only nonnegative values.
    tags:
      - rust-book
      - ch03
      - data-types
      - comparison
    provenance:
      source_file: ch03_data_types.yaml
      chapter: "Chapter 3: Common Programming Concepts"
      section: "Data Types"
      source: rust-book/src/ch03-02-data-types.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch03-data-types-008
    type: prompt_response
    prompt: |
      What integer type does Rust default to when several integer types are possible?
    answer: |
      `i32`.
    tags:
      - rust-book
      - ch03
      - data-types
      - api_recall
    provenance:
      source_file: ch03_data_types.yaml
      chapter: "Chapter 3: Common Programming Concepts"
