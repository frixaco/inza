      compile_status: compiles
  - id: rust-book-ch03-data-types-019
    type: prompt_response
    prompt: |
      What is the explicit type annotation for an array of five `i32` values?
    answer: |
      ```rust
      let a: [i32; 5] = [1, 2, 3, 4, 5];
      ```
    tags:
      - rust-book
