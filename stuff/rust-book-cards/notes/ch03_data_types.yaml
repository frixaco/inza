  - id: rust-book-ch03-data-types-014
    type: prompt_response
    prompt: |
      How do you destructure a three-element tuple into `x`, `y`, and `z`?
    answer: |
      ```rust
      let tup = (500, 6.4, 1);
      let (x, y, z) = tup;
      ```
