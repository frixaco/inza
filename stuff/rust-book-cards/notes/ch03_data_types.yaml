  - id: rust-book-ch03-data-types-018
    type: prompt_response
    prompt: |
      How do you access tuple fields by index?
    answer: |
      ```rust
      let tup = (500, 6.4, 1);
      let five_hundred = tup.0;
      let six_point_four = tup.1;
      let one = tup.2;
      ```
      Tuple field indexes are zero-based.
    tags:
      - rust-book
      - ch03
      - data-types
      - syntax
    provenance:
      source_file: ch03_data_types.yaml
