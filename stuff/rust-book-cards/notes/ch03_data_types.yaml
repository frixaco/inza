  - id: rust-book-ch03-data-types-010
    type: prompt_response
    prompt: |
      What do these integer literal forms mean: `0xff`, `0o77`, `0b1111_0000`, and `b'A'`?
    answer: |
      They are hexadecimal, octal, binary, and a `u8` byte literal respectively. Underscores can be used as visual separators.
    tags:
      - rust-book
      - ch03
      - data-types
      - syntax
    provenance:
      source_file: ch03_data_types.yaml
      chapter: "Chapter 3: Common Programming Concepts"
