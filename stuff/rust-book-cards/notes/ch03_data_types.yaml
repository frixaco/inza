  - id: rust-book-ch03-data-types-002
    type: prompt_response
    prompt: |
      When should you annotate a numeric type in Rust?
    answer: |
      Annotate when inference cannot choose a unique type or when a specific width/signedness matters, such as parsing a string into `u32`.
    tags:
      - rust-book
      - ch03
      - data-types
      - concept_boundary
    provenance:
