  - id: rust-book-ch03-data-types-020
    type: prompt_response
    prompt: |
      When is an array more appropriate than a vector in the book's introduction?
    answer: |
      Use an array when you want a fixed number of elements known at compile time, such as month names. Use a vector when the collection size should grow or shrink.
    tags:
      - rust-book
