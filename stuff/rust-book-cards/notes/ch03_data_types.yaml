  - id: rust-book-ch03-data-types-001
    type: prompt_response
    prompt: |
      Which four scalar type categories does Rust have?
    answer: |
      Integers, floating-point numbers, Booleans, and characters.
    tags:
      - rust-book
      - ch03
      - data-types
      - definition
    provenance:
