  - id: rust-book-ch03-data-types-016
    type: prompt_response
    prompt: |
      What syntax creates an array of five `3` values?
    answer: |
      ```rust
      let a = [3; 5];
      ```
      This creates the same array as `let a = [3, 3, 3, 3, 3];`.
