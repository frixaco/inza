  - id: rust-book-ch17-async-await-002
    type: prompt_response
    prompt: |
      What is the broad boundary between concurrency and parallelism?
    answer: |
      Concurrency is structuring work so tasks can make progress in overlapping time. Parallelism is executing work at the same instant on multiple cores.
