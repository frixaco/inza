  - id: rust-book-ch12-environment-variables-005
    type: prompt_response
    prompt: |
      What happens if `IGNORE_CASE` is set to any value in the book's implementation?
    answer: |
      Case-insensitive search is enabled. The program checks whether `env::var("IGNORE_CASE")` returns `Ok`, so any set value turns the flag on.
