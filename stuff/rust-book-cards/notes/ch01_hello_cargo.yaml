  - id: rust-book-ch01-hello-cargo-001
    type: prompt_response
    prompt: |
      Which Cargo command creates a new binary package named `hello_cargo`?
    answer: |
      `cargo new hello_cargo`.
    tags:
      - rust-book
      - ch01
