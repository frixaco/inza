      compile_status: non_rust
  - id: rust-book-ch01-hello-cargo-007
    type: prompt_response
    prompt: |
      Where does Cargo expect Rust source files to live in a package?
    answer: |
      Cargo expects source files under `src/`. The top-level directory is for files such as `Cargo.toml`, README files, licenses, and other project metadata.
    tags:
      - rust-book
      - ch01
      - hello-cargo
