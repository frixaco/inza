  - id: rust-book-ch01-hello-cargo-009
    type: prompt_response
    prompt: |
      What problem does `Cargo.lock` solve for a Cargo project?
    answer: |
      `Cargo.lock` records the exact dependency versions Cargo selected, so future builds reuse the same versions until you update them.
    tags:
