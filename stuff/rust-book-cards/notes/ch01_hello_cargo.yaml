      source: rust-book/src/ch01-03-hello-cargo.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch01-hello-cargo-006
    type: prompt_response
    prompt: |
      What does `Cargo.toml` configure in a new Cargo package?
    answer: |
      `Cargo.toml` configures package metadata such as the package name, version, edition, and dependency list.
    tags:
      - rust-book
      - ch01
      - hello-cargo
      - definition
    provenance:
