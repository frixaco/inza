  - id: rust-book-ch01-hello-cargo-002
    type: prompt_response
    prompt: |
      What does `cargo check` do that makes it faster than `cargo build`?
    answer: |
      `cargo check` verifies the code compiles but does not produce an executable, so it is usually faster during development.
    tags:
      - rust-book
      - ch01
      - hello-cargo
      - comparison
    provenance:
      source_file: ch01_hello_cargo.yaml
      chapter: "Chapter 1: Getting Started"
