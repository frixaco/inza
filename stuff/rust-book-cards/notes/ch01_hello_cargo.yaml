      source: rust-book/src/ch01-03-hello-cargo.md
      card_type: comparison
      compile_status: non_rust
  - id: rust-book-ch01-hello-cargo-003
    type: prompt_response
    prompt: |
      What is the difference between `cargo build` and `cargo run`?
    answer: |
      `cargo build` compiles the package. `cargo run` compiles if needed and then runs the resulting executable.
    tags:
      - rust-book
      - ch01
      - hello-cargo
      - comparison
    provenance:
      source_file: ch01_hello_cargo.yaml
      chapter: "Chapter 1: Getting Started"
      section: "Hello, Cargo!"
      source: rust-book/src/ch01-03-hello-cargo.md
      card_type: comparison
      compile_status: non_rust
  - id: rust-book-ch01-hello-cargo-004
    type: prompt_response
    prompt: |
      When would you use `cargo build --release` instead of `cargo build`?
    answer: |
      Use `--release` when you want optimized code for distribution or benchmarking; it takes longer to compile and writes to `target/release`.
    tags:
      - rust-book
      - ch01
      - hello-cargo
      - concept_boundary
    provenance:
