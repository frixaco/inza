  - id: rust-book-ch13-improving-io-project-003
    type: prompt_response
    prompt: |
      How does the iterator-based `search` implementation replace a manual loop?
    answer: |
      ```rust
      pub fn search<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
          contents
              .lines()
              .filter(|line| line.contains(query))
              .collect()
      }
      ```
      It filters the line iterator and collects the matching borrowed lines.
