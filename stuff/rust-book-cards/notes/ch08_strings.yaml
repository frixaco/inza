  - id: rust-book-ch08-strings-007
    type: prompt_response
    prompt: |
      What is the relationship between `String` and `Vec<u8>`?
    answer: |
      `String` is implemented as a wrapper around a vector of bytes, with UTF-8 guarantees and string-specific methods.
