notes:
  - id: rust-book-ch08-strings-001
    type: prompt_response
    prompt: |
      What is the practical boundary between `String` and `&str`?
    answer: |
      `String` owns growable UTF-8 text. `&str` borrows UTF-8 text and is often the right parameter type when ownership is not needed.
    tags:
      - rust-book
      - ch08
      - strings
      - comparison
    provenance:
      source_file: ch08_strings.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing UTF-8 Encoded Text with Strings"
      source: rust-book/src/ch08-02-strings.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch08-strings-002
    type: prompt_response
    prompt: |
      Which methods append text to a `String` without taking ownership of the whole string?
    answer: |
      `push_str(&str)` appends a string slice; `push(char)` appends one character.
    tags:
      - rust-book
      - ch08
      - strings
      - api_recall
    provenance:
      source_file: ch08_strings.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing UTF-8 Encoded Text with Strings"
      source: rust-book/src/ch08-02-strings.md
      card_type: api_recall
      compile_status: concept_only
  - id: rust-book-ch08-strings-003
    type: prompt_response
    prompt: |
      What happens to `s1` after `let s3 = s1 + &s2;`?
    answer: |
      `s1` is moved into the `+` operation and cannot be used afterward. The operator takes ownership of the left-hand `String`; it borrows the right-hand string slice.
    tags:
      - rust-book
      - ch08
      - strings
      - prediction
    provenance:
      source_file: ch08_strings.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing UTF-8 Encoded Text with Strings"
      source: rust-book/src/ch08-02-strings.md
      card_type: prediction
      compile_status: concept_only
  - id: rust-book-ch08-strings-004
    type: prompt_response
    prompt: |
      Why does Rust not allow direct indexing into a `String` by integer?
    answer: |
      A `String` is UTF-8 bytes, and an integer index may not correspond to a character boundary. Indexing would be ambiguous or unsafe.
    tags:
      - rust-book
      - ch08
      - strings
      - misconception
    provenance:
      source_file: ch08_strings.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing UTF-8 Encoded Text with Strings"
      source: rust-book/src/ch08-02-strings.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch08-strings-005
    type: prompt_response
    prompt: |
      What is the difference between bytes, scalar values, and grapheme clusters in Rust string discussion?
    answer: |
      Bytes are UTF-8 storage units, scalar values are Rust `char` values, and grapheme clusters are user-perceived characters that may contain multiple scalar values.
    tags:
      - rust-book
      - ch08
      - strings
      - comparison
    provenance:
      source_file: ch08_strings.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing UTF-8 Encoded Text with Strings"
      source: rust-book/src/ch08-02-strings.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch08-strings-006
    type: prompt_response
    prompt: |
      What is Rust's only string type in the core language?
    answer: |
      `str`, usually seen through a borrowed string slice `&str`.
    tags:
      - rust-book
