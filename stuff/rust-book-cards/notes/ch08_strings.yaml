  - id: rust-book-ch08-strings-008
    type: prompt_response
    prompt: |
      What is the practical difference between `String::from("text")` and `"text".to_string()` in the book's string creation examples?
    answer: |
      They both create an owned `String` from the literal in this context. Choosing between them is mostly style and readability.
