      compile_status: compiles
  - id: rust-book-ch08-strings-014
    type: prompt_response
    prompt: |
      What happens to `s2` after `s1.push_str(&s2)`?
    answer: |
      `s2` remains usable because `push_str` takes a string slice and borrows `s2` instead of taking ownership.
      ```rust
      fn main() {
          let mut s1 = String::from("foo");
          let s2 = String::from("bar");
          s1.push_str(&s2);
          println!("{s2}");
      }
      ```
    tags:
      - rust-book
      - ch08
      - strings
      - prediction
    provenance:
      source_file: ch08_strings.yaml
      chapter: "Chapter 8: Common Collections"
      section: "Storing UTF-8 Encoded Text with Strings"
      source: rust-book/src/ch08-02-strings.md
      card_type: prediction
      compile_status: compiles
  - id: rust-book-ch08-strings-015
    type: prompt_response
    prompt: |
      What method appends one character to a `String`?
    answer: |
      `push` appends a single `char`:
      ```rust
      fn main() {
          let mut s = String::from("lo");
          s.push('l');
      }
      ```
    tags:
      - rust-book
      - ch08
      - strings
      - api_recall
    provenance:
