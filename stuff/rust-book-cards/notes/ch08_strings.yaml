  - id: rust-book-ch08-strings-009
    type: prompt_response
    prompt: |
      Why is `format!("{s1}-{s2}-{s3}")` often clearer than chaining `+` for several strings?
    answer: |
      `format!` returns a `String`, uses references rather than taking ownership of its arguments, and avoids visually noisy chained additions.
    tags:
      - rust-book
      - ch08
      - strings
      - comparison
    provenance:
