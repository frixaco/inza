notes:
  - id: rust-book-ch20-unsafe-rust-001
    type: prompt_response
    prompt: |
      What operations make up Rust's five unsafe superpowers?
    answer: |
      Dereference raw pointers, call unsafe functions or methods, access or modify mutable statics, implement unsafe traits, and access union fields.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - definition
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-002
    type: prompt_response
    prompt: |
      Does an `unsafe` block turn off the borrow checker?
    answer: |
      No. It only permits specific unsafe operations; ordinary Rust safety checks still apply.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - misconception
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-003
    type: prompt_response
    prompt: |
      What is the boundary between `&T` and `*const T`?
    answer: |
      `&T` is a safe reference guaranteed by Rust rules. `*const T` is a raw pointer that may be null, dangling, or unaligned and requires unsafe dereferencing.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - comparison
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-004
    type: prompt_response
    prompt: |
      What safety obligation exists when dereferencing a raw pointer?
    answer: |
      The code doing the dereference must ensure the pointer is valid, properly aligned, points to initialized data, and obeys aliasing rules for the access.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - invariant
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-005
    type: prompt_response
    prompt: |
      Who must uphold the contract of an `unsafe fn`?
    answer: |
      The caller must satisfy the function's documented safety preconditions before calling it in an unsafe block.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - invariant
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-006
    type: prompt_response
    prompt: |
      How do you declare an external C function in current Rust syntax?
    answer: |
      ```rust
      unsafe extern "C" {
          fn abs(input: i32) -> i32;
      }
      ```
      Calling it is unsafe unless the item is explicitly safe.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - syntax
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch20-unsafe-rust-007
    type: prompt_response
    prompt: |
      Who must uphold an `unsafe trait` implementation?
    answer: |
      The implementer must ensure the type satisfies the trait's extra invariants that other unsafe code may rely on.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - invariant
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-008
    type: prompt_response
    prompt: |
      Why can a safe function contain an unsafe block?
    answer: |
      The function can expose a safe API if its implementation upholds the unsafe operation's invariants for all safe callers.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - concept_boundary
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-009
    type: prompt_response
    prompt: |
      What syntax creates raw pointers from references without creating new references?
    answer: |
      Use raw borrow operators: `&raw const place` for `*const T` and `&raw mut place` for `*mut T`.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - syntax
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-010
    type: prompt_response
    prompt: |
      Is creating a raw pointer unsafe, or is dereferencing it unsafe?
    answer: |
      Creating raw pointers is allowed in safe Rust. Dereferencing a raw pointer is unsafe because the compiler cannot guarantee the pointer is valid for the access.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - concept_boundary
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-011
    type: prompt_response
    prompt: |
      What guarantees do raw pointers lack compared with references?
    answer: |
      Raw pointers may be null, dangling, unaligned, or point to uninitialized data, and they may alias mutable and immutable access in ways references cannot.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - comparison
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-012
    type: prompt_response
    prompt: |
      In Rust 2024, does an `unsafe fn` body automatically allow unsafe operations?
    answer: |
      No. The caller must uphold the function's safety contract, but unsafe operations inside the body still require explicit `unsafe` blocks.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - invariant
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-013
    type: prompt_response
    prompt: |
      In the book's `split_at_mut` safe abstraction, what unsafe operation is performed and what obligation must the wrapper uphold?
    answer: |
      It creates two mutable slices from raw pointers with `slice::from_raw_parts_mut`. The wrapper must ensure the slices are within the original slice and do not overlap; the safe API enforces this with `mid <= len` and pointer arithmetic.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - invariant
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-014
    type: prompt_response
    prompt: |
      Why is creating a slice from an arbitrary memory address unsafe?
    answer: |
      The code must prove the pointer is valid for the requested length, properly aligned, initialized, and that the memory lives long enough. Without those facts, using the slice can cause undefined behavior.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - diagnostic
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-015
    type: prompt_response
    prompt: |
      What does the `"C"` ABI mean in `unsafe extern "C"`?
    answer: |
      It says the declared functions use the C application binary interface, so Rust knows how to call them at the machine-code boundary.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - definition
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-016
    type: prompt_response
    prompt: |
      Why is accessing or modifying a mutable static unsafe?
    answer: |
      Mutable statics are global mutable state, so concurrent access can create data races. Code that touches them must uphold synchronization and aliasing requirements.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - invariant
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch20-unsafe-rust-017
    type: prompt_response
    prompt: |
      What does creating and dereferencing raw pointers look like?
    answer: |
      ```rust
      fn main() {
          let mut num = 5;
          let r1 = &raw const num;
          let r2 = &raw mut num;
      
          unsafe {
              println!("r1 is: {}", *r1);
              println!("r2 is: {}", *r2);
          }
      }
      ```
      Creating raw pointers is safe; dereferencing them is the unsafe operation. The unsafe block must uphold pointer validity and aliasing requirements.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - syntax
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch20-unsafe-rust-018
    type: prompt_response
    prompt: |
      Why does this call fail?
      
      ```rust
      unsafe fn dangerous() {}
      
      fn main() {
          dangerous();
      }
      ```
    answer: |
      Calling an `unsafe fn` is an unsafe operation. The caller must use an `unsafe` block and uphold the function's documented safety preconditions.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - diagnostic
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch20-unsafe-rust-019
    type: prompt_response
    prompt: |
      What is the syntax for defining and implementing an unsafe trait?
    answer: |
      ```rust
      unsafe trait Foo {
          // methods would go here
      }
      
      unsafe impl Foo for i32 {}
      ```
      The implementer of `unsafe impl` must uphold the trait's extra invariants.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - syntax
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch20-unsafe-rust-020
    type: prompt_response
    prompt: |
      What does accessing a union field look like?
    answer: |
      ```rust
      union IntOrFloat {
          i: i32,
          f: f32,
      }
      
      fn main() {
          let value = IntOrFloat { i: 3 };
          unsafe {
              println!("{}", value.i);
          }
      }
      ```
      Accessing a union field is unsafe because the code must know which field's type is currently valid.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - syntax
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch20-unsafe-rust-021
    type: prompt_response
    prompt: |
      What command does the book give for running Miri on a project?
    answer: |
      `cargo +nightly miri run` runs the project under Miri. Miri is dynamic analysis: finding a problem is strong evidence of a bug, but not finding one does not prove unsafe code is sound.
    tags:
      - rust-book
      - ch20
      - unsafe-rust
      - api_recall
    provenance:
      source_file: ch20_unsafe_rust.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Unsafe Rust"
      source: rust-book/src/ch20-01-unsafe-rust.md
      card_type: api_recall
      compile_status: non_rust
