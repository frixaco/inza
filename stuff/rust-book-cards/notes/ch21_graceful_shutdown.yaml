  - id: rust-book-ch21-graceful-shutdown-001
    type: prompt_response
    prompt: |
      What does graceful shutdown mean for the thread pool?
    answer: |
      Stop accepting new work, signal workers to finish, and join worker threads so cleanup completes predictably.
    tags:
      - rust-book
      - ch21
