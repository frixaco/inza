  - id: rust-book-ch21-graceful-shutdown-010
    type: prompt_response
    prompt: |
      What does storing a worker thread handle in `Option` enable?
    answer: |
      ```rust
      use std::thread;
      
      struct Worker {
          id: usize,
          thread: Option<thread::JoinHandle<()>>,
      }
      
      fn join_worker(worker: &mut Worker) {
          if let Some(thread) = worker.thread.take() {
              thread.join().unwrap();
          }
      }
      ```
      `JoinHandle::join` takes ownership, so `Option::take` moves it out through `&mut Worker`.
    tags:
      - rust-book
      - ch21
      - graceful-shutdown
      - syntax
    provenance:
