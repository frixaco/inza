  - id: rust-book-ch21-graceful-shutdown-002
    type: prompt_response
    prompt: |
      Why can joining worker threads in `Drop` fail if the sender is still alive?
    answer: |
      Workers may stay blocked waiting for more jobs. Dropping the sender closes the channel so workers can exit their loops.
    tags:
