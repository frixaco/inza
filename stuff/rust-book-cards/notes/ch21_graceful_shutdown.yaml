  - id: rust-book-ch21-graceful-shutdown-003
    type: prompt_response
    prompt: |
      Why wrap the thread pool sender in `Option<Sender<Job>>`?
    answer: |
      It allows `Drop` to call `take()` and drop the sender before joining workers, closing the channel exactly once.
    tags:
