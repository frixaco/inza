  - id: rust-book-ch21-graceful-shutdown-005
    type: prompt_response
    prompt: |
      Why does the final `Worker` store its thread handle in an `Option`?
    answer: |
      `join` takes ownership of the handle, and `Drop` only has `&mut self`; `Option::take` moves the handle out safely.
