  - id: rust-book-ch21-graceful-shutdown-009
    type: prompt_response
    prompt: |
      What is the difference between shutting down by dropping the sender and sending explicit shutdown jobs?
    answer: |
      Dropping the sender makes `recv` return an error for every worker once queued jobs are drained. Explicit shutdown jobs require sending enough stop messages and ensuring they are ordered after any work that should finish.
    tags:
      - rust-book
