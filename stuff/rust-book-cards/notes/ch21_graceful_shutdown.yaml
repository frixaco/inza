  - id: rust-book-ch21-graceful-shutdown-008
    type: prompt_response
    prompt: |
      Why does `JoinHandle::join` force the book to move handles out of `Worker` values?
    answer: |
      `join` takes ownership of the `JoinHandle`. Because `Drop` only has `&mut self`, the handle must be stored in `Option` so `take()` can move it out before joining.
    tags:
