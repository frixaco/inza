  - id: rust-book-ch21-graceful-shutdown-006
    type: prompt_response
    prompt: |
      What order must `ThreadPool::drop` use for a graceful shutdown?
    answer: |
      Drop the sender first so the channel closes, then join each worker thread. Joining before closing the channel can leave workers blocked on `recv`.
    tags:
