  - id: rust-book-ch21-graceful-shutdown-011
    type: prompt_response
    prompt: |
      What does wrapping the thread pool sender in `Option` enable during `Drop`?
    answer: |
      ```rust
      use std::sync::mpsc;
      
      type Job = Box<dyn FnOnce() + Send + 'static>;
      
      struct ThreadPool {
          sender: Option<mpsc::Sender<Job>>,
      }
      
      impl Drop for ThreadPool {
          fn drop(&mut self) {
              drop(self.sender.take());
          }
      }
      ```
      Taking and dropping the sender closes the channel before worker threads are joined.
    tags:
      - rust-book
      - ch21
      - graceful-shutdown
      - syntax
    provenance:
      source_file: ch21_graceful_shutdown.yaml
      chapter: "Chapter 21: Final Project: Building a Multithreaded Web Server"
      section: "Graceful Shutdown and Cleanup"
      source: rust-book/src/ch21-03-graceful-shutdown-and-cleanup.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch21-graceful-shutdown-012
    type: prompt_response
    prompt: |
      What does the final worker loop do when the channel disconnects?
    answer: |
      ```rust
      use std::sync::{mpsc, Arc, Mutex};
      
      type Job = Box<dyn FnOnce() + Send + 'static>;
      
      fn worker_loop(receiver: Arc<Mutex<mpsc::Receiver<Job>>>) {
          loop {
              let message = receiver.lock().unwrap().recv();
              match message {
                  Ok(job) => job(),
                  Err(_) => break,
              }
          }
      }
      ```
      `Err(_)` means all senders are gone, so the worker exits.
    tags:
      - rust-book
      - ch21
      - graceful-shutdown
      - syntax
