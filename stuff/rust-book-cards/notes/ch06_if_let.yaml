notes:
  - id: rust-book-ch06-if-let-001
    type: prompt_response
    prompt: |
      When is `if let` preferable to `match`?
    answer: |
      Use `if let` when you care about one pattern and want to ignore the rest with less boilerplate.
    tags:
      - rust-book
      - ch06
      - if-let
      - comparison
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch06-if-let-002
    type: prompt_response
    prompt: |
      What is the basic `if let` syntax for handling only `Some(max)`?
    answer: |
      ```rust
      let config_max = Some(3);
      
      if let Some(max) = config_max {
          println!("The maximum is configured to be {max}");
      }
      ```
    tags:
      - rust-book
      - ch06
      - if-let
      - syntax
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
