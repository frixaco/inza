      source: rust-book/src/ch06-03-if-let.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch06-if-let-003
    type: prompt_response
    prompt: |
      What boundary separates `match`, `if let`, and `let...else`?
    answer: |
      Use `match` when exhaustiveness matters, `if let` for one interesting branch, and `let...else` when the nonmatching case should exit the current flow early.
    tags:
      - rust-book
      - ch06
      - if-let
      - comparison
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch06-if-let-004
    type: prompt_response
    prompt: |
      What does `let PATTERN = expr else { ... };` require of the `else` block?
    answer: |
      The `else` block must diverge, such as by `return`, `break`, `continue`, or `panic!`, because the following code assumes the pattern matched.
    tags:
      - rust-book
      - ch06
      - if-let
      - syntax
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: syntax
      compile_status: concept_only
  - id: rust-book-ch06-if-let-005
    type: prompt_response
    prompt: |
      What exhaustive-checking tradeoff do you make when using `if let` instead of `match`?
    answer: |
      `if let` ignores nonmatching cases unless you add `else`, so it does not force you to handle every possible variant the way `match` does.
    tags:
      - rust-book
      - ch06
      - if-let
      - misconception
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch06-if-let-006
    type: prompt_response
    prompt: |
      What problem does `let...else` solve compared with nesting work inside an `if let` body?
    answer: |
      It binds the successful pattern in the outer scope and sends the failure case to an early-exit `else`, keeping the main logic on the happy path.
    tags:
      - rust-book
      - ch06
      - if-let
      - evolution
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: evolution
      compile_status: concept_only
  - id: rust-book-ch06-if-let-007
    type: prompt_response
    prompt: |
      What does `if let` with an `else` branch look like?
    answer: |
      ```rust
      fn main() {
          let config_max = Some(3u8);
          if let Some(max) = config_max {
              println!("The maximum is configured to be {max}");
          } else {
              println!("No maximum configured");
          }
      }
      ```
      The `else` branch handles every nonmatching case.
    tags:
      - rust-book
      - ch06
      - if-let
      - syntax
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch06-if-let-008
    type: prompt_response
    prompt: |
      What does `let...else` look like when extracting `Some(value)` or returning early?
    answer: |
      ```rust
      fn describe(config_max: Option<u8>) -> String {
          let Some(max) = config_max else {
              return String::from("No maximum configured");
          };
      
          format!("The maximum is configured to be {max}")
      }
      ```
      When the pattern matches, `max` is bound in the outer scope after the statement.
    tags:
      - rust-book
      - ch06
      - if-let
      - syntax
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch06-if-let-009
    type: prompt_response
    prompt: |
      Why does this `let...else` fail?
      
      ```rust
      fn main() {
          let value = None::<u8>;
          let Some(max) = value else {
              println!("missing");
          };
          println!("{max}");
      }
      ```
    answer: |
      The `else` block must diverge. Here it only prints and then would continue, but `max` would not be bound for the code after the `let...else`.
    tags:
      - rust-book
      - ch06
      - if-let
      - diagnostic
    provenance:
      source_file: ch06_if_let.yaml
      chapter: "Chapter 6: Enums and Pattern Matching"
      section: "Concise Control Flow with if let and let...else"
      source: rust-book/src/ch06-03-if-let.md
      card_type: diagnostic
      compile_status: expected_failure
