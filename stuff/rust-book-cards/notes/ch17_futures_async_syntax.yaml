      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch17-futures-async-syntax-011
    type: prompt_response
    prompt: |
      What is the standard-library-only shape of `async fn` returning a future?
    answer: |
      ```rust
      use std::future::Future;
      
      async fn answer() -> i32 {
          42
      }
      
      fn answer_expanded() -> impl Future<Output = i32> {
          async { 42 }
      }
      ```
      Calling either function produces a future whose output is `i32`.
    tags:
      - rust-book
      - ch17
      - futures-async-syntax
      - syntax
    provenance:
      source_file: ch17_futures_async_syntax.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "Futures and the Async Syntax"
      source: rust-book/src/ch17-01-futures-and-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch17-futures-async-syntax-012
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn main() {
          let value = async { 5 }.await;
      }
      ```
    answer: |
      `.await` is only allowed inside an async block or async function. A normal `fn main` must pass async work to a runtime instead.
    tags:
      - rust-book
      - ch17
      - futures-async-syntax
      - diagnostic
    provenance:
      source_file: ch17_futures_async_syntax.yaml
      chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
      section: "Futures and the Async Syntax"
      source: rust-book/src/ch17-01-futures-and-syntax.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch17-futures-async-syntax-013
    type: prompt_response
    prompt: |
      Why does plain `async fn main()` fail in the book?
      
      ```rust
      async fn main() {}
      ```
    answer: |
      The special `main` function cannot be async by itself because something must set up a runtime and poll the returned future. Some runtimes provide macros that rewrite async main into a normal main.
    tags:
      - rust-book
      - ch17
      - futures-async-syntax
      - diagnostic
    provenance:
