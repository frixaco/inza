  - id: rust-book-ch20-macros-001
    type: prompt_response
    prompt: |
      What capability does a Rust macro provide?
    answer: |
      A way to write code that writes other code, reducing repetition or enabling syntax that functions cannot express.
    tags:
      - rust-book
      - ch20
      - macros
      - definition
    provenance:
      source_file: ch20_macros.yaml
      chapter: "Chapter 20: Advanced Features"
      section: Macros
      source: rust-book/src/ch20-05-macros.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch20-macros-002
    type: prompt_response
    prompt: |
      What is a key difference between macros and functions?
    answer: |
      Macros are expanded before compilation and can take variable numbers or shapes of arguments. Functions have fixed signatures and are called at runtime.
    tags:
      - rust-book
      - ch20
      - macros
      - comparison
    provenance:
      source_file: ch20_macros.yaml
      chapter: "Chapter 20: Advanced Features"
      section: Macros
      source: rust-book/src/ch20-05-macros.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch20-macros-003
    type: prompt_response
    prompt: |
      What is the difference between declarative and procedural macros?
    answer: |
      Declarative macros match input against patterns and expand templates. Procedural macros take token streams as input and produce token streams as output.
    tags:
      - rust-book
      - ch20
      - macros
      - comparison
    provenance:
      source_file: ch20_macros.yaml
      chapter: "Chapter 20: Advanced Features"
      section: Macros
      source: rust-book/src/ch20-05-macros.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch20-macros-004
    type: prompt_response
    prompt: |
      What macro form defines a declarative macro?
    answer: |
      ```rust
      macro_rules! say_hello {
          () => {
              println!("hello");
          };
      }
      
      fn main() {
          say_hello!();
      }
      ```
      Declarative macros are defined with `macro_rules! name { ... }`.
    tags:
      - rust-book
      - ch20
      - macros
      - syntax
    provenance:
      source_file: ch20_macros.yaml
      chapter: "Chapter 20: Advanced Features"
      section: Macros
      source: rust-book/src/ch20-05-macros.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch20-macros-005
    type: prompt_response
    prompt: |
      What are the three kinds of procedural macros discussed in the book?
    answer: |
      Custom derive macros, attribute-like macros, and function-like macros.
    tags:
      - rust-book
      - ch20
      - macros
      - definition
    provenance:
      source_file: ch20_macros.yaml
      chapter: "Chapter 20: Advanced Features"
      section: Macros
