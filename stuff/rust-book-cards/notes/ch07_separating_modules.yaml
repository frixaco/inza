notes:
  - id: rust-book-ch07-separating-modules-001
    type: prompt_response
    prompt: |
      What does `mod front_of_house;` in `src/lib.rs` tell Rust?
    answer: |
      It declares the module and tells Rust to load its contents from `src/front_of_house.rs` or `src/front_of_house/mod.rs`.
    tags:
      - rust-book
      - ch07
      - separating-modules
      - syntax
    provenance:
      source_file: ch07_separating_modules.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Separating Modules into Different Files"
      source: rust-book/src/ch07-05-separating-modules-into-different-files.md
      card_type: syntax
      compile_status: non_rust
  - id: rust-book-ch07-separating-modules-002
    type: prompt_response
    prompt: |
      Does `mod hosting;` import an already-existing module like `use`?
    answer: |
      No. `mod` declares a module and loads its source. `use` only brings an existing path into scope.
    tags:
      - rust-book
      - ch07
      - separating-modules
      - misconception
    provenance:
      source_file: ch07_separating_modules.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Separating Modules into Different Files"
      source: rust-book/src/ch07-05-separating-modules-into-different-files.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch07-separating-modules-003
    type: prompt_response
    prompt: |
      Why split modules into files as a project grows?
    answer: |
      It keeps module boundaries while reducing large source files; the module tree remains the same even when module bodies move to files.
    tags:
      - rust-book
      - ch07
      - separating-modules
      - project_architecture
    provenance:
      source_file: ch07_separating_modules.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Separating Modules into Different Files"
      source: rust-book/src/ch07-05-separating-modules-into-different-files.md
      card_type: project_architecture
      compile_status: concept_only
  - id: rust-book-ch07-separating-modules-004
    type: prompt_response
    prompt: |
      When moving inline module code into a file, do you keep the outer module braces in the new file?
    answer: |
      No. If `src/lib.rs` says `mod front_of_house;`, then `src/front_of_house.rs` contains the module's contents, not another `mod front_of_house { ... }` wrapper.
    tags:
      - rust-book
      - ch07
      - separating-modules
      - concept_boundary
    provenance:
      source_file: ch07_separating_modules.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Separating Modules into Different Files"
      source: rust-book/src/ch07-05-separating-modules-into-different-files.md
      card_type: concept_boundary
      compile_status: non_rust
  - id: rust-book-ch07-separating-modules-005
    type: prompt_response
    prompt: |
      If `hosting` is a child of `front_of_house`, where does the book place `hosting.rs`?
    answer: |
      `src/front_of_house/hosting.rs`, with `mod hosting;` declared in `src/front_of_house.rs`.
    tags:
      - rust-book
      - ch07
      - separating-modules
      - api_recall
    provenance:
      source_file: ch07_separating_modules.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Separating Modules into Different Files"
      source: rust-book/src/ch07-05-separating-modules-into-different-files.md
      card_type: api_recall
      compile_status: non_rust
  - id: rust-book-ch07-separating-modules-006
    type: prompt_response
    prompt: |
      Does moving a module to a different source file change its path in the module tree?
    answer: |
      No. The module declaration location determines the module tree path; the file only stores the module's contents.
    tags:
      - rust-book
      - ch07
      - separating-modules
      - misconception
    provenance:
