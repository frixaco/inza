      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch20-advanced-traits-003
    type: prompt_response
    prompt: |
      What does a default generic type parameter provide?
    answer: |
      A generic type parameter with a default, such as `trait Add<Rhs = Self>`, used when most implementations use one common type.
    tags:
      - rust-book
      - ch20
      - advanced-traits
      - definition
    provenance:
