  - id: rust-book-ch20-advanced-traits-002
    type: prompt_response
    prompt: |
      How is an associated type different from a generic type parameter on a trait?
    answer: |
      An associated type gives each implementer one concrete choice for that trait. A generic trait can be implemented multiple times for different type parameters.
    tags:
      - rust-book
      - ch20
      - advanced-traits
      - comparison
    provenance:
      source_file: ch20_advanced_traits.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Advanced Traits"
