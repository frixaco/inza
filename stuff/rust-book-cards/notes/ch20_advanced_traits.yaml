  - id: rust-book-ch20-advanced-traits-001
    type: prompt_response
    prompt: |
      What role does an associated type play inside a trait?
    answer: |
      A type placeholder declared inside a trait and specified by each implementation.
    tags:
      - rust-book
      - ch20
      - advanced-traits
      - definition
    provenance:
