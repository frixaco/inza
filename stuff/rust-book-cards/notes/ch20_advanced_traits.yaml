  - id: rust-book-ch20-advanced-traits-004
    type: prompt_response
    prompt: |
      What syntax calls two methods with the same name from different traits explicitly?
    answer: |
      ```rust
      trait Pilot {
          fn fly(&self);
      }
      
      struct Human;
      
      impl Pilot for Human {
          fn fly(&self) {}
      }
      
      fn main() {
          let person = Human;
          <Human as Pilot>::fly(&person);
      }
      ```
      Use fully qualified syntax, such as `<Type as Trait>::method(&value)`.
    tags:
      - rust-book
      - ch20
      - advanced-traits
      - syntax
    provenance:
      source_file: ch20_advanced_traits.yaml
      chapter: "Chapter 20: Advanced Features"
      section: "Advanced Traits"
      source: rust-book/src/ch20-02-advanced-traits.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch20-advanced-traits-005
    type: prompt_response
    prompt: |
      What requirement does a supertrait add to implementers?
    answer: |
      A trait that requires implementers also implement another trait, such as `trait OutlinePrint: fmt::Display`.
    tags:
