  - id: rust-book-ch20-advanced-traits-007
    type: prompt_response
    prompt: |
      What does an associated type in a trait look like?
    answer: |
      ```rust
      trait IteratorLike {
          type Item;
      
          fn next(&mut self) -> Option<Self::Item>;
      }
      ```
      Each implementation chooses one concrete `Item` type.
