  - id: rust-book-ch15-rc-003
    type: prompt_response
    prompt: |
      What ownership count does `Rc::strong_count(&value)` report?
    answer: |
      ```rust
      use std::rc::Rc;
      
      let value = Rc::new(5);
      assert_eq!(Rc::strong_count(&value), 1);
      ```
      The number of strong `Rc<T>` owners keeping the allocation alive.
    tags:
