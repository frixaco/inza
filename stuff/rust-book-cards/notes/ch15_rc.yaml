notes:
  - id: rust-book-ch15-rc-001
    type: prompt_response
    prompt: |
      What ownership pattern does `Rc<T>` enable?
    answer: |
      Multiple owners of the same heap allocation in single-threaded code by keeping a reference count.
    tags:
      - rust-book
      - ch15
      - rc
      - definition
    provenance:
      source_file: ch15_rc.yaml
      chapter: "Chapter 15: Smart Pointers"
      section: "Rc<T>, the Reference Counted Smart Pointer"
      source: rust-book/src/ch15-04-rc.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch15-rc-002
    type: prompt_response
    prompt: |
      What ownership count change does `Rc::clone(&value)` make?
    answer: |
      ```rust
      use std::rc::Rc;
      
      let value = Rc::new(String::from("shared"));
      let another_owner = Rc::clone(&value);
      assert_eq!(Rc::strong_count(&value), 2);
      ```
      It increments the reference count and returns another `Rc<T>` pointing to the same allocation; it does not deep-copy `T`.
    tags:
      - rust-book
      - ch15
      - rc
      - api_recall
    provenance:
