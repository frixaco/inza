  - id: rust-book-ch15-rc-005
    type: prompt_response
    prompt: |
      Why can two lists not both share ownership of a tail list through `Box<T>`?
    answer: |
      `Box<T>` has single ownership. Moving the boxed tail into one list leaves the original binding unavailable for the second list.
    tags:
      - rust-book
      - ch15
      - rc
      - diagnostic
    provenance:
