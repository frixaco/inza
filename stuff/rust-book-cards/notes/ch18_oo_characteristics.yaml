notes:
  - id: rust-book-ch18-oo-characteristics-001
    type: prompt_response
    prompt: |
      How does Rust use modules and visibility for encapsulation?
    answer: |
      Public and private items let implementation details stay hidden while public methods expose controlled behavior.
    tags:
      - rust-book
      - ch18
      - oo-characteristics
      - concept_boundary
    provenance:
      source_file: ch18_oo_characteristics.yaml
