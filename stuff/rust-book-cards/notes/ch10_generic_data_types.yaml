  - id: rust-book-ch10-generic-data-types-009
    type: prompt_response
    prompt: |
      What is the generic enum shape of `Result<T, E>`?
    answer: |
      ```rust
      enum Result<T, E> {
          Ok(T),
          Err(E),
      }
      ```
      `T` is the success value type; `E` is the error value type.
    tags:
