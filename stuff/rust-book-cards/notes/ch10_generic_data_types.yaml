  - id: rust-book-ch10-generic-data-types-010
    type: prompt_response
    prompt: |
      What syntax defines a method on a generic `Point<T>`?
    answer: |
      ```rust
      struct Point<T> {
          x: T,
          y: T,
      }
      
      impl<T> Point<T> {
          fn x(&self) -> &T {
              &self.x
          }
      }
      ```
      The `T` after `impl` declares the generic parameter used in `Point<T>`.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - syntax
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-generic-data-types-011
    type: prompt_response
    prompt: |
      What does `impl Point<f32>` do differently from `impl<T> Point<T>`?
    answer: |
      ```rust
      struct Point<T> {
          x: T,
          y: T,
      }
      
      impl Point<f32> {
          fn distance_from_origin(&self) -> f32 {
              (self.x.powi(2) + self.y.powi(2)).sqrt()
          }
      }
      ```
      `impl Point<f32>` defines methods only for `Point<f32>` values. Other `Point<T>` instantiations do not get those methods.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - concept_boundary
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: concept_boundary
      compile_status: compiles
  - id: rust-book-ch10-generic-data-types-012
    type: prompt_response
    prompt: |
      How can a method introduce generic parameters that are different from the struct's parameters?
    answer: |
      ```rust
      struct Point<X1, Y1> {
          x: X1,
          y: Y1,
      }
      
      impl<X1, Y1> Point<X1, Y1> {
          fn mixup<X2, Y2>(self, other: Point<X2, Y2>) -> Point<X1, Y2> {
              Point { x: self.x, y: other.y }
          }
      }
      ```
      `X1` and `Y1` belong to the struct impl; `X2` and `Y2` belong only to `mixup`.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - syntax
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-generic-data-types-013
    type: prompt_response
    prompt: |
      Is adding many generic type parameters always a harmless abstraction?
    answer: |
      No. Generics are useful, but too many type parameters can make code harder to read and understand; they should be introduced when they solve a real problem.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - misconception
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: misconception
      compile_status: concept_only
  - id: rust-book-ch10-generic-data-types-014
    type: prompt_response
    prompt: |
      If code uses `Option<i32>` and `Option<f64>`, what does monomorphization generate?
    answer: |
      The compiler generates concrete specialized versions for the used types, like one option representation for `i32` and one for `f64`. The generic abstraction is removed at compile time.
