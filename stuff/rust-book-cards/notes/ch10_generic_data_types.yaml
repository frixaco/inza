  - id: rust-book-ch10-generic-data-types-001
    type: prompt_response
    prompt: |
      What syntax declares a generic function over type `T`?
    answer: |
      ```rust
      fn largest<T: PartialOrd + Copy>(list: &[T]) -> T {
          let mut largest = list[0];
          for &item in list {
              if item > largest { largest = item; }
          }
          largest
      }
      ```
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - syntax
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-generic-data-types-002
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn largest<T>(list: &[T]) -> &T {
          let mut largest = &list[0];
      
          for item in list {
              if item > largest {
                  largest = item;
              }
          }
      
          largest
      }
      ```
    answer: |
      The operator `>` is only available for types that implement the appropriate comparison trait, such as `PartialOrd`.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - diagnostic
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: diagnostic
      compile_status: expected_failure
  - id: rust-book-ch10-generic-data-types-003
    type: prompt_response
    prompt: |
      What syntax defines a generic struct with one type parameter?
    answer: |
      ```rust
      struct Point<T> {
          x: T,
          y: T,
      }
      ```
      Both fields must have the same concrete type for each `Point<T>`.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - syntax
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch10-generic-data-types-004
    type: prompt_response
    prompt: |
      How do `Point<T>` and `Point<T, U>` differ?
    answer: |
      `Point<T>` requires `x` and `y` to have the same type. `Point<T, U>` allows different types for `x` and `y`.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - comparison
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
      source: rust-book/src/ch10-01-syntax.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch10-generic-data-types-005
    type: prompt_response
    prompt: |
      What does monomorphization do to generic code at compile time?
    answer: |
      The compiler turns generic code into concrete code for the types actually used, so generics do not add runtime dispatch cost by themselves.
    tags:
      - rust-book
      - ch10
      - generic-data-types
      - definition
    provenance:
      source_file: ch10_generic_data_types.yaml
      chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
      section: "Generic Data Types"
