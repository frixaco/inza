  - id: rust-book-ch10-generic-data-types-008
    type: prompt_response
    prompt: |
      What is the generic enum shape of `Option<T>`?
    answer: |
      ```rust
      enum Option<T> {
          Some(T),
          None,
      }
      ```
      `Some` stores one value of type `T`; `None` stores no value.
    tags:
      - rust-book
