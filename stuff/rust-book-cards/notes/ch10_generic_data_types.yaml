  - id: rust-book-ch10-generic-data-types-007
    type: prompt_response
    prompt: |
      What generic type parameter name does the Rust Book use as the conventional default?
    answer: |
      `T`, short for "type", is the conventional first generic type parameter name. Rust names are usually short and CamelCase for type parameters.
