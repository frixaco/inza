notes:
  - id: rust-book-ch07-use-keyword-001
    type: prompt_response
    prompt: |
      What does a `use` declaration let code do with a path?
    answer: |
      `use` brings a path into scope so code can refer to the item with a shorter name.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - definition
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-002
    type: prompt_response
    prompt: |
      Why does the book usually bring a function's parent module into scope rather than the function itself?
    answer: |
      Calling `hosting::add_to_waitlist()` keeps it clear the function is not defined locally while still shortening the path.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - concept_boundary
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-003
    type: prompt_response
    prompt: |
      Why are structs and enums often brought into scope by their full item name?
    answer: |
      Using `HashMap::new()` after `use std::collections::HashMap;` is idiomatic because the type name itself makes the source clear.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - comparison
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-004
    type: prompt_response
    prompt: |
      What syntax gives an imported item a local alias?
    answer: |
      ```rust
      use std::io::Result as IoResult;
      
      fn function2() -> IoResult<()> {
          Ok(())
      }
      ```
      `as` gives the imported item a local name.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - syntax
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-use-keyword-005
    type: prompt_response
    prompt: |
      What public API effect does `pub use` have?
    answer: |
      It brings a name into scope and re-exports it as part of the current module's public API.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - api_recall
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: api_recall
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-006
    type: prompt_response
    prompt: |
      What scope does a `use` shortcut apply to?
    answer: |
      Only the scope where the `use` appears. A child module needs its own `use` or must refer to the parent shortcut with a path such as `super::hosting`.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - invariant
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-007
    type: prompt_response
    prompt: |
      Why can't two different `Result` types both be imported as plain `Result` in the same scope?
    answer: |
      The local name would be ambiguous. Use their parent modules, or rename one with `as`, such as `use std::io::Result as IoResult;`.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - diagnostic
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-008
    type: prompt_response
    prompt: |
      Why might a library use `pub use` to expose a path different from its internal module tree?
    answer: |
      Re-exporting lets the internal structure stay useful for maintainers while presenting a simpler or more domain-oriented public API to callers.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - project_architecture
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: project_architecture
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-009
    type: prompt_response
    prompt: |
      How can two `use` statements with the same prefix be combined with nested paths?
    answer: |
      ```rust
      use std::{cmp::Ordering, io};
      
      fn main() {
          let order = Ordering::Equal;
          let stdin = io::stdin();
      }
      ```
      This brings both `std::cmp::Ordering` and `std::io` into scope.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - syntax
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-use-keyword-010
    type: prompt_response
    prompt: |
      In a nested `use` path, what does `self` mean?
    answer: |
      ```rust
      use std::io::{self, Write};
      
      fn main() {
          let mut output = io::stdout();
          writeln!(output, "hello").unwrap();
      }
      ```
      `self` imports the common prefix itself; here it imports `std::io`.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - syntax
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-use-keyword-011
    type: prompt_response
    prompt: |
      When is the glob operator `*` appropriate with `use`?
    answer: |
      Use it sparingly, such as in tests to bring all public items into scope. It can make it harder to tell which names came from where.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - concept_boundary
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch07-use-keyword-012
    type: prompt_response
    prompt: |
      What does a concrete `as` alias look like for two different `Result` types?
    answer: |
      ```rust
      use std::fmt::Result;
      use std::io::Result as IoResult;
      
      fn function1() -> Result {
          Ok(())
      }
      
      fn function2() -> IoResult<()> {
          Ok(())
      }
      ```
      `as` avoids bringing two items into scope with the same local name.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - syntax
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-use-keyword-013
    type: prompt_response
    prompt: |
      What does a nested `use` path with `self` look like?
    answer: |
      ```rust
      use std::io::{self, Write};
      
      fn main() {
          let mut output = io::stdout();
          writeln!(output, "hello").unwrap();
      }
      ```
      `self` imports `std::io`; `Write` imports `std::io::Write`.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - syntax
    provenance:
      source_file: ch07_use_keyword.yaml
      chapter: "Chapter 7: Packages, Crates, and Modules"
      section: "Bringing Paths Into Scope with the use Keyword"
      source: rust-book/src/ch07-04-bringing-paths-into-scope-with-the-use-keyword.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch07-use-keyword-014
    type: prompt_response
    prompt: |
      What does a glob import look like?
    answer: |
      ```rust
      use std::collections::*;
      
      fn main() {
          let mut scores = HashMap::new();
          scores.insert("Blue", 10);
      }
      ```
      `*` brings all public names from the path into scope.
    tags:
      - rust-book
      - ch07
      - use-keyword
      - syntax
    provenance:
