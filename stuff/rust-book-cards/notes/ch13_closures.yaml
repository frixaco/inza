  - id: rust-book-ch13-closures-002
    type: prompt_response
    prompt: |
      What is a closure syntax that takes one parameter and returns it plus one?
    answer: |
      ```rust
      let add_one = |x| x + 1;
      assert_eq!(add_one(5), 6);
      ```
      `let add_one = |x| x + 1;`.
    tags:
