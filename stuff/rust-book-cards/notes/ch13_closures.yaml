      compile_status: expected_failure
  - id: rust-book-ch13-closures-004
    type: prompt_response
    prompt: |
      What is the difference between `Fn`, `FnMut`, and `FnOnce` captures?
    answer: |
      `Fn` borrows immutably, `FnMut` may mutate captured state, and `FnOnce` may consume captured values and can be called only once.
    tags:
      - rust-book
      - ch13
      - closures
      - comparison
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
      section: Closures
      source: rust-book/src/ch13-01-closures.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch13-closures-005
    type: prompt_response
    prompt: |
      What does `move` do before a closure?
    answer: |
      ```rust
      let list = vec![1, 2, 3];
      std::thread::spawn(move || println!("{list:?}"))
          .join()
          .unwrap();
      ```
      It forces the closure to take ownership of captured values instead of borrowing them.
    tags:
      - rust-book
      - ch13
      - closures
      - syntax
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
      section: Closures
      source: rust-book/src/ch13-01-closures.md
      card_type: syntax
      compile_status: compiles
  - id: rust-book-ch13-closures-006
    type: prompt_response
    prompt: |
      Why does `sort_by_key` need an `FnMut` closure rather than `FnOnce`?
    answer: |
      It calls the closure repeatedly, so the closure cannot consume captured values in a way that makes it callable only once.
    tags:
      - rust-book
      - ch13
      - closures
      - concept_boundary
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
