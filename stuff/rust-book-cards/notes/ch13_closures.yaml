  - id: rust-book-ch13-closures-007
    type: prompt_response
    prompt: |
      Why do function signatures need type annotations while closures often do not?
    answer: |
      Function signatures are part of an exposed interface. Closures are usually local and short, so the compiler can infer their parameter and return types from use.
    tags:
      - rust-book
      - ch13
      - closures
      - comparison
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
