  - id: rust-book-ch13-closures-014
    type: prompt_response
    prompt: |
      What can closures do that ordinary functions cannot do?
    answer: |
      Closures can capture values from the scope where they are defined. Ordinary functions cannot capture their environment.
    tags:
      - rust-book
