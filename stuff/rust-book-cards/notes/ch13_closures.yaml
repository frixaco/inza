  - id: rust-book-ch13-closures-015
    type: prompt_response
    prompt: |
      Why does a closure passed to `thread::spawn` often need `move`?
    answer: |
      The new thread may outlive the current stack frame, so captured values must be owned by the closure rather than borrowed from the current thread.
    tags:
      - rust-book
      - ch13
      - closures
      - diagnostic
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
      section: Closures
      source: rust-book/src/ch13-01-closures.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch13-closures-016
    type: prompt_response
    prompt: |
      Which closure trait do all closures implement?
    answer: |
      All closures implement `FnOnce` because every closure can be called at least once. Closures may also implement `FnMut` or `Fn` depending on how they use captured values.
    tags:
      - rust-book
      - ch13
      - closures
      - invariant
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
      section: Closures
      source: rust-book/src/ch13-01-closures.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch13-closures-017
    type: prompt_response
    prompt: |
      Why does moving a captured `String` into `sort_operations.push(value)` make the closure unsuitable for `sort_by_key`?
    answer: |
      Moving `value` out of the closure body makes the closure callable only once, so it implements only `FnOnce`. `sort_by_key` needs an `FnMut` closure it can call multiple times.
    tags:
      - rust-book
      - ch13
      - closures
      - diagnostic
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
      section: Closures
      source: rust-book/src/ch13-01-closures.md
      card_type: diagnostic
      compile_status: concept_only
  - id: rust-book-ch13-closures-018
    type: prompt_response
    prompt: |
      How does the book fix the `sort_by_key` call that tried to move a captured `String`?
    answer: |
      ```rust
      #[derive(Debug)]
      struct Rectangle {
          width: u32,
          height: u32,
      }
      
      let mut list = [
          Rectangle { width: 10, height: 1 },
          Rectangle { width: 3, height: 5 },
      ];
      let mut num_sort_operations = 0;
      
      list.sort_by_key(|r| {
          num_sort_operations += 1;
          r.width
      });
      ```
      It keeps a mutable counter in the environment and increments it in the closure, so the closure mutates captured state but does not move a captured value out.
    tags:
      - rust-book
      - ch13
      - closures
      - transformation
    provenance:
      source_file: ch13_closures.yaml
      chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
      section: Closures
      source: rust-book/src/ch13-01-closures.md
      card_type: transformation
      compile_status: compiles
