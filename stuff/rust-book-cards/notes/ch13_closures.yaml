  - id: rust-book-ch13-closures-003
    type: prompt_response
    prompt: |
      Why does this fail?
      
      ```rust
      fn main() {
          let example_closure = |x| x;
      
          let s = example_closure(String::from("hello"));
          let n = example_closure(5);
      }
      ```
    answer: |
      Once a closure's parameter and return types are inferred from first use, they are fixed.
    tags:
      - rust-book
      - ch13
      - closures
      - diagnostic
    provenance:
      source_file: ch13_closures.yaml
