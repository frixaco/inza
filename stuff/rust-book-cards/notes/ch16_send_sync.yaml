notes:
  - id: rust-book-ch16-send-sync-001
    type: prompt_response
    prompt: |
      What does the `Send` marker trait mean?
    answer: |
      Ownership of values of that type can be transferred safely between threads.
    tags:
      - rust-book
      - ch16
      - send-sync
      - concept_boundary
    provenance:
      source_file: ch16_send_sync.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Extensible Concurrency with Send and Sync"
      source: rust-book/src/ch16-04-extensible-concurrency-sync-and-send.md
      card_type: concept_boundary
      compile_status: concept_only
  - id: rust-book-ch16-send-sync-002
    type: prompt_response
    prompt: |
      What does the `Sync` marker trait mean?
    answer: |
      A type is `Sync` if references to it can be shared safely between threads; `T` is `Sync` when `&T` is `Send`.
    tags:
      - rust-book
      - ch16
      - send-sync
      - definition
    provenance:
      source_file: ch16_send_sync.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Extensible Concurrency with Send and Sync"
      source: rust-book/src/ch16-04-extensible-concurrency-sync-and-send.md
      card_type: definition
      compile_status: concept_only
  - id: rust-book-ch16-send-sync-003
    type: prompt_response
    prompt: |
      Why is `Rc<T>` not `Send` or `Sync` while `Arc<T>` is?
    answer: |
      `Rc<T>` uses non-atomic reference counts. `Arc<T>` uses atomic operations suitable for sharing across threads.
    tags:
      - rust-book
      - ch16
      - send-sync
      - comparison
    provenance:
      source_file: ch16_send_sync.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Extensible Concurrency with Send and Sync"
      source: rust-book/src/ch16-04-extensible-concurrency-sync-and-send.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch16-send-sync-004
    type: prompt_response
    prompt: |
      Why is implementing `Send` or `Sync` manually unsafe?
    answer: |
      Other unsafe code may rely on the promise that the type is thread-safe, so the implementer must uphold the concurrency invariants.
    tags:
      - rust-book
      - ch16
      - send-sync
      - invariant
    provenance:
      source_file: ch16_send_sync.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Extensible Concurrency with Send and Sync"
      source: rust-book/src/ch16-04-extensible-concurrency-sync-and-send.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch16-send-sync-005
    type: prompt_response
    prompt: |
      When does a type automatically implement `Send`?
    answer: |
      A type composed entirely of `Send` types is automatically `Send`, with exceptions such as raw pointers and types that deliberately opt out.
    tags:
      - rust-book
      - ch16
      - send-sync
      - invariant
    provenance:
      source_file: ch16_send_sync.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Extensible Concurrency with Send and Sync"
      source: rust-book/src/ch16-04-extensible-concurrency-sync-and-send.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch16-send-sync-006
    type: prompt_response
    prompt: |
      When does a type automatically implement `Sync`?
    answer: |
      A type composed entirely of `Sync` types is automatically `Sync`; `T` is `Sync` when `&T` can be sent safely between threads.
    tags:
      - rust-book
      - ch16
      - send-sync
      - invariant
    provenance:
      source_file: ch16_send_sync.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Extensible Concurrency with Send and Sync"
      source: rust-book/src/ch16-04-extensible-concurrency-sync-and-send.md
      card_type: invariant
      compile_status: concept_only
  - id: rust-book-ch16-send-sync-007
    type: prompt_response
    prompt: |
      Why is `RefCell<T>` not `Sync` while `Mutex<T>` is?
    answer: |
      `RefCell<T>` enforces borrowing rules at runtime with non-thread-safe bookkeeping. `Mutex<T>` is designed to synchronize access across threads.
    tags:
      - rust-book
      - ch16
      - send-sync
      - comparison
    provenance:
      source_file: ch16_send_sync.yaml
      chapter: "Chapter 16: Fearless Concurrency"
      section: "Extensible Concurrency with Send and Sync"
      source: rust-book/src/ch16-04-extensible-concurrency-sync-and-send.md
      card_type: comparison
      compile_status: concept_only
  - id: rust-book-ch16-send-sync-008
    type: prompt_response
    prompt: |
      Why are `Send` and `Sync` called marker traits?
    answer: |
      They have no methods to implement; their purpose is to mark types as satisfying thread-safety guarantees.
    tags:
      - rust-book
      - ch16
      - send-sync
      - concept_boundary
    provenance:
