- id: rust-book-ch04-understanding-ownership-002
  chapter: "Chapter 4: Understanding Ownership"
  section: "Understanding Ownership"
  source: "rust-book/src/ch04-00-understanding-ownership.md"
  card_type: comparison
  front: |
    What makes ownership different from garbage collection?
  back: |
    Ownership uses compile-time rules and deterministic cleanup when values go out of scope. Garbage collection finds unused memory at runtime.
  compile_status: concept_only
