  chapter: "Chapter 4: Understanding Ownership"
  section: "Understanding Ownership"
  source: "rust-book/src/ch04-00-understanding-ownership.md"
  card_type: definition
  front: |
    What problem is Rust ownership designed to solve?
  back: |
    It lets Rust manage memory safety without a garbage collector by enforcing compile-time rules about who owns data and when it is dropped.
  compile_status: concept_only
