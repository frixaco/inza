- id: rust-book-ch01-hello-world-001
  chapter: "Chapter 1: Getting Started"
  section: "Hello, World!"
  source: "rust-book/src/ch01-02-hello-world.md"
  card_type: syntax
  front: |
    What is the minimal Rust `main` function that prints `Hello, world!`?
  back: |
    ```rust
    fn main() {
        println!("Hello, world!");
    }
    ```
    `main` is the program entry point, and `println!` is a macro call.
  compile_status: compiles
  tags:
