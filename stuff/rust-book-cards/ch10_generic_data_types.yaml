- id: rust-book-ch10-generic-data-types-005
  chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
  section: "Generic Data Types"
  source: "rust-book/src/ch10-01-syntax.md"
  card_type: definition
  front: |
    What does monomorphization do to generic code at compile time?
  back: |
    The compiler turns generic code into concrete code for the types actually used, so generics do not add runtime dispatch cost by themselves.
  compile_status: concept_only
  tags:
    - rust-book
    - ch10
    - generic-data-types
    - definition
- id: rust-book-ch10-generic-data-types-006
  chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
  section: "Generic Data Types"
  source: "rust-book/src/ch10-01-syntax.md"
  card_type: syntax
  front: |
    Where does a generic type parameter go in a function definition?
  back: |
    Put it in angle brackets between the function name and the parameter list:
    ```rust
    fn largest<T>(list: &[T]) -> &T {
        &list[0]
    }
    ```
