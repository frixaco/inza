  section: "Generic Data Types"
  source: "rust-book/src/ch10-01-syntax.md"
  card_type: syntax
  front: |
    What is the generic enum shape of `Option<T>`?
  back: |
    ```rust
    enum Option<T> {
        Some(T),
        None,
    }
    ```
    `Some` stores one value of type `T`; `None` stores no value.
