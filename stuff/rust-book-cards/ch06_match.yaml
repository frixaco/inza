- id: rust-book-ch06-match-001
  chapter: "Chapter 6: Enums and Pattern Matching"
  section: "The match Control Flow Construct"
  source: "rust-book/src/ch06-02-match.md"
  card_type: definition
  front: |
    What relationship does a `match` expression test against its arms?
  back: |
    It compares a value against patterns and runs the code for the first matching arm.
