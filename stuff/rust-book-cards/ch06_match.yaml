- id: rust-book-ch06-match-008
  chapter: "Chapter 6: Enums and Pattern Matching"
  section: "The match Control Flow Construct"
  source: "rust-book/src/ch06-02-match.md"
  card_type: syntax
  front: |
    When does a `match` arm body need curly braces?
  back: |
    ```rust
    let cents = match "penny" {
        "penny" => {
            println!("Lucky penny!");
            1
        }
        _ => 0,
    };
    ```
    Use braces when the arm body has multiple statements; the block's last expression is the arm value.
  compile_status: compiles
  tags:
    - rust-book
    - ch06
    - match
    - syntax
- id: rust-book-ch06-match-009
  chapter: "Chapter 6: Enums and Pattern Matching"
  section: "The match Control Flow Construct"
  source: "rust-book/src/ch06-02-match.md"
  card_type: prediction
  front: |
    What happens if a catch-all pattern appears before more specific `match` arms?
  back: |
    The catch-all matches first, so later arms are unreachable. Rust warns about arms that can never run.
  compile_status: concept_only
  tags:
    - rust-book
    - ch06
    - match
    - prediction
- id: rust-book-ch06-match-010
  chapter: "Chapter 6: Enums and Pattern Matching"
  section: "The match Control Flow Construct"
  source: "rust-book/src/ch06-02-match.md"
  card_type: syntax
  front: |
    What does `_ => ()` mean in a `match` arm?
  back: |
    Match any remaining value, bind nothing, and run no meaningful code because the arm evaluates to the unit value `()`.
  compile_status: concept_only
  tags:
