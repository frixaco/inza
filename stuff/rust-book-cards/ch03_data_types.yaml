- id: rust-book-ch03-data-types-011
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Data Types"
  source: "rust-book/src/ch03-02-data-types.md"
  card_type: comparison
  front: |
    How does integer overflow differ between debug and release builds?
  back: |
    Debug builds check for integer overflow and panic. Release builds use two's-complement wrapping unless you choose explicit overflow-handling methods.
  compile_status: concept_only
  tags:
    - rust-book
    - ch03
    - data-types
    - comparison
- id: rust-book-ch03-data-types-012
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Data Types"
  source: "rust-book/src/ch03-02-data-types.md"
  card_type: comparison
  front: |
    Which primitive floating-point type does Rust default to, and why does the book say it is a good default?
  back: |
    Rust defaults to `f64`; on modern CPUs it is roughly the same speed as `f32` but has more precision.
  compile_status: concept_only
