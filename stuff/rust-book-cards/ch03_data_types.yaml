- id: rust-book-ch03-data-types-003
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Data Types"
  source: "rust-book/src/ch03-02-data-types.md"
  card_type: prediction
  front: |
    What happens when this code runs?
    
    ```rust
    fn main() {
        let a = [1, 2, 3];
        println!("{}", a[1]);
    }
    ```
  back: |
    It prints `2`. Array indexes are zero-based.
