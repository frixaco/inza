- id: rust-book-ch03-data-types-018
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Data Types"
  source: "rust-book/src/ch03-02-data-types.md"
  card_type: syntax
  front: |
    How do you access tuple fields by index?
  back: |
    ```rust
    let tup = (500, 6.4, 1);
    let five_hundred = tup.0;
    let six_point_four = tup.1;
    let one = tup.2;
    ```
    Tuple field indexes are zero-based.
