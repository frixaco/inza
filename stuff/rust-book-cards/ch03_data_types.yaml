- id: rust-book-ch03-data-types-009
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Data Types"
  source: "rust-book/src/ch03-02-data-types.md"
  card_type: concept_boundary
  front: |
    When are `usize` and `isize` especially appropriate?
  back: |
    They are architecture-sized integers, and `usize` is the main type used for indexing collections.
