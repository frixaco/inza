- id: rust-book-ch19-pattern-syntax-022
  chapter: "Chapter 19: Patterns and Matching"
  section: "Pattern Syntax"
  source: "rust-book/src/ch19-03-pattern-syntax.md"
  card_type: diagnostic
  front: |
    Why is this use of `..` ambiguous?
    
    ```rust
    fn main() {
        let numbers = (2, 4, 8, 16, 32);
        match numbers {
            (first, .., second, ..) => {
                println!("{first}, {second}");
            }
        }
    }
    ```
  back: |
    Rust cannot know how many tuple elements the first `..` should ignore versus the second `..`; `..` must be unambiguous in a pattern.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch19
    - pattern-syntax
    - diagnostic
