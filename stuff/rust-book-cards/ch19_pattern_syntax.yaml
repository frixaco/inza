- id: rust-book-ch19-pattern-syntax-003
  chapter: "Chapter 19: Patterns and Matching"
  section: "Pattern Syntax"
  source: "rust-book/src/ch19-03-pattern-syntax.md"
  card_type: syntax
  front: |
    What does `_` mean in a pattern?
  back: |
    ```rust
    let value = Some(5);
    match value {
        Some(_) => println!("got some value"),
        None => println!("got nothing"),
    }
    ```
    It matches any value without binding it.
  compile_status: compiles
  tags:
