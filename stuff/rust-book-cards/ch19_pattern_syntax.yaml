- id: rust-book-ch19-pattern-syntax-001
  chapter: "Chapter 19: Patterns and Matching"
  section: "Pattern Syntax"
  source: "rust-book/src/ch19-03-pattern-syntax.md"
  card_type: syntax
  front: |
    What does `1 | 2` mean in a pattern?
  back: |
    ```rust
    let x = 1;
    match x {
        1 | 2 => println!("one or two"),
        _ => println!("something else"),
    }
    ```
    It matches either `1` or `2`.
  compile_status: compiles
  tags:
    - rust-book
    - ch19
    - pattern-syntax
    - syntax
- id: rust-book-ch19-pattern-syntax-002
  chapter: "Chapter 19: Patterns and Matching"
  section: "Pattern Syntax"
  source: "rust-book/src/ch19-03-pattern-syntax.md"
  card_type: syntax
  front: |
    What does `1..=5` mean in a pattern?
  back: |
    ```rust
    let x = 3;
    match x {
        1..=5 => println!("one through five"),
        _ => println!("something else"),
    }
    ```
    It matches any value in the inclusive range from 1 through 5.
  compile_status: compiles
  tags:
