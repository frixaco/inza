- id: rust-book-ch19-pattern-syntax-019
  chapter: "Chapter 19: Patterns and Matching"
  section: "Pattern Syntax"
  source: "rust-book/src/ch19-03-pattern-syntax.md"
  card_type: syntax
  front: |
    What does nested enum destructuring look like?
  back: |
    ```rust
