- id: rust-book-ch10-traits-004
  chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
  section: "Defining Shared Behavior with Traits"
  source: "rust-book/src/ch10-02-traits.md"
  card_type: comparison
  front: |
    What is the difference between `impl Trait` in a parameter and a named generic type parameter?
  back: |
    `impl Trait` is concise for short bounds. A named generic is needed when multiple parameters must have the same concrete type or when bounds get complex.
