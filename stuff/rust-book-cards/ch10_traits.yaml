- id: rust-book-ch10-traits-003
  chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
  section: "Defining Shared Behavior with Traits"
  source: "rust-book/src/ch10-02-traits.md"
  card_type: invariant
  front: |
    What is the orphan rule for trait implementations?
  back: |
    You can implement a trait for a type only if the trait or the type is local to your crate.
