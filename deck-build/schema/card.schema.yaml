required_fields:
  - id
  - chapter
  - section
  - source_file
  - source_version
  - source_concept
  - requirement_refs
  - card_type
  - difficulty
  - compile_status
  - front
  - back
  - tags

card_type:
  allowed:
    - syntax
    - prediction
    - diagnostic
    - transformation
    - concept_boundary
    - api_recall
    - invariant
    - comparison
    - project_architecture

difficulty:
  allowed:
    - foundation
    - intermediate
    - advanced
    - project
    - appendix

compile_status:
  allowed:
    - compiles
    - compile_fail
    - concept_only
    - shell

rules:
  - Every card must be source-mapped to a Rust Book file.
  - Every card must include the Rust Book source version used to build it.
  - Every card must name the source concept, listing, command, or local idea it teaches.
  - Every card must include at least one CH-* or Appendix requirement ref and at least one MR-* requirement ref.
  - Complete Rust snippets must be compile-validated unless compile_status is compile_fail.
  - compile_fail cards must state the expected failure rule in the back field.
  - front must not be empty.
  - back must include the reason or rule, not only the result.
  - tags must include rust-book, chapter, section, card type, difficulty, and compile status.
