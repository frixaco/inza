- id: rust-book-ch08-strings-003
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: prediction
  front: |
    What happens to `s1` after `let s3 = s1 + &s2;`?
  back: |
    `s1` is moved into the `+` operation and cannot be used afterward. The operator takes ownership of the left-hand `String`; it borrows the right-hand string slice.
  compile_status: concept_only
  tags:
    - rust-book
    - ch08
    - strings
    - prediction
- id: rust-book-ch08-strings-004
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: misconception
  front: |
    Why does Rust not allow direct indexing into a `String` by integer?
  back: |
    A `String` is UTF-8 bytes, and an integer index may not correspond to a character boundary. Indexing would be ambiguous or unsafe.
  compile_status: concept_only
