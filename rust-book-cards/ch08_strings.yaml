- id: rust-book-ch08-strings-001
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: comparison
  front: |
    What is the practical boundary between `String` and `&str`?
  back: |
    `String` owns growable UTF-8 text. `&str` borrows UTF-8 text and is often the right parameter type when ownership is not needed.
  compile_status: concept_only
  tags:
    - rust-book
    - ch08
    - strings
    - comparison
- id: rust-book-ch08-strings-002
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: api_recall
  front: |
    Which methods append text to a `String` without taking ownership of the whole string?
  back: |
    `push_str(&str)` appends a string slice; `push(char)` appends one character.
  compile_status: concept_only
  tags:
