- id: rust-book-ch08-strings-016
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: diagnostic
  front: |
    Why does `let s3 = s1 + &s2; println!("{s1}");` fail?
  back: |
    ```rust
    fn main() {
        let s1 = String::from("hello");
        let s2 = String::from("world");
        let _s3 = s1 + &s2;
        println!("{s1}");
    }
    ```
    The `+` operator for strings takes ownership of the left-hand `String`, so `s1` is moved into the addition and cannot be used afterward.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch08
    - strings
    - diagnostic
- id: rust-book-ch08-strings-017
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: syntax
  front: |
    What syntax combines several strings without taking ownership of them?
  back: |
    ```rust
    fn main() {
        let s1 = String::from("tic");
        let s2 = String::from("tac");
        let s3 = String::from("toe");
        let s = format!("{s1}-{s2}-{s3}");
        println!("{s}");
    }
    ```
    `format!` returns a new `String`.
  compile_status: compiles
  tags:
    - rust-book
    - ch08
    - strings
    - syntax
