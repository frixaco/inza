  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: comparison
  front: |
    What is the difference between bytes, scalar values, and grapheme clusters in Rust string discussion?
  back: |
    Bytes are UTF-8 storage units, scalar values are Rust `char` values, and grapheme clusters are user-perceived characters that may contain multiple scalar values.
