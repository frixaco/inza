- id: rust-book-ch08-strings-010
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: diagnostic
  front: |
    Why does this fail?
    
    ```rust
    fn main() {
        let hello = "Здравствуйте";
        let answer = &hello[0];
    }
    ```
  back: |
    String indexing would be byte-based, and byte 0 alone may not be a valid Unicode scalar value. Rust rejects string indexing to avoid misleading results.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch08
    - strings
    - diagnostic
- id: rust-book-ch08-strings-011
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: concept_boundary
  front: |
    When is slicing a string with a byte range acceptable?
  back: |
    Only when the range starts and ends on valid UTF-8 character boundaries. Slicing through the middle of a multibyte character panics.
  compile_status: concept_only
  tags:
    - rust-book
    - ch08
    - strings
    - concept_boundary
- id: rust-book-ch08-strings-012
  chapter: "Chapter 8: Common Collections"
  section: "Storing UTF-8 Encoded Text with Strings"
  source: "rust-book/src/ch08-02-strings.md"
  card_type: api_recall
  front: |
    Which methods let you iterate over a string as Unicode scalar values or as bytes?
  back: |
    ```rust
    for c in "Зд".chars() {
        println!("{c}");
    }

    for b in "Зд".bytes() {
        println!("{b}");
    }
    ```
    Use `.chars()` for Unicode scalar values and `.bytes()` for raw bytes.
  compile_status: compiles
  tags:
    - rust-book
    - ch08
    - strings
    - api_recall
