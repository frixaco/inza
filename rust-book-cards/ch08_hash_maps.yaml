- id: rust-book-ch08-hash-maps-012
  chapter: "Chapter 8: Common Collections"
  section: "Storing Keys with Associated Values in Hash Maps"
  source: "rust-book/src/ch08-03-hash-maps.md"
  card_type: syntax
  front: |
    How can you turn a missing hash map lookup into a default value?
  back: |
    ```rust
    use std::collections::HashMap;

    fn main() {
        let mut scores = HashMap::new();
        scores.insert(String::from("Blue"), 10);

        let team_name = String::from("Blue");
        let score = scores.get(&team_name).copied().unwrap_or(0);
        println!("{score}");
    }
    ```
    `get` returns `Option<&V>`; `copied` changes this example to `Option<i32>`.
  compile_status: compiles
  tags:
    - rust-book
    - ch08
    - hash-maps
    - syntax
- id: rust-book-ch08-hash-maps-013
  chapter: "Chapter 8: Common Collections"
  section: "Storing Keys with Associated Values in Hash Maps"
  source: "rust-book/src/ch08-03-hash-maps.md"
  card_type: syntax
  front: |
    What syntax iterates over key-value pairs in a `HashMap`?
  back: |
    ```rust
    use std::collections::HashMap;

    fn main() {
        let mut scores = HashMap::new();
        scores.insert(String::from("Blue"), 10);
        scores.insert(String::from("Yellow"), 50);

        for (key, value) in &scores {
            println!("{key}: {value}");
        }
    }
    ```
    The iteration order is arbitrary.
  compile_status: compiles
  tags:
    - rust-book
    - ch08
    - hash-maps
