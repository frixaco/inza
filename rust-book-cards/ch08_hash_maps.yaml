- id: rust-book-ch08-hash-maps-005
  chapter: "Chapter 8: Common Collections"
  section: "Storing Keys with Associated Values in Hash Maps"
  source: "rust-book/src/ch08-03-hash-maps.md"
  card_type: concept_boundary
  front: |
    How do you update a word count stored in a `HashMap<String, i32>`?
  back: |
    ```rust
    use std::collections::HashMap;

    let text = "hello world wonderful world";
    let mut map = HashMap::new();

    for word in text.split_whitespace() {
        let count = map.entry(word).or_insert(0);
        *count += 1;
    }
    ```
    `or_insert` gives `&mut i32`, so dereferencing updates the stored value.
  compile_status: compiles
  tags:
    - rust-book
    - ch08
    - hash-maps
    - concept_boundary
