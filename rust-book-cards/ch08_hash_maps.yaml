- id: rust-book-ch08-hash-maps-003
  chapter: "Chapter 8: Common Collections"
  section: "Storing Keys with Associated Values in Hash Maps"
  source: "rust-book/src/ch08-03-hash-maps.md"
  card_type: prediction
  front: |
    What happens to owned `String` keys and values inserted into a `HashMap`?
  back: |
    ```rust
    use std::collections::HashMap;

    fn main() {
        let field_name = String::from("Favorite color");
        let field_value = String::from("Blue");
        let mut map = HashMap::new();
        map.insert(field_name, field_value);
        println!("{field_name}");
    }
    ```
    They are moved into the map. The original bindings cannot be used afterward unless the values were cloned.
