- id: rust-book-ch02-guessing-game-020
  chapter: "Chapter 2: Programming a Guessing Game"
  section: "Programming a Guessing Game"
  source: "rust-book/src/ch02-00-guessing-game-tutorial.md"
  card_type: syntax
  front: |
    What does the final invalid-input parse match look like?
  back: |
    ```rust
    loop {
        let guess = String::from("42");
        let guess: u32 = match guess.trim().parse() {
            Ok(num) => num,
            Err(_) => continue,
        };
        break;
    }
    ```
    `Ok(num)` extracts the parsed number; `Err(_)` ignores the error value and starts the next loop iteration.
  compile_status: compiles
  tags:
    - rust-book
    - ch02
    - guessing-game
    - syntax
