- id: rust-book-ch02-guessing-game-016
  chapter: "Chapter 2: Programming a Guessing Game"
  section: "Programming a Guessing Game"
  source: "rust-book/src/ch02-00-guessing-game-tutorial.md"
  card_type: diagnostic
  front: |
    Why does comparing `guess.cmp(&secret_number)` fail before parsing the guess?
  back: |
    ```rust
    fn main() {
        let guess = String::from("42");
        let secret_number = 42;
        guess.cmp(&secret_number);
    }
    ```
    `guess` is a `String` from input, while `secret_number` is an integer. `cmp` needs values of compatible types, so the input string must be parsed into a number first.
  compile_status: expected_failure
