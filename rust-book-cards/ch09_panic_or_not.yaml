- id: rust-book-ch09-panic-or-not-010
  chapter: "Chapter 9: Error Handling"
  section: "To panic! or Not to panic!"
  source: "rust-book/src/ch09-03-to-panic-or-not-to-panic.md"
  card_type: concept_boundary
  front: |
    Why are `unwrap` and `expect` often acceptable in tests?
  back: |
    A panic fails the test, which is the desired outcome when setup or an assertion prerequisite unexpectedly fails.
