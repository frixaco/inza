- id: rust-book-ch18-oo-characteristics-004
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Characteristics of Object-Oriented Languages"
  source: "rust-book/src/ch18-01-what-is-oo.md"
  card_type: definition
  front: |
    In the book's OOP discussion, what does an object combine?
  back: |
    An object combines data with behavior that operates on that data. Rust structs and enums hold data, and `impl` blocks provide methods.
