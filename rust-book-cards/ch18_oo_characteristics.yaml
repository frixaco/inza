- id: rust-book-ch18-oo-characteristics-005
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Characteristics of Object-Oriented Languages"
  source: "rust-book/src/ch18-01-what-is-oo.md"
  card_type: comparison
  front: |
    What are the two reasons the book gives for using inheritance in other languages?
  back: |
    Code reuse and subtype polymorphism. Rust uses traits, default methods, generics, and trait objects to cover those needs without struct inheritance.
  compile_status: concept_only
  tags:
    - rust-book
    - ch18
    - oo-characteristics
    - comparison
- id: rust-book-ch18-oo-characteristics-006
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Characteristics of Object-Oriented Languages"
  source: "rust-book/src/ch18-01-what-is-oo.md"
  card_type: misconception
  front: |
    Does Rust need inheritance to support polymorphism?
  back: |
    No. Rust supports polymorphism through generics and trait bounds, and it supports runtime polymorphism through trait objects.
  compile_status: concept_only
  tags:
    - rust-book
    - ch18
    - oo-characteristics
    - misconception
- id: rust-book-ch18-oo-characteristics-007
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Characteristics of Object-Oriented Languages"
  source: "rust-book/src/ch18-01-what-is-oo.md"
  card_type: concept_boundary
  front: |
    Why can inheritance reduce design flexibility according to the book?
  back: |
    Subclasses can inherit more behavior than they need, and some languages allow only single inheritance. Rust favors composition and traits to avoid those constraints.
  compile_status: concept_only
  tags:
    - rust-book
    - ch18
    - oo-characteristics
    - concept_boundary
- id: rust-book-ch18-oo-characteristics-008
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Characteristics of Object-Oriented Languages"
  source: "rust-book/src/ch18-01-what-is-oo.md"
  card_type: syntax
  front: |
    What does the book's encapsulated `AveragedCollection` structure hide?
  back: |
    ```rust
    pub struct AveragedCollection {
        list: Vec<i32>,
        average: f64,
    }
    ```
    The fields are private, so outside code cannot mutate `list` without the methods that keep `average` in sync.
  compile_status: compiles
  tags:
    - rust-book
    - ch18
    - oo-characteristics
    - syntax
- id: rust-book-ch18-oo-characteristics-009
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Characteristics of Object-Oriented Languages"
  source: "rust-book/src/ch18-01-what-is-oo.md"
  card_type: invariant
  front: |
    What invariant do `AveragedCollection::add` and `remove` preserve?
  back: |
    Whenever the list changes, the cached `average` is recalculated so `average()` returns a value consistent with the private list.
  compile_status: concept_only
