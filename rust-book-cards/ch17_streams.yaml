- id: rust-book-ch17-streams-009
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Streams: Futures in Sequence"
  source: "rust-book/src/ch17-04-streams.md"
  card_type: syntax
  front: |
    What is the essential low-level shape of a `Stream` trait?
  back: |
    ```rust
    use std::pin::Pin;
    use std::task::{Context, Poll};

    trait Stream {
        type Item;

        fn poll_next(
            self: Pin<&mut Self>,
            cx: &mut Context<'_>,
        ) -> Poll<Option<Self::Item>>;
    }
    ```
    It is like combining `Iterator`'s item sequence with `Future`'s readiness over time.
  compile_status: compiles
  tags:
    - rust-book
    - ch17
    - streams
    - syntax
