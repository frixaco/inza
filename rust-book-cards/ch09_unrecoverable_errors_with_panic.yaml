- id: rust-book-ch09-unrecoverable-errors-with-panic-001
  chapter: "Chapter 9: Error Handling"
  section: "Unrecoverable Errors with panic!"
  source: "rust-book/src/ch09-01-unrecoverable-errors-with-panic.md"
  card_type: definition
  front: |
    What runtime behavior does `panic!` trigger by default?
  back: |
    It prints an error message, unwinds and cleans up the stack by default, and exits the program. A profile can instead abort immediately.
  compile_status: concept_only
  tags:
    - rust-book
    - ch09
    - unrecoverable-errors-with-panic
    - definition
- id: rust-book-ch09-unrecoverable-errors-with-panic-002
  chapter: "Chapter 9: Error Handling"
  section: "Unrecoverable Errors with panic!"
  source: "rust-book/src/ch09-01-unrecoverable-errors-with-panic.md"
  card_type: comparison
  front: |
    What is the difference between unwinding and aborting on panic?
  back: |
    Unwinding walks back up the stack and runs cleanup. Aborting ends the process without that cleanup and can produce a smaller binary.
  compile_status: concept_only
  tags:
    - rust-book
    - ch09
    - unrecoverable-errors-with-panic
    - comparison
- id: rust-book-ch09-unrecoverable-errors-with-panic-003
  chapter: "Chapter 9: Error Handling"
  section: "Unrecoverable Errors with panic!"
  source: "rust-book/src/ch09-01-unrecoverable-errors-with-panic.md"
  card_type: prediction
  front: |
    What happens when code indexes outside a vector, such as `v[99]` for a three-element vector?
  back: |
    The program panics at runtime because bounds checking detects an invalid index.
  compile_status: concept_only
