    - diagnostic
- id: rust-book-ch09-unrecoverable-errors-with-panic-007
  chapter: "Chapter 9: Error Handling"
  section: "Unrecoverable Errors with panic!"
  source: "rust-book/src/ch09-01-unrecoverable-errors-with-panic.md"
  card_type: api_recall
  front: |
