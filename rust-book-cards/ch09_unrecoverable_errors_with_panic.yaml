- id: rust-book-ch09-unrecoverable-errors-with-panic-006
  chapter: "Chapter 9: Error Handling"
  section: "Unrecoverable Errors with panic!"
  source: "rust-book/src/ch09-01-unrecoverable-errors-with-panic.md"
  card_type: diagnostic
  front: |
    Why can a panic location point into library code instead of the line where your bug began?
  back: |
    The panic occurs where the invalid operation is detected, such as inside `Vec` indexing code. Use the backtrace to find the chain of calls from your code to the panic.
  compile_status: concept_only
  tags:
    - rust-book
    - ch09
