- id: rust-book-ch09-unrecoverable-errors-with-panic-005
  chapter: "Chapter 9: Error Handling"
  section: "Unrecoverable Errors with panic!"
  source: "rust-book/src/ch09-01-unrecoverable-errors-with-panic.md"
  card_type: syntax
  front: |
    What profile setting makes panics abort instead of unwind?
  back: |
    ```toml
    [profile.release]
    panic = 'abort'
    ```
