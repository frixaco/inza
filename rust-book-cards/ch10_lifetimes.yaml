  chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
  section: "Validating References with Lifetimes"
  source: "rust-book/src/ch10-03-lifetime-syntax.md"
  card_type: syntax
  front: |
    What is the concrete syntax for a string slice with the `'static` lifetime?
  back: |
    ```rust
    fn main() {
        let s: &'static str = "I have a static lifetime.";
        println!("{s}");
    }
    ```
