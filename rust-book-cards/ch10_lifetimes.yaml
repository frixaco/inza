  section: "Validating References with Lifetimes"
  source: "rust-book/src/ch10-03-lifetime-syntax.md"
  card_type: syntax
  front: |
    What does a function signature combining lifetimes, generics, and trait bounds look like?
  back: |
    ```rust
    use std::fmt::Display;

    fn longest_with_an_announcement<'a, T>(
        x: &'a str,
