- id: rust-book-ch10-lifetimes-017
  chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
  section: "Validating References with Lifetimes"
  source: "rust-book/src/ch10-03-lifetime-syntax.md"
  card_type: invariant
  front: |
    When a function returns a reference, what must its output lifetime be related to?
  back: |
    The output lifetime must be tied to the lifetime of at least one input reference. If the returned reference points to data created inside the function, it would dangle after the function returns.
  compile_status: concept_only
  tags:
    - rust-book
    - ch10
    - lifetimes
    - invariant
- id: rust-book-ch10-lifetimes-018
  chapter: "Chapter 10: Generic Types, Traits, and Lifetimes"
  section: "Validating References with Lifetimes"
  source: "rust-book/src/ch10-03-lifetime-syntax.md"
  card_type: prediction
  front: |
    What does `'a` become at a call site for `fn longest<'a>(x: &'a str, y: &'a str) -> &'a str`?
  back: |
    It becomes the smaller overlapping lifetime of `x` and `y`, because the returned reference must be valid no longer than both inputs are valid.
  compile_status: concept_only
  tags:
