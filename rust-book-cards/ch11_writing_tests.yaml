- id: rust-book-ch11-writing-tests-003
  chapter: "Chapter 11: Writing Automated Tests"
  section: "How to Write Tests"
  source: "rust-book/src/ch11-01-writing-tests.md"
  card_type: comparison
  front: |
    What is the difference between `assert_eq!` and `assert_ne!`?
  back: |
    ```rust
    assert_eq!(2 + 2, 4);
    assert_ne!(2 + 2, 5);
    ```
    `assert_eq!` requires two values to be equal; `assert_ne!` requires them to be different. Both print the compared values on failure when possible.
  compile_status: compiles
  tags:
    - rust-book
    - ch11
    - writing-tests
    - comparison
- id: rust-book-ch11-writing-tests-004
  chapter: "Chapter 11: Writing Automated Tests"
  section: "How to Write Tests"
  source: "rust-book/src/ch11-01-writing-tests.md"
  card_type: syntax
  front: |
    How do you test that code should panic?
  back: |
    ```rust
    #[test]
    #[should_panic(expected = "less than or equal to 100")]
    fn greater_than_100() {
        panic!("Guess value must be less than or equal to 100, got 200");
    }
    ```
    Add `#[should_panic]` above the test, optionally with `expected = "..."` to require part of the panic message.
  compile_status: compiles
  tags:
    - rust-book
    - ch11
    - writing-tests
    - syntax
- id: rust-book-ch11-writing-tests-005
  chapter: "Chapter 11: Writing Automated Tests"
  section: "How to Write Tests"
  source: "rust-book/src/ch11-01-writing-tests.md"
  card_type: concept_boundary
  front: |
    When should a test return `Result<(), E>` instead of using `unwrap`?
  back: |
    ```rust
    #[test]
    fn it_works() -> Result<(), String> {
        if 2 + 2 == 4 { Ok(()) } else { Err(String::from("bad math")) }
    }
    ```
    When using `?` makes setup or checks clearer. Return `Ok(())` for success and an error for failure.
  compile_status: compiles
  tags:
    - rust-book
    - ch11
    - writing-tests
    - concept_boundary
