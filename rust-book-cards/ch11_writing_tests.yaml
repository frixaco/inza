- id: rust-book-ch11-writing-tests-002
  chapter: "Chapter 11: Writing Automated Tests"
  section: "How to Write Tests"
  source: "rust-book/src/ch11-01-writing-tests.md"
  card_type: concept_boundary
  front: |
    Which macro checks that a Boolean condition is true in a test?
  back: |
    ```rust
    #[test]
    fn larger_can_hold_smaller() {
        assert!(8 > 5);
    }
    ```
    `assert!(condition)`. It panics if the condition is false.
  compile_status: compiles
