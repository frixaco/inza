- id: rust-book-ch17-async-traits-007
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "A Closer Look at the Traits for Async"
  source: "rust-book/src/ch17-05-traits-for-async.md"
  card_type: comparison
  front: |
    What is the difference between `Poll::Ready(value)` and `Poll::Pending`?
  back: |
    `Ready(value)` means the future has completed and produced its output. `Pending` means the future is not ready yet and should arrange to wake the executor when progress may be possible.
  compile_status: concept_only
  tags:
    - rust-book
    - ch17
    - async-traits
    - comparison
- id: rust-book-ch17-async-traits-008
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "A Closer Look at the Traits for Async"
  source: "rust-book/src/ch17-05-traits-for-async.md"
  card_type: invariant
  front: |
    After a future returns `Poll::Ready`, should executors keep polling it by default?
  back: |
    No. Futures are generally considered complete after `Ready`; polling again is not assumed to be valid unless that future's documentation says so.
  compile_status: concept_only
  tags:
    - rust-book
    - ch17
    - async-traits
    - invariant
- id: rust-book-ch17-async-traits-009
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "A Closer Look at the Traits for Async"
  source: "rust-book/src/ch17-05-traits-for-async.md"
  card_type: diagnostic
  front: |
    Why does storing heterogeneous async blocks in a vector often require pinning boxed futures?
  back: |
    Each async block has its own anonymous future type, and some futures must not move after being polled. `Pin<Box<dyn Future<Output = T>>>` gives a common trait-object type while keeping each future pinned in place.
  compile_status: concept_only
  tags:
    - rust-book
    - ch17
    - async-traits
    - diagnostic
- id: rust-book-ch17-async-traits-010
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "A Closer Look at the Traits for Async"
  source: "rust-book/src/ch17-05-traits-for-async.md"
  card_type: misconception
  front: |
    Do you usually have to manually pin a future before writing `.await`?
  back: |
    No. Awaiting a future directly handles the required pinning for that await expression. Manual pinning becomes visible when storing or polling futures yourself.
  compile_status: concept_only
  tags:
    - rust-book
    - ch17
