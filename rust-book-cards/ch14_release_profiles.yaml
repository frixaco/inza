- id: rust-book-ch14-release-profiles-003
  chapter: "Chapter 14: More about Cargo and Crates.io"
  section: "Customizing Builds with Release Profiles"
  source: "rust-book/src/ch14-01-release-profiles.md"
  card_type: syntax
  front: |
    How do you override the optimization level for the release profile?
  back: |
    ```toml
    [profile.release]
    opt-level = 3
    ```
