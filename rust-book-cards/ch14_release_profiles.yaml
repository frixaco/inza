- id: rust-book-ch14-release-profiles-001
  chapter: "Chapter 14: More about Cargo and Crates.io"
  section: "Customizing Builds with Release Profiles"
  source: "rust-book/src/ch14-01-release-profiles.md"
  card_type: definition
  front: |
    What build settings does a Cargo release profile collect?
  back: |
    A named set of compiler settings that controls how Cargo builds code, such as `dev` and `release`.
