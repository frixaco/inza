- id: rust-book-ch11-running-tests-003
  chapter: "Chapter 11: Writing Automated Tests"
  section: "Controlling How Tests Are Run"
  source: "rust-book/src/ch11-02-running-tests.md"
  card_type: syntax
  front: |
    What attribute marks an expensive test to skip by default?
  back: |
    `#[ignore]`; run ignored tests with `cargo test -- --ignored`.
