  chapter: "Chapter 11: Writing Automated Tests"
  section: "Controlling How Tests Are Run"
  source: "rust-book/src/ch11-02-running-tests.md"
  card_type: api_recall
  front: |
    How do you run one named test or a set of tests whose names contain a string?
