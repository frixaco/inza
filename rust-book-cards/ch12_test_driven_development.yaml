- id: rust-book-ch12-test-driven-development-005
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Adding Functionality with Test Driven Development"
  source: "rust-book/src/ch12-04-testing-the-librarys-functionality.md"
  card_type: syntax
  front: |
    What lifetime shape does the book use for `search` returning borrowed lines?
  back: |
    ```rust
    pub fn search<'a>(query: &str, contents: &'a str) -> Vec<&'a str> {
        let mut results = Vec::new();

        for line in contents.lines() {
            if line.contains(query) {
                results.push(line);
            }
        }

        results
    }
    ```
    The returned line slices are tied to `contents`, not to `query`.
  compile_status: compiles
  tags:
    - rust-book
    - ch12
    - test-driven-development
    - syntax
