- id: rust-book-ch03-functions-011
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Functions"
  source: "rust-book/src/ch03-03-how-functions-work.md"
  card_type: concept_boundary
  front: |
    When does the book use explicit `return` versus an implicit final expression?
  back: |
    `return value;` can return early from a function, but most Rust functions return the final expression implicitly.
  compile_status: concept_only
