- id: rust-book-ch14-publishing-crates-009
  chapter: "Chapter 14: More about Cargo and Crates.io"
  section: "Publishing a Crate to Crates.io"
  source: "rust-book/src/ch14-02-publishing-to-crates-io.md"
  card_type: project_architecture
  front: |
    Why can `pub use` improve a published crate's public API?
  back: |
    ```rust
    mod kinds {
        pub enum PrimaryColor {
            Red,
            Yellow,
            Blue,
        }
    }

    pub use kinds::PrimaryColor;
    ```
    It can re-export important items at paths that are easier for users to find, without forcing the internal module hierarchy to match the public API.
  compile_status: compiles
  tags:
    - rust-book
    - ch14
    - publishing-crates
    - project_architecture
