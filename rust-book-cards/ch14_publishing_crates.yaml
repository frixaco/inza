- id: rust-book-ch14-publishing-crates-012
  chapter: "Chapter 14: More about Cargo and Crates.io"
  section: "Publishing a Crate to Crates.io"
  source: "rust-book/src/ch14-02-publishing-to-crates-io.md"
  card_type: concept_boundary
  front: |
    Can a published crates.io version be overwritten?
  back: |
    No. Once a crate version is published, that version is permanent to preserve reproducible builds for dependents.
