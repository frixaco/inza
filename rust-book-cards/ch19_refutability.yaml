- id: rust-book-ch19-refutability-001
  chapter: "Chapter 19: Patterns and Matching"
  section: "Refutability: Whether a Pattern Might Fail to Match"
  source: "rust-book/src/ch19-02-refutability.md"
  card_type: definition
  front: |
    What kind of pattern is irrefutable for a type?
  back: |
    A pattern that matches every possible value of the type, such as `x` or `(x, y)` for a two-tuple.
  compile_status: concept_only
  tags:
    - rust-book
    - ch19
    - refutability
    - definition
- id: rust-book-ch19-refutability-002
  chapter: "Chapter 19: Patterns and Matching"
  section: "Refutability: Whether a Pattern Might Fail to Match"
  source: "rust-book/src/ch19-02-refutability.md"
  card_type: definition
  front: |
    What kind of pattern is refutable for a type?
  back: |
    A pattern that might not match some possible values, such as `Some(x)` for `Option<T>`.
  compile_status: concept_only
  tags:
    - rust-book
    - ch19
    - refutability
    - definition
- id: rust-book-ch19-refutability-003
  chapter: "Chapter 19: Patterns and Matching"
  section: "Refutability: Whether a Pattern Might Fail to Match"
  source: "rust-book/src/ch19-02-refutability.md"
  card_type: diagnostic
  front: |
    Why does `let Some(x) = some_option_value;` fail for `Option<T>`?
  back: |
    `Some(x)` is refutable because the value might be `None`. Use `if let`, `let...else`, or `match`.
  compile_status: concept_only
  tags:
    - rust-book
    - ch19
    - refutability
    - diagnostic
- id: rust-book-ch19-refutability-004
  chapter: "Chapter 19: Patterns and Matching"
  section: "Refutability: Whether a Pattern Might Fail to Match"
  source: "rust-book/src/ch19-02-refutability.md"
  card_type: misconception
  front: |
    Should `if let x = 5` be used for an irrefutable pattern?
  back: |
    No. It is allowed with a warning because the pattern always matches, so a plain `let` is clearer.
  compile_status: concept_only
  tags:
    - rust-book
    - ch19
    - refutability
    - misconception
- id: rust-book-ch19-refutability-005
  chapter: "Chapter 19: Patterns and Matching"
  section: "Refutability: Whether a Pattern Might Fail to Match"
  source: "rust-book/src/ch19-02-refutability.md"
  card_type: diagnostic
  front: |
    Why does a plain `let Some(x) = value;` fail for an `Option<i32>`?
  back: |
    ```rust
    fn main() {
        let value = Some(5);
        let Some(x) = value;
    }
    ```
    `Some(x)` is refutable because the value could be `None`; plain `let` requires an irrefutable pattern.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch19
    - refutability
    - diagnostic
- id: rust-book-ch19-refutability-006
  chapter: "Chapter 19: Patterns and Matching"
  section: "Refutability: Whether a Pattern Might Fail to Match"
  source: "rust-book/src/ch19-02-refutability.md"
  card_type: transformation
  front: |
    How can `let...else` handle a refutable `Some(x)` pattern?
  back: |
    ```rust
    fn main() {
        let value = Some(5);
        let Some(x) = value else {
            return;
        };
        println!("{x}");
    }
    ```
    The `else` block handles the nonmatching case by diverging.
  compile_status: compiles
  tags:
    - rust-book
    - ch19
    - refutability
    - transformation
