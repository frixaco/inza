- id: rust-book-ch13-improving-io-project-005
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Improving Our I/O Project"
  source: "rust-book/src/ch13-03-improving-our-io-project.md"
  card_type: syntax
  front: |
    What signature does the book use for `Config::build` after switching to an argument iterator?
  back: |
    ```rust
    struct Config {
        query: String,
        file_path: String,
    }

    impl Config {
        pub fn build(mut args: impl Iterator<Item = String>) -> Result<Config, &'static str> {
            args.next();

            let query = args.next().ok_or("Didn't get a query string")?;
            let file_path = args.next().ok_or("Didn't get a file path")?;

            Ok(Config { query, file_path })
        }
    }
    ```
    The iterator is mutable because calling `next` advances it.
  compile_status: compiles
  tags:
    - rust-book
    - ch13
    - improving-io-project
    - syntax
