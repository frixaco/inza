- id: rust-book-ch15-refcell-interior-mutability-012
  chapter: "Chapter 15: Smart Pointers"
  section: "RefCell<T> and the Interior Mutability Pattern"
  source: "rust-book/src/ch15-05-interior-mutability.md"
  card_type: prediction
  front: |
    What happens if you call `borrow_mut` twice on the same `RefCell<T>` while the first mutable borrow is still active?
  back: |
    It panics at runtime with a borrow error.
    ```rust
    use std::cell::RefCell;

    fn main() {
        let value = RefCell::new(5);
        let one_borrow = value.borrow_mut();
        let two_borrow = value.borrow_mut();
    }
    ```
  compile_status: compiles
