- id: rust-book-ch15-refcell-interior-mutability-011
  chapter: "Chapter 15: Smart Pointers"
  section: "RefCell<T> and the Interior Mutability Pattern"
  source: "rust-book/src/ch15-05-interior-mutability.md"
  card_type: syntax
  front: |
    What does mutating a `RefCell<Vec<String>>` through `&self` look like?
  back: |
    ```rust
    use std::cell::RefCell;

    struct MockMessenger {
        sent_messages: RefCell<Vec<String>>,
    }

    impl MockMessenger {
        fn send(&self, message: &str) {
            self.sent_messages.borrow_mut().push(String::from(message));
        }
    }
    ```
    `borrow_mut` returns a runtime-checked mutable borrow of the inner vector.
  compile_status: compiles
