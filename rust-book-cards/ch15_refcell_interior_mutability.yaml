- id: rust-book-ch15-refcell-interior-mutability-013
  chapter: "Chapter 15: Smart Pointers"
  section: "RefCell<T> and the Interior Mutability Pattern"
  source: "rust-book/src/ch15-05-interior-mutability.md"
  card_type: syntax
  front: |
    What does `Rc<RefCell<i32>>` shared mutation look like?
  back: |
    ```rust
    use std::cell::RefCell;
    use std::rc::Rc;

    fn main() {
        let value = Rc::new(RefCell::new(5));
        let a = Rc::clone(&value);
        let b = Rc::clone(&value);

        *value.borrow_mut() += 10;

        assert_eq!(*a.borrow(), 15);
        assert_eq!(*b.borrow(), 15);
    }
    ```
    `Rc` shares ownership; `RefCell` permits checked mutation of the shared value.
  compile_status: compiles
  tags:
    - rust-book
    - ch15
    - refcell-interior-mutability
    - syntax
