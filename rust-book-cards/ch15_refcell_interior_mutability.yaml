- id: rust-book-ch15-refcell-interior-mutability-004
  chapter: "Chapter 15: Smart Pointers"
  section: "RefCell<T> and the Interior Mutability Pattern"
  source: "rust-book/src/ch15-05-interior-mutability.md"
  card_type: api_recall
  front: |
    Which methods borrow from a `RefCell<T>`?
  back: |
    ```rust
    use std::cell::RefCell;

    let value = RefCell::new(5);
    assert_eq!(*value.borrow(), 5);
    *value.borrow_mut() += 1;
    assert_eq!(*value.borrow(), 6);
    ```
    `borrow()` returns `Ref<T>` for immutable access; `borrow_mut()` returns `RefMut<T>` for mutable access.
  compile_status: compiles
  tags:
