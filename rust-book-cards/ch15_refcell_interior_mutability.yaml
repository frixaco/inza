- id: rust-book-ch15-refcell-interior-mutability-002
  chapter: "Chapter 15: Smart Pointers"
  section: "RefCell<T> and the Interior Mutability Pattern"
  source: "rust-book/src/ch15-05-interior-mutability.md"
  card_type: comparison
  front: |
    What is the difference between `Box<T>`, `Rc<T>`, and `RefCell<T>`?
  back: |
    `Box<T>` gives single ownership with compile-time borrowing. `Rc<T>` gives multiple ownership with compile-time immutable borrowing. `RefCell<T>` gives single ownership with runtime-checked borrowing and possible mutation through shared references.
  compile_status: concept_only
  tags:
    - rust-book
    - ch15
    - refcell-interior-mutability
    - comparison
