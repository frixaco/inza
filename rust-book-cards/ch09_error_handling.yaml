- id: rust-book-ch09-error-handling-001
  chapter: "Chapter 9: Error Handling"
  section: "Error Handling"
  source: "rust-book/src/ch09-00-error-handling.md"
  card_type: comparison
  front: |
    What is the boundary between `panic!` and `Result`?
  back: |
    Use `panic!` for unrecoverable bugs or invalid states. Use `Result` when failure is expected and callers should decide how to recover.
  compile_status: concept_only
