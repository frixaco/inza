- id: rust-book-ch09-error-handling-002
  chapter: "Chapter 9: Error Handling"
  section: "Error Handling"
  source: "rust-book/src/ch09-00-error-handling.md"
  card_type: definition
  front: |
    What are Rust's two broad categories of errors in the Rust Book?
  back: |
    Recoverable errors, represented with `Result<T, E>`, and unrecoverable errors, represented by panicking.
