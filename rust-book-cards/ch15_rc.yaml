- id: rust-book-ch15-rc-001
  chapter: "Chapter 15: Smart Pointers"
  section: "Rc<T>, the Reference Counted Smart Pointer"
  source: "rust-book/src/ch15-04-rc.md"
  card_type: definition
  front: |
    What ownership pattern does `Rc<T>` enable?
  back: |
    Multiple owners of the same heap allocation in single-threaded code by keeping a reference count.
