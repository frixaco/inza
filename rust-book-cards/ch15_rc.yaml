- id: rust-book-ch15-rc-004
  chapter: "Chapter 15: Smart Pointers"
  section: "Rc<T>, the Reference Counted Smart Pointer"
  source: "rust-book/src/ch15-04-rc.md"
  card_type: concept_boundary
  front: |
    Why is `Rc<T>` only for single-threaded scenarios?
  back: |
    Its reference count updates are not thread-safe. Use `Arc<T>` when ownership must be shared across threads.
