- id: rust-book-ch15-rc-006
  chapter: "Chapter 15: Smart Pointers"
  section: "Rc<T>, the Reference Counted Smart Pointer"
  source: "rust-book/src/ch15-04-rc.md"
  card_type: prediction
  front: |
    What happens to an `Rc<T>` strong count when an `Rc<T>` clone goes out of scope?
  back: |
    Its `Drop` implementation decrements the strong count automatically. When the strong count reaches zero, the inner value is cleaned up.
  compile_status: concept_only
  tags:
    - rust-book
    - ch15
    - rc
    - prediction
- id: rust-book-ch15-rc-007
  chapter: "Chapter 15: Smart Pointers"
  section: "Rc<T>, the Reference Counted Smart Pointer"
  source: "rust-book/src/ch15-04-rc.md"
  card_type: concept_boundary
  front: |
    Does `Rc<T>` by itself allow mutation through multiple owners?
  back: |
    No. `Rc<T>` gives shared ownership for reading. Combine `Rc<T>` with `RefCell<T>` when single-threaded shared mutation is needed.
  compile_status: concept_only
  tags:
    - rust-book
    - ch15
    - rc
    - concept_boundary
- id: rust-book-ch15-rc-008
  chapter: "Chapter 15: Smart Pointers"
  section: "Rc<T>, the Reference Counted Smart Pointer"
  source: "rust-book/src/ch15-04-rc.md"
  card_type: syntax
  front: |
    What does a cons list that shares a tail with `Rc<T>` look like?
  back: |
    ```rust
    use std::rc::Rc;

    enum List {
        Cons(i32, Rc<List>),
        Nil,
    }

    use List::{Cons, Nil};

    fn main() {
        let a = Rc::new(Cons(5, Rc::new(Cons(10, Rc::new(Nil)))));
        let b = Cons(3, Rc::clone(&a));
        let c = Cons(4, Rc::clone(&a));
    }
    ```
    `Rc::clone(&a)` creates another owner of the same list tail.
  compile_status: compiles
  tags:
    - rust-book
    - ch15
    - rc
    - syntax
- id: rust-book-ch15-rc-009
  chapter: "Chapter 15: Smart Pointers"
  section: "Rc<T>, the Reference Counted Smart Pointer"
  source: "rust-book/src/ch15-04-rc.md"
  card_type: prediction
  front: |
    What happens to `Rc::strong_count(&a)` as clones are created and dropped?
  back: |
    ```rust
    use std::rc::Rc;

    fn main() {
        let a = Rc::new(5);
        assert_eq!(Rc::strong_count(&a), 1);
        let b = Rc::clone(&a);
        assert_eq!(Rc::strong_count(&a), 2);
        {
            let c = Rc::clone(&a);
            assert_eq!(Rc::strong_count(&a), 3);
        }
        assert_eq!(Rc::strong_count(&a), 2);
    }
    ```
    Cloning increases the strong count; dropping a clone decreases it.
  compile_status: compiles
  tags:
    - rust-book
    - ch15
    - rc
    - prediction
