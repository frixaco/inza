- id: rust-book-ch05-defining-structs-003
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Defining and Instantiating Structs"
  source: "rust-book/src/ch05-01-defining-structs.md"
  card_type: syntax
  front: |
    What field-name rule does field init shorthand rely on?
  back: |
    ```rust
    struct User {
        username: String,
        active: bool,
    }

    let username = String::from("alice");
    let user = User { username, active: true };
    ```
    The field and local variable have the same name, so `username` means `username: username`.
  compile_status: compiles
