- id: rust-book-ch05-defining-structs-008
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Defining and Instantiating Structs"
  source: "rust-book/src/ch05-01-defining-structs.md"
  card_type: concept_boundary
  front: |
    After struct update syntax moves `user1.username` into `user2`, why can `user1.email` still be used when `email` was explicitly replaced?
  back: |
    Struct update moves only the fields it takes from the source instance. If `email` is explicitly set in `user2`, `user1.email` was not moved by the update.
  compile_status: concept_only
  tags:
    - rust-book
    - ch05
    - defining-structs
    - concept_boundary
- id: rust-book-ch05-defining-structs-009
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Defining and Instantiating Structs"
  source: "rust-book/src/ch05-01-defining-structs.md"
  card_type: prediction
  front: |
    What happens to `user1` if struct update syntax copies only `active: bool` and `sign_in_count: u64` from it?
  back: |
    `user1` remains usable, assuming all non-`Copy` fields were explicitly replaced. `bool` and `u64` implement `Copy`, so using those fields in the update does not move them out of `user1`.
  compile_status: concept_only
  tags:
