- id: rust-book-ch05-defining-structs-016
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Defining and Instantiating Structs"
  source: "rust-book/src/ch05-01-defining-structs.md"
  card_type: syntax
  front: |
    How do you access an individual field of a tuple struct by index?
  back: |
    ```rust
    struct Color(i32, i32, i32);

    fn main() {
        let black = Color(0, 0, 0);
        let red = black.0;
        println!("{red}");
    }
    ```
    Tuple struct fields use dot plus numeric index, like tuple fields.
