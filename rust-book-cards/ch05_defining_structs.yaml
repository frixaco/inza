- id: rust-book-ch05-defining-structs-014
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Defining and Instantiating Structs"
  source: "rust-book/src/ch05-01-defining-structs.md"
  card_type: diagnostic
  front: |
    Why does this struct definition fail as written?
    
    ```rust
    struct User {
        active: bool,
        username: &str,
        email: &str,
        sign_in_count: u64,
    }
    ```
  back: |
    The reference fields need lifetime parameters so Rust can check that the referenced data lives at least as long as the `User` value. The book uses owned `String` fields first so each `User` owns its data.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch05
    - defining-structs
    - diagnostic
- id: rust-book-ch05-defining-structs-015
  chapter: "Chapter 5: Using Structs to Structure Related Data"
  section: "Defining and Instantiating Structs"
  source: "rust-book/src/ch05-01-defining-structs.md"
  card_type: syntax
  front: |
    What does field init shorthand look like in a full `build_user` function?
  back: |
    ```rust
    struct User {
        active: bool,
        username: String,
        email: String,
        sign_in_count: u64,
    }

    fn build_user(email: String, username: String) -> User {
        User {
            active: true,
            username,
            email,
            sign_in_count: 1,
        }
    }
    ```
    `username` and `email` use shorthand because local variables with those names exist.
