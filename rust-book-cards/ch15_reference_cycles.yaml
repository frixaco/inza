- id: rust-book-ch15-reference-cycles-001
  chapter: "Chapter 15: Smart Pointers"
  section: "Reference Cycles Can Leak Memory"
  source: "rust-book/src/ch15-06-reference-cycles.md"
  card_type: definition
  front: |
    What is a reference cycle with `Rc<T>`?
  back: |
    Two or more `Rc<T>` values point to each other so their strong counts never reach zero.
