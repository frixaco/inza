- id: rust-book-ch15-reference-cycles-003
  chapter: "Chapter 15: Smart Pointers"
  section: "Reference Cycles Can Leak Memory"
  source: "rust-book/src/ch15-06-reference-cycles.md"
  card_type: comparison
  front: |
    What is the difference between `Rc<T>` and `Weak<T>`?
  back: |
    `Rc<T>` is a strong owner that keeps data alive. `Weak<T>` is a non-owning reference that does not affect the strong count.
  compile_status: concept_only
  tags:
