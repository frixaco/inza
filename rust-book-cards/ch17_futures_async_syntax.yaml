- id: rust-book-ch17-futures-async-syntax-001
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Futures and the Async Syntax"
  source: "rust-book/src/ch17-01-futures-and-syntax.md"
  card_type: definition
  front: |
    What does a Rust future represent before it completes?
  back: |
    A value representing computation that may not have completed yet and can be polled to make progress.
  compile_status: concept_only
