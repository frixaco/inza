- id: rust-book-ch18-trait-objects-014
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Using Trait Objects to Abstract over Shared Behavior"
  source: "rust-book/src/ch18-02-trait-objects.md"
  card_type: comparison
  front: |
    What does the generic `Screen<T: Draw>` version force that `Vec<Box<dyn Draw>>` does not?
  back: |
    ```rust
    trait Draw {
        fn draw(&self);
    }

    struct Screen<T: Draw> {
        components: Vec<T>,
    }
    ```
    Each `Screen<T>` has one concrete component type `T`; it cannot mix `Button` and `SelectBox` in the same vector.
  compile_status: compiles
