- id: rust-book-ch18-trait-objects-012
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Using Trait Objects to Abstract over Shared Behavior"
  source: "rust-book/src/ch18-02-trait-objects.md"
  card_type: syntax
  front: |
    What does a `Screen` storing heterogeneous drawable components look like?
  back: |
    ```rust
    trait Draw {
        fn draw(&self);
    }

    struct Screen {
        components: Vec<Box<dyn Draw>>,
    }

    impl Screen {
        fn run(&self) {
            for component in self.components.iter() {
                component.draw();
            }
        }
    }
    ```
    `Box<dyn Draw>` lets each component have a different concrete type that implements `Draw`.
  compile_status: compiles
  tags:
    - rust-book
    - ch18
    - trait-objects
    - syntax
- id: rust-book-ch18-trait-objects-013
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Using Trait Objects to Abstract over Shared Behavior"
  source: "rust-book/src/ch18-02-trait-objects.md"
  card_type: diagnostic
  front: |
    Why does this fail?
    
    ```rust
    trait Draw {
        fn draw(&self);
    }

    struct Screen {
        components: Vec<Box<dyn Draw>>,
    }

    fn main() {
        let screen = Screen {
            components: vec![Box::new(String::from("button"))],
        };
    }
    ```
  back: |
    `String` does not implement `Draw`, so `Box<String>` cannot be coerced to `Box<dyn Draw>`.
  compile_status: expected_failure
