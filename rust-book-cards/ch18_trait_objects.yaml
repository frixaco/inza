- id: rust-book-ch18-trait-objects-009
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Using Trait Objects to Abstract over Shared Behavior"
  source: "rust-book/src/ch18-02-trait-objects.md"
  card_type: definition
  front: |
    What does dynamic dispatch choose at runtime?
  back: |
    Method selection happens at runtime using metadata in the trait object, because the compiler does not know the concrete type being called at compile time.
  compile_status: concept_only
