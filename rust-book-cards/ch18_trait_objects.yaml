- id: rust-book-ch18-trait-objects-010
  chapter: "Chapter 18: Object Oriented Programming Features"
  section: "Using Trait Objects to Abstract over Shared Behavior"
  source: "rust-book/src/ch18-02-trait-objects.md"
  card_type: comparison
  front: |
    What tradeoff does dynamic dispatch introduce compared with static dispatch?
  back: |
    Dynamic dispatch adds a runtime lookup and prevents some compiler optimizations, but it allows heterogeneous values behind one trait-object type.
