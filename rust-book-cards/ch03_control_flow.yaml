- id: rust-book-ch03-control-flow-011
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Control Flow"
  source: "rust-book/src/ch03-05-control-flow.md"
  card_type: syntax
  front: |
    What range syntax does the book use to count down from 3 to 1?
  back: |
    ```rust
    for number in (1..4).rev() {
        println!("{number}!");
    }
    ```
    The range `1..4` excludes 4, and `rev()` reverses the iterator.
  compile_status: compiles
  tags:
    - rust-book
    - ch03
    - control-flow
    - syntax
- id: rust-book-ch03-control-flow-012
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Control Flow"
  source: "rust-book/src/ch03-05-control-flow.md"
  card_type: syntax
  front: |
    What is the basic syntax of a `while` loop?
  back: |
    ```rust
    let mut number = 3;

    while number != 0 {
        println!("{number}!");
        number -= 1;
    }
    ```
    The loop runs while the condition evaluates to `true`.
  compile_status: compiles
  tags:
    - rust-book
    - ch03
    - control-flow
    - syntax
- id: rust-book-ch03-control-flow-013
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Control Flow"
  source: "rust-book/src/ch03-05-control-flow.md"
  card_type: diagnostic
  front: |
    Why is manually iterating over an array with `while index < a.len()` more error-prone than `for element in a`?
  back: |
    Manual indexing can use the wrong length or index and cause a runtime panic. A `for` loop over the collection avoids explicit indexing for this case.
  compile_status: concept_only
  tags:
    - rust-book
    - ch03
    - control-flow
    - diagnostic
