- id: rust-book-ch03-control-flow-008
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Control Flow"
  source: "rust-book/src/ch03-05-control-flow.md"
  card_type: comparison
  front: |
    What is the difference between `break` and `continue` in a loop?
  back: |
    `break` exits the current loop. `continue` skips the rest of the current iteration and starts the next iteration.
  compile_status: concept_only
  tags:
    - rust-book
    - ch03
    - control-flow
    - comparison
