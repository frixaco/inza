- id: rust-book-ch03-control-flow-003
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Control Flow"
  source: "rust-book/src/ch03-05-control-flow.md"
  card_type: diagnostic
  front: |
    Why do the two branches of an `if` expression used in `let x = if ...` need compatible types?
  back: |
    The `let` binding must have one type. If one branch returns an integer and the other returns a string, Rust cannot assign a single type to the expression.
  compile_status: concept_only
  tags:
    - rust-book
    - ch03
    - control-flow
    - diagnostic
