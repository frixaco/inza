- id: rust-book-ch03-control-flow-001
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Control Flow"
  source: "rust-book/src/ch03-05-control-flow.md"
  card_type: diagnostic
  front: |
    Why does this fail?
    
    ```rust
    fn main() {
        let number = 3;
        if number {
            println!("number was three");
        }
    }
    ```
  back: |
    An `if` condition must be a `bool`. Rust does not automatically convert integers to Booleans.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch03
    - control-flow
    - diagnostic
- id: rust-book-ch03-control-flow-002
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Control Flow"
  source: "rust-book/src/ch03-05-control-flow.md"
  card_type: prediction
  front: |
    What does this code assign to `number`?
    
    ```rust
    fn main() {
        let condition = true;
        let number = if condition { 5 } else { 6 };
    }
    ```
  back: |
    `number` gets `5`. `if` is an expression, and both branches produce the same type.
  compile_status: compiles
