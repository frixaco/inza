- id: rust-book-ch12-modularity-error-handling-008
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Refactoring to Improve Modularity and Error Handling"
  source: "rust-book/src/ch12-03-improving-error-handling-and-modularity.md"
  card_type: misconception
  front: |
    Why is cloning the query and file path acceptable in the early `Config` refactor?
  back: |
    It copies a few small strings once and avoids lifetime complexity while the program is being refactored. The book later improves this with iterators.
