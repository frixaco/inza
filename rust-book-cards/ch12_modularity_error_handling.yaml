- id: rust-book-ch12-modularity-error-handling-001
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Refactoring to Improve Modularity and Error Handling"
  source: "rust-book/src/ch12-03-improving-error-handling-and-modularity.md"
  card_type: project_architecture
  front: |
    Why move argument parsing into a `Config` struct?
  back: |
    It names the parsed settings, keeps related values together, and separates configuration from program execution.
