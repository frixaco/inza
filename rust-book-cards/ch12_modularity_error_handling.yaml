- id: rust-book-ch12-modularity-error-handling-004
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Refactoring to Improve Modularity and Error Handling"
  source: "rust-book/src/ch12-03-improving-error-handling-and-modularity.md"
  card_type: concept_boundary
  front: |
    Why use `unwrap_or_else` on `Config::build(args)`?
  back: |
    It handles the error lazily with a closure, printing the problem and exiting only when parsing fails.
