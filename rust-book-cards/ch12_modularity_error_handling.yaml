- id: rust-book-ch12-modularity-error-handling-012
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Refactoring to Improve Modularity and Error Handling"
  source: "rust-book/src/ch12-03-improving-error-handling-and-modularity.md"
  card_type: evolution
  front: |
    What changes when the minigrep logic moves from `main.rs` into `lib.rs`?
  back: |
    The binary crate keeps CLI setup and error reporting, while the library crate owns the searchable logic and can be tested with ordinary unit tests.
