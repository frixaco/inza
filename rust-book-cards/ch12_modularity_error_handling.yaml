- id: rust-book-ch12-modularity-error-handling-011
  chapter: "Chapter 12: An I/O Project: Building a Command Line Program"
  section: "Refactoring to Improve Modularity and Error Handling"
  source: "rust-book/src/ch12-03-improving-error-handling-and-modularity.md"
  card_type: concept_boundary
  front: |
    Why does `run` return `Ok(())` on success?
  back: |
    The function's useful work is side effects such as printing matches, so the success case has no value to return; `()` communicates that.
  compile_status: concept_only
