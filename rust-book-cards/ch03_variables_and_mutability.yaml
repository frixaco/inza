- id: rust-book-ch03-variables-and-mutability-008
  chapter: "Chapter 3: Common Programming Concepts"
  section: "Variables and Mutability"
  source: "rust-book/src/ch03-01-variables-and-mutability.md"
  card_type: prediction
  front: |
    What happens to an outer binding after an inner scope shadows it?
  back: |
    The inner binding controls the name until the inner scope ends. After that, the name refers to the outer binding again.
  compile_status: concept_only
  tags:
    - rust-book
    - ch03
    - variables-and-mutability
