  card_type: api_recall
  front: |
    Which string method supports case-insensitive comparison in the book implementation?
  back: |
    ```rust
    fn matches_case_insensitive(query: &str, line: &str) -> bool {
        let query = query.to_lowercase();
        line.to_lowercase().contains(&query)
    }
    ```
    `to_lowercase()` is applied to the query and each line before `contains`.
