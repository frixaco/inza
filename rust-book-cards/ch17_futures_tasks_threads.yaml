- id: rust-book-ch17-futures-tasks-threads-003
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Futures, Tasks, and Threads"
  source: "rust-book/src/ch17-06-futures-tasks-threads.md"
  card_type: concept_boundary
  front: |
    When are async tasks especially useful compared with OS threads?
  back: |
    For I/O-bound work with many operations that spend time waiting, because tasks can yield instead of blocking threads.
