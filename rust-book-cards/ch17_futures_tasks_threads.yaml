- id: rust-book-ch17-futures-tasks-threads-005
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Futures, Tasks, and Threads"
  source: "rust-book/src/ch17-06-futures-tasks-threads.md"
  card_type: comparison
  front: |
    Why does the book say the choice is often threads and async, not threads or async?
  back: |
    Runtimes can run many async tasks across multiple threads, and blocking or CPU-heavy work can be moved to dedicated threads while async code waits for results.
  compile_status: concept_only
  tags:
    - rust-book
    - ch17
    - futures-tasks-threads
    - comparison
- id: rust-book-ch17-futures-tasks-threads-006
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Futures, Tasks, and Threads"
  source: "rust-book/src/ch17-06-futures-tasks-threads.md"
  card_type: concept_boundary
  front: |
    Why are async tasks called lightweight compared with OS threads?
  back: |
    Tasks are managed by the runtime rather than the operating system and can be multiplexed onto fewer threads with less per-task overhead.
  compile_status: concept_only
  tags:
    - rust-book
