- id: rust-book-ch17-futures-tasks-threads-002
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Futures, Tasks, and Threads"
  source: "rust-book/src/ch17-06-futures-tasks-threads.md"
  card_type: concept_boundary
  front: |
    When are threads more appropriate than async tasks?
  back: |
    Use threads for CPU-bound parallelism or blocking work unless the runtime provides dedicated blocking APIs.
