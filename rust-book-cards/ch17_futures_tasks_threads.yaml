- id: rust-book-ch17-futures-tasks-threads-004
  chapter: "Chapter 17: Fundamentals of Asynchronous Programming: Async, Await, Futures, and Streams"
  section: "Futures, Tasks, and Threads"
  source: "rust-book/src/ch17-06-futures-tasks-threads.md"
  card_type: definition
  front: |
    What runtime component manages tasks in async Rust?
  back: |
    A runtime, specifically its executor, schedules and polls tasks. Tasks then manage the futures inside them.
  compile_status: concept_only
