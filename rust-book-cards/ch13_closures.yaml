- id: rust-book-ch13-closures-005
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Closures"
  source: "rust-book/src/ch13-01-closures.md"
  card_type: syntax
  front: |
    What does `move` do before a closure?
  back: |
    ```rust
    let list = vec![1, 2, 3];
    std::thread::spawn(move || println!("{list:?}"))
        .join()
        .unwrap();
    ```
    It forces the closure to take ownership of captured values instead of borrowing them.
  compile_status: compiles
  tags:
