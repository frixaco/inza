- id: rust-book-ch13-closures-009
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Closures"
  source: "rust-book/src/ch13-01-closures.md"
  card_type: diagnostic
  front: |
    Why can printing `list` between defining and calling a closure that mutably borrows `list` fail?
  back: |
    ```rust
    fn main() {
        let mut list = vec![1, 2, 3];
        let mut borrows_mutably = || list.push(7);
        println!("{list:?}");
        borrows_mutably();
    }
    ```
    The closure's mutable borrow is active between its definition and last use. An immutable borrow for `println!` cannot overlap with that mutable borrow.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch13
    - closures
    - diagnostic
- id: rust-book-ch13-closures-010
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Closures"
  source: "rust-book/src/ch13-01-closures.md"
  card_type: concept_boundary
  front: |
    Why does `Option::unwrap_or_else` use an `FnOnce() -> T` bound?
  back: |
    It calls the closure at most once, only in the `None` case. `FnOnce` accepts the widest set of closures, including closures that consume captured values.
  compile_status: concept_only
