- id: rust-book-ch13-closures-001
  chapter: "Chapter 13: Functional Language Features: Iterators and Closures"
  section: "Closures"
  source: "rust-book/src/ch13-01-closures.md"
  card_type: definition
  front: |
    What can a Rust closure capture that a plain function cannot?
  back: |
    Closures can capture values from their surrounding environment; a plain `fn` cannot.
