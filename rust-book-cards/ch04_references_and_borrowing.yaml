- id: rust-book-ch04-references-and-borrowing-009
  chapter: "Chapter 4: Understanding Ownership"
  section: "References and Borrowing"
  source: "rust-book/src/ch04-02-references-and-borrowing.md"
  card_type: diagnostic
  front: |
    Why does this fail?

    ```rust
    fn change(some_string: &String) {
        some_string.push_str(", world");
    }
    ```
  back: |
    References are immutable by default. To mutate through a borrow, the caller must pass `&mut String` and the parameter must be `some_string: &mut String`.
  compile_status: expected_failure
  tags:
    - rust-book
    - ch04
    - references-and-borrowing
    - diagnostic
- id: rust-book-ch04-references-and-borrowing-010
  chapter: "Chapter 4: Understanding Ownership"
  section: "References and Borrowing"
  source: "rust-book/src/ch04-02-references-and-borrowing.md"
  card_type: syntax
  front: |
    What are the caller and parameter syntaxes for a mutable reference to a `String`?
  back: |
    ```rust
    fn change(some_string: &mut String) {
        some_string.push_str(", world");
    }

    fn main() {
        let mut s = String::from("hello");
        change(&mut s);
    }
    ```
  compile_status: compiles
  tags:
    - rust-book
    - ch04
    - references-and-borrowing
    - syntax
- id: rust-book-ch04-references-and-borrowing-011
  chapter: "Chapter 4: Understanding Ownership"
  section: "References and Borrowing"
  source: "rust-book/src/ch04-02-references-and-borrowing.md"
  card_type: misconception
  front: |
    Do immutable borrows last until the end of the enclosing block no matter what?
  back: |
    No. A reference's scope lasts from creation through its last use. After the last use, a later non-overlapping mutable borrow can be allowed.
  compile_status: concept_only
  tags:
    - rust-book
    - ch04
    - references-and-borrowing
    - misconception
- id: rust-book-ch04-references-and-borrowing-012
  chapter: "Chapter 4: Understanding Ownership"
  section: "References and Borrowing"
  source: "rust-book/src/ch04-02-references-and-borrowing.md"
  card_type: invariant
  front: |
    What are the two rules of references summarized by the book?
  back: |
    At any given time, you can have either one mutable reference or any number of immutable references. References must always be valid.
