- id: rust-book-ch08-common-collections-001
  chapter: "Chapter 8: Common Collections"
  section: "Common Collections"
  source: "rust-book/src/ch08-00-common-collections.md"
  card_type: definition
  front: |
    What distinguishes the common collections from fixed stack data like arrays?
  back: |
    Collections such as vectors, strings, and hash maps store data on the heap and can grow or shrink at runtime.
