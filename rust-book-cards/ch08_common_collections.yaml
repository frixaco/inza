- id: rust-book-ch08-common-collections-002
  chapter: "Chapter 8: Common Collections"
  section: "Common Collections"
  source: "rust-book/src/ch08-00-common-collections.md"
  card_type: comparison
  front: |
    Which collection would you choose for an ordered list, text, and key-value lookup?
  back: |
    Use `Vec<T>` for an ordered list, `String` for UTF-8 text, and `HashMap<K, V>` for key-value lookup.
  compile_status: concept_only
